<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Builder — Synthesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2937;
    --ink-soft:#4B5768;
    --board:#1D2B3A;
    --board-2:#26394C;
    --paper:#F6F1E4;
    --paper-2:#EFE6CE;
    --lane-a:#2E8B84;   --lane-a-soft:#DCEEEC; --lane-a-line:#bfe0dc;
    --lane-b:#6C63A6;   --lane-b-soft:#E8E4F5; --lane-b-line:#d3cdec;
    --lane-c:#B9791F;   --lane-c-soft:#F5E8CE; --lane-c-line:#e8d4a4;
    --lane-d:#A15B78;   --lane-d-soft:#F3E2EA; --lane-d-line:#e9cdd9;
    --pin:#B08A3E;
    --line: rgba(31,41,55,.14);
    --shadow: 0 10px 28px rgba(8,12,20,.22);
    --shadow-sm: 0 3px 10px rgba(8,12,20,.14);
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: 'Work Sans', system-ui, -apple-system, sans-serif;
    --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'Work Sans', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0) 0 0/22px 22px,
      linear-gradient(180deg, var(--board), var(--board-2));
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.02em;}
  h1{font-weight:700;}
  h2{font-weight:500;}
  h3{font-weight:600;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:15px; color:var(--ink);}
  a{color:inherit;}
  ::selection{background:var(--lane-b-soft);}
  :focus-visible{outline:3px solid #F2C572; outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#B9C4D0;}
  .eyebrow.dark{color:var(--ink-soft);}
  .glass-pill{
    display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16); border-radius:9999px; padding:8px 18px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .home-hero .eyebrow{font-size:11.5px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    padding:11px 18px; border-radius:999px; border:1.5px solid transparent;
    font-weight:600; font-size:14.5px; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink); color:var(--paper); box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:#31404f;}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:rgba(31,41,55,.06);}
  .btn-ghost-light{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#F2EEE1;}
  .btn-ghost-light:hover{background:rgba(255,255,255,.16);}
  .btn-small{padding:6px 12px; font-size:12.5px; border-radius:999px;}
  .btn-icon{width:32px; height:32px; padding:0; border-radius:999px; border:1.5px solid var(--line); background:#fff;}
  .btn-danger-text{color:#9B3B34; background:transparent; border:none; font-size:13px; font-weight:600;}

  /* ---------- Home ---------- */
  .home-wrap{max-width:1140px; margin:0 auto; padding:64px 24px 80px;}
  .home-hero{text-align:center; color:#F2EEE1; margin-bottom:44px;}
  .home-hero h1{
    font-size:clamp(30px,5vw,46px); margin:14px 0 12px; line-height:1.14;
    color:#fff;
    background-image:linear-gradient(165deg, #ffffff 35%, rgba(255,255,255,.42));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .home-hero p{color:#C7D2DD; font-size:16.5px; max-width:520px; margin:0 auto;}
  .home-hero .visibility-note{color:#93A2B3; font-size:13px; max-width:460px; margin:12px auto 0;}
  .home-cards{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:720px){.home-cards{grid-template-columns:1fr;}}
  .home-cards.single{display:flex; justify-content:center;}
  .home-cards.single .home-card{max-width:460px; width:100%;}
  .home-card{
    background:var(--paper); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow);
    border-top:6px solid var(--lane-a);
    position:relative;
  }
  .home-card h3{font-size:20px; margin-bottom:6px;}
  .home-card p{color:var(--ink-soft); font-size:14px; margin-bottom:18px; line-height:1.5;}
  .home-card-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .field input[type=text], .field textarea, .field select{
    width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{border-color:var(--ink-soft);}
  .field textarea{resize:vertical; min-height:70px; line-height:1.45;}
  .field .hint{font-size:12px; color:#8B94A0; margin-top:5px; font-weight:400; text-transform:none; letter-spacing:0;}
  .home-footer-link{display:block; text-align:center; margin-top:36px; color:#C7D2DD; font-size:13.5px; text-decoration:underline; text-underline-offset:3px;}
  .home-footer-link:hover{color:#fff;}
  .resume-matches{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .resume-match-row{
    background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer;
  }
  .resume-match-row:hover{border-color:var(--ink-soft);}
  .resume-match-row h4{font-size:14px; margin:0;}
  .resume-match-row p{font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); margin:2px 0 0;}
  .resume-match-row.with-actions{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .resume-match-actions{display:flex; gap:6px; flex-shrink:0;}
  .resume-match-actions .btn-icon{width:28px; height:28px; font-size:13px;}
  .example-sessions{max-width:460px; margin:30px auto 0; text-align:center;}
  .example-sessions h3{color:#fff; font-size:15px; margin-bottom:4px;}
  .example-sessions p{color:#93A2B3; font-size:13px; margin-bottom:14px;}
  .example-sessions .resume-matches{margin-top:0; text-align:left;}

  /* ---------- Shell (after a draft is loaded) ---------- */
  .shell{display:flex; min-height:100vh;}
  .rail{
    width:220px; flex-shrink:0; background:rgba(0,0,0,.18); padding:22px 14px; display:flex; flex-direction:column;
    border-right:1px solid rgba(255,255,255,.08);
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rail-code{font-family:var(--font-mono); font-size:11px; color:#9FB0C0; letter-spacing:.06em; margin-bottom:2px;}
  .rail-name{color:#fff; font-weight:600; font-size:14.5px; margin-bottom:18px;}
  .rail-step{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; color:#C7D2DD; font-size:13.5px;
    margin-bottom:2px; font-weight:500;
  }
  .rail-step .dot{width:7px; height:7px; border-radius:50%; background:#4A5C6E; flex-shrink:0;}
  .rail-step.active{background:rgba(255,255,255,.12); color:#fff;}
  .rail-step.active .dot{background:#F2C572;}
  .rail-step.done .dot{background:var(--lane-a);}
  .rail-step:hover{background:rgba(255,255,255,.08); cursor:pointer;}
  .rail-scenarios{margin:6px 0 10px 0; padding-left:4px; border-left:1.5px solid rgba(255,255,255,.14); margin-left:13px;}
  .rail-spacer{flex:1;}
  .rail-bottom{display:flex; flex-direction:column; gap:8px;}
  .rail-save-indicator{
    font-family:var(--font-mono); font-size:11px; color:#7C8CA0; padding:0 10px 8px; display:block;
    transition:color .15s ease;
  }
  .rail-save-indicator.unsaved{color:#E0A94C;}
  .rail-save-indicator.saving{color:#9FB0C0;}
  .rail-save-indicator.saved{color:#6FAE9F;}
  .rail-save-indicator.failed{color:#E08A7D; font-weight:600;}

  .main{flex:1; min-width:0; padding:34px 40px 120px; max-width:1140px; margin:0 auto;}
  @media (max-width:860px){
    .shell{flex-direction:column;}
    .rail{width:100%; flex-direction:row; align-items:center; overflow-x:auto; overflow-y:visible; padding:12px 16px; gap:14px; height:auto; top:0;}
    .rail-scenarios{display:none;}
    .rail-name, .rail-code{display:none;}
    .rail-spacer{display:none;}
    .rail-bottom{flex-direction:row;}
    .rail-save-indicator{padding:0 4px; white-space:nowrap;}
    .main{padding:22px 18px 140px; margin:0;}
  }

  .page-head{margin-bottom:26px;}
  .page-head h2{color:#fff; font-size:clamp(24px,3vw,30px); margin:6px 0 8px;}
  .page-head p{color:#C7D2DD; font-size:14.5px; line-height:1.5;}

  .panel{background:var(--paper); border-radius:var(--radius); padding:26px 28px; box-shadow:var(--shadow); margin-bottom:20px; container-type:inline-size;}
  .panel h3{font-size:17px; margin-bottom:14px;}
  .row{display:flex; gap:14px;}
  .row > *{flex:1;}
  @media (max-width:600px){.row{flex-direction:column;}}

  .radio-cards{display:flex; gap:10px;}
  .radio-card{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; text-align:center;
    font-weight:600; font-size:14px; background:#fff; transition:all .12s ease;
  }
  .radio-card.selected{border-color:var(--ink); background:var(--paper-2); box-shadow:inset 0 0 0 1.5px var(--ink);}

  /* ---------- Storyboard ---------- */
  .board{
    background:var(--board); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0);
    background-size:16px 16px;
  }
  .board-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}
  @media (max-width:700px){.board-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:460px){.board-grid{grid-template-columns:1fr;}}
  .index-card{
    background:var(--paper); border-radius:10px; padding:16px; min-height:130px; box-shadow:0 6px 14px rgba(0,0,0,.35);
    position:relative; cursor:grab; transform:rotate(var(--r,0deg)); transition:transform .12s ease;
    border:1px solid rgba(0,0,0,.06);
  }
  .index-card:hover{transform:rotate(0deg) translateY(-2px);}
  .index-card.dragging{opacity:.4;}
  .index-card .pin{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #E4C77E, var(--pin)); box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .index-card .num{
    font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.05em;
    color:#fff; background:var(--ink); display:inline-block; padding:3px 9px; border-radius:6px;
    margin-bottom:10px;
  }
  .index-card h4{font-size:15.5px; margin-bottom:6px; line-height:1.25;}
  .index-card .domain-chip{
    display:inline-block; font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft); margin-top:8px;
  }
  .index-card .empty{color:#A69A78; font-size:13px; font-style:italic;}

  .index-card.halftime-card{border:1.5px dashed var(--pin); cursor:pointer;}
  .index-card.halftime-card .num{background:var(--pin);}
  .index-card.halftime-card .halftime-pin{
    position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:17px; line-height:1;
  }

  .domain-panel{
    margin-top:18px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:16px 18px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .domain-panel h4{color:#fff; font-size:13px; margin-bottom:10px; font-family:var(--font-body); font-weight:600;}
  .domain-list{display:flex; flex-wrap:wrap; gap:8px;}
  .domain-pill{
    font-size:12.5px; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.10); color:#C7D2DD;
    display:flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .domain-pill.covered{background:rgba(46,139,132,.30); color:#CDEDE9; border-color:rgba(46,139,132,.4);}

  /* ---------- Scenario editor ---------- */
  .lanes{display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:6px;}
  /* Step the option-card grid up to 2, then 3/4 columns as the panel widens, instead of
     squeezing every lane into one unwrapped row (which forced lanes past their own
     min-content width and let them spill past the panel's edge). */
  @container (min-width:480px){
    .lanes-2, .lanes-3, .lanes-4{grid-template-columns:repeat(2, minmax(240px,1fr));}
  }
  @container (min-width:480px) and (max-width:739.98px){
    .lanes-3 .lane:last-child{grid-column:1 / -1;} /* odd one out spans full width instead of leaving a dead half-row */
  }
  @container (min-width:740px){
    .lanes-3{grid-template-columns:repeat(3, minmax(240px,1fr));}
  }
  @container (min-width:1050px){
    .lanes-4{grid-template-columns:repeat(4, minmax(240px,1fr));}
  }
  .lane, .lane *{min-width:0;}
  .lane{
    border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:9px;
    border-top:6px solid var(--c); background:var(--soft); cursor:grab; position:relative;
  }
  .lane.dragging{opacity:.45;}
  .lane .lane-head{display:flex; align-items:center; justify-content:space-between;}
  .lane .lane-tag{
    font-family:var(--font-mono); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:#fff; background:var(--c); display:inline-block; padding:3px 9px; border-radius:6px;
  }
  .lane .move-btns{display:flex; gap:4px;}
  .lane .move-btns button{width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:#fff; font-size:11px; line-height:1; padding:0;}
  .icon-desc-box{display:flex; align-items:center; gap:8px; align-self:stretch;}
  .icon-desc-glyph{
    width:38px; height:38px; border-radius:10px; background:#fff; border:1.5px dashed var(--line); color:#B9AF8E;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
  }
  .icon-desc-glyph svg{width:20px; height:20px;}
  .icon-desc-glyph img{width:100%; height:100%; object-fit:cover; border-radius:8px;}
  .icon-desc-clear{
    position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%; padding:0;
    background:#fff; border:1.5px solid var(--line); color:var(--ink-soft); font-size:9px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-desc-clear:hover{color:#9B3B34; border-color:#9B3B34;}
  .icon-desc-box input[type=text]{font-weight:500; font-style:italic; font-size:13px; flex:1;}
  .btn-icon-search{
    flex-shrink:0; padding:7px 12px; font-size:12px; font-weight:600; border-radius:8px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  }
  .btn-icon-search:hover{background:rgba(31,41,55,.06);}
  .lane input[type=text]{background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-weight:600;}
  .lane textarea{background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; min-height:150px; line-height:1.42; font-size:13.8px;}
  .wc{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); text-align:right;}

  .balance-strip{
    margin-top:4px; padding:14px 16px; border-radius:10px; background:#fff; border:1.5px solid var(--line);
    font-size:13px; color:var(--ink-soft); margin-bottom:22px;
  }
  .balance-strip .bs-title{display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink); margin-bottom:8px;}
  .balance-strip .b-icon{font-size:16px;}
  .balance-strip ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px;}
  .balance-strip li{line-height:1.4;}

  .qlist{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
  .qrow{display:flex; gap:8px; align-items:center;}
  .qrow input{flex:1;}
  .qrow button{flex-shrink:0;}
  .add-row-btn{font-size:13px; font-weight:600; color:var(--ink-soft); background:none; border:1.5px dashed var(--line); border-radius:8px; padding:8px 12px; text-align:left;}
  .add-row-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .scenario-nav{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}

  /* ---------- Review ---------- */
  .print-card{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:34px; margin-bottom:20px;}
  .print-card .p-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#9B8F6E;}
  .print-card h2.p-title{font-size:30px; margin:6px 0 10px;}
  .print-card .p-blurb{font-size:15px; line-height:1.6; color:#3c3527; margin-bottom:4px;}
  .p-scenario{padding:18px 0; border-top:1px solid var(--line);}
  .p-scenario h4{font-size:17px; margin-bottom:6px; display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .p-preview-link{font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--lane-a); cursor:pointer; white-space:nowrap; margin-left:auto;}
  .p-preview-link:hover{text-decoration:underline;}
  .p-scenario .p-setup{font-size:14.5px; line-height:1.55; margin-bottom:12px; color:#3c3527;}
  .p-opts{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .p-opt{display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border-radius:9px; border-left:5px solid var(--c); background:var(--soft);}
  .p-opt .p-opt-icon{width:44px; height:44px; flex-shrink:0; color:var(--c); background:#fff; border-radius:8px; padding:6px; box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .p-opt .p-opt-icon svg{width:100%; height:100%;}
  .p-opt .p-opt-icon img{width:100%; height:100%; object-fit:contain;}
  .p-icon-desc{display:block; font-size:12px; font-style:italic; color:#8a7f5e; margin-top:4px;}
  .p-opt b{font-size:14px;}
  .p-opt span{display:block; font-size:13.5px; color:#3c3527; margin-top:2px;}
  .p-q-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:#9B8F6E; margin:10px 0 4px;}
  .p-cqs{font-size:13.5px; line-height:1.9; color:#3c3527;}
  .p-refl{font-size:13.5px; font-style:italic; color:#3c3527;}
  .p-half{padding:18px 0; border-top:2px dashed var(--line);}

  .review-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
  .status-badge{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:5px 11px; border-radius:999px; font-weight:600;}
  .status-draft{background:var(--lane-b-soft); color:#403A6E;}
  .status-submitted{background:var(--lane-c-soft); color:#7A5A16;}
  .status-reviewed{background:var(--lane-a-soft); color:#1E5B56;}
  .status-flagged{background:#F5D4CF; color:#8A241A;}

  .coach-notes{background:#fff; border-radius:10px; padding:16px 18px; border:1.5px solid var(--line);}
  .coach-note{padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.8px; line-height:1.5;}
  .coach-note:last-child{border-bottom:none;}
  .coach-note .cn-meta{font-family:var(--font-mono); font-size:10.5px; color:#8B94A0; margin-bottom:3px;}

  /* ---------- Coach drawer ---------- */
  .coach-tab{
    position:fixed; right:0; top:calc(50% + 68px); transform:translateY(-50%) rotate(0deg); z-index:40;
    background:var(--ink); color:#F2EEE1; padding:14px 12px; border-radius:12px 0 0 12px; box-shadow:var(--shadow);

<script>
  // Bridges the app's window.storage.get/set/list calls (used throughout the IIFE
  // below) to /api/storage, a small serverless shim over a Redis database — see
  // api/storage.js. Must run before the main script, since that script checks
  // `typeof window.storage` once at load time.
  window.storage = (function(){
    // The coach token, not the coach password, is what lives in the browser — and in
    // sessionStorage rather than localStorage, so closing the tab signs you out. That
    // matters because the password is shared: a token leak is one tab for a few hours,
    // whereas a leaked password would have to be re-issued to every coach.
    var TOKEN_HEADER = 'x-coach-token';
    var TOKEN_STORE_KEY = 'coachToken';
    var token = null;
    try { token = sessionStorage.getItem(TOKEN_STORE_KEY); } catch(e){ token = null; }

    function setToken(t){
      token = t || null;
      try {
        if(token) sessionStorage.setItem(TOKEN_STORE_KEY, token);
        else sessionStorage.removeItem(TOKEN_STORE_KEY);
      } catch(e){ /* private mode / storage disabled: token stays in memory only */ }
    }

    function call(body){
      var headers = {'Content-Type': 'application/json'};
      if(token) headers[TOKEN_HEADER] = token;
      return fetch('/api/storage', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body)
      }).then(function(res){
        if(!res.ok){
          return res.json().catch(function(){ return {}; }).then(function(err){
            var e = new Error(err.error || ('Storage request failed: '+res.status));
            // Flagged so callers can bounce to the sign-in screen rather than showing
            // a generic "storage is down" banner for what is really an expired token.
            if(res.status===401){ setToken(null); e.authRequired = true; }
            throw e;
          });
        }
        return res.json();
      });
    }

    return {
      get: function(key){ return call({op:'get', key:key}); },
      set: function(key, value){ return call({op:'set', key:key, value:value}); },
      delete: function(key){ return call({op:'delete', key:key}); },
      list: function(prefix){ return call({op:'list', key:prefix}); },
      listByUser: function(prefix, username){ return call({op:'listByUser', key:prefix, username:username}); },
      coachLogin: function(password){
        return call({op:'coachLogin', password:password}).then(function(r){
          setToken(r && r.token);
          return r;
        });
      },
      hasCoachToken: function(){ return !!token; },
      coachSignOut: function(){ setToken(null); }
    };
  })();
</script>

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function genCode(){
  var alpha = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var s = '';
  for(var i=0;i<5;i++){ s += alpha[Math.floor(Math.random()*alpha.length)]; }
  return s;
}
function wordCount(t){ t=(t||'').trim(); return t? t.split(/\s+/).length : 0; }
var isDirty = false;
function debounceSave(){
  isDirty = true;
  setSaveIndicator('unsaved');
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 600);
}
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  if(state.draft && isDirty) saveDraft();
  if(notesSaveTimer){ clearTimeout(notesSaveTimer); notesSaveTimer = null; }
  if(state.draft && notesDirty) saveNotes();
}
function downloadText(filename, text){
  var blob = new Blob([text], {type:'text/markdown'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function timeAgo(ts){
  if(!ts) return '';
  var s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

  var opts = [];
  var n = (state.draft && state.draft.optionCount) || 3;

    reflection:{question:'', options:['',''], reflection:''},
    aiChat: [],

    coachMessage: ''
  };
  for(var i=0;i<6;i++) d.scenarios.push(newScenario.call(null));

  return d;
}

var saveStatus = 'saved'; // 'saved' | 'unsaved' | 'saving' | 'failed'
function saveStatusText(status){
  return status==='saved' ? 'Saved ✓' : status==='saving' ? 'Saving…' : status==='failed' ? '⚠ Save failed' : 'Unsaved changes…';
}
function setSaveIndicator(status){
  saveStatus = status;
  var el = document.getElementById('saveIndicator');
  if(!el) return;
  el.className = 'rail-save-indicator '+status;
  el.textContent = saveStatusText(status);
}
function saveDraft(){
  if(!hasStorage || !state.draft) return;
  isDirty = false;
  state.draft.updatedAt = Date.now();
  setSaveIndicator('saving');
  window.storage.set('draft:'+state.draft.id, JSON.stringify(state.draft), true).then(function(){
    setSaveIndicator('saved');
  }).catch(function(e){
    console.error('save failed', e);
    isDirty = true;
    setSaveIndicator('failed');
  });
}
function patchLegacyDraft(d){
  if(!d) return d;
  if(typeof d.bigIdea !== 'string') d.bigIdea = d.blurb || '';
  if(!Array.isArray(d.customDomains)) d.customDomains = [];
  if(!Array.isArray(d.coachNotes)) d.coachNotes = [];
  if(!Array.isArray(d.aiChat)) d.aiChat = [];
  if(typeof d.coachMessage !== 'string') d.coachMessage = '';
  (d.scenarios||[]).forEach(function(sc){
    (sc.options||[]).forEach(function(o, oi){
      if(typeof o.iconDescription !== 'string'){
        o.iconDescription = o.icon ? (LEGACY_ICON_LABELS[o.icon] || '') : '';
      }
      if(typeof o.selectedIcon === 'undefined') o.selectedIcon = null;
      if(typeof o.colorIndex !== 'number') o.colorIndex = oi;
    });
  });
  return d;
}
function loadDraft(code){
  if(!hasStorage) return Promise.resolve(null);
  return window.storage.get('draft:'+code.trim().toUpperCase(), true)
    .then(function(r){ return r ? patchLegacyDraft(JSON.parse(r.value)) : null; })
    .catch(function(){ return null; });
}
function listAllDrafts(){
  if(!hasStorage) return Promise.resolve([]);
  return window.storage.list('draft:', true).then(function(r){
    var keys = (r && r.keys) || [];
    return Promise.all(keys.map(function(k){
      return window.storage.get(k, true).then(function(res){
        try{ return patchLegacyDraft(JSON.parse(res.value)); }catch(e){ return null; }
      });
    }));
  }).then(function(list){
    return list.filter(Boolean).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  });
}

// Resume-by-username. The server does the matching and returns only this student's
// drafts — the browser never receives anyone else's. That's what allows the raw
// `list` op to be coach-only without breaking resume; see api/storage.js.
function listDraftsForUser(username){
  if(!hasStorage) return Promise.resolve([]);
  return window.storage.listByUser('draft:', username).then(function(r){
    var drafts = (r && r.drafts) || [];
    return drafts.map(patchLegacyDraft).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  });
}

// Fixed ids (not host genCode() output) so re-checking "does this already exist" is
// idempotent across reloads/coaches, instead of reseeding a fresh copy every time.
var EXAMPLE_INBOX_IDS = {heartMindGut: 'EXAMPLE-HMG', askOrGuess: 'EXAMPLE-AOG'};
// Makes sure the two example sessions exist as real, persisted drafts so they show up
// in the coach inbox like any submitted draft — reviewable, notable, markable. Only
// writes a key the first time it's missing; never overwrites a coach's own edits/notes
// on a previously-seeded copy.
function ensureExampleDraftsSeeded(){
  if(!hasStorage) return Promise.resolve();
  var keys = Object.keys(EXAMPLE_INBOX_IDS);
  return Promise.all(keys.map(function(key){
    var id = EXAMPLE_INBOX_IDS[key];
    return window.storage.get('draft:'+id, true).then(function(existing){
      if(existing) return;
      var d = buildExampleDraft(key);
      d.id = id;
      d.status = 'submitted';
      return window.storage.set('draft:'+id, JSON.stringify(d), true);
    }).catch(function(){});
  }));
}

/* ---------- Moderation (per-username, applies across every draft that username builds) ---------- */
function normalizeUsername(u){ return (u||'').trim().toLowerCase(); }
function newModerationRecord(username){
  return {
    username: normalizeUsername(username),
    displayUsername: (username||'').trim(),
    redirectCount: 0,
    locked: false,
    lockReason: '',        // 'severe' | 'repeated'
    lockedAt: null,
    lockSourceDraftId: '',
    lockMessageExcerpt: '',
    incidents: [],         // [{at, severity:'mild'|'severe', excerpt, draftId}]
    unlocked: false,
    unlockedAt: null,
    coachNote: '',
    studentAppeal: '',
    studentAppealAt: null,
    updatedAt: Date.now()
  };
}
function patchModeration(m){
  if(!Array.isArray(m.incidents)) m.incidents = [];
  if(typeof m.redirectCount !== 'number') m.redirectCount = 0;
  return m;
}
function saveModeration(m){
  if(!hasStorage || !m) return;
  m.updatedAt = Date.now();
  window.storage.set('moduser:'+m.username, JSON.stringify(m), true).catch(function(e){
    console.error('moderation save failed', e);
  });
}
function loadModeration(username){
  if(!hasStorage) return Promise.resolve(newModerationRecord(username));
  return window.storage.get('moduser:'+normalizeUsername(username), true)
    .then(function(r){ return r ? patchModeration(JSON.parse(r.value)) : newModerationRecord(username); })
    .catch(function(){ return newModerationRecord(username); });
}
function listModerationRecords(){
  if(!hasStorage) return Promise.resolve([]);
  return window.storage.list('moduser:', true).then(function(r){
    var keys = (r && r.keys) || [];
    return Promise.all(keys.map(function(k){
      return window.storage.get(k, true).then(function(res){
        try{ return patchModeration(JSON.parse(res.value)); }catch(e){ return null; }
      });
    }));
  }).then(function(list){
    return list.filter(Boolean).sort(function(a,b){ return (b.lockedAt||0)-(a.lockedAt||0); });
  });
}

/* ---------- Notes storage: shared=false, so this is genuinely private — never fetchable by a coach's session ---------- */
function notesKey(draftId){ return 'notes:'+draftId; }
function loadNotes(draftId){

  }).catch(function(){ return []; });
}

function stepDone(key){
  var d = state.draft;
  if(key==='setup') return !!(d.title.trim() && d.bigIdea.trim());
  if(key==='storyboard') return d.scenarios.every(scenarioComplete) && !!(d.halftime.question.trim());
  if(key==='reflection') return !!(d.reflection.question.trim());

}
function railHtml(){
  var d = state.draft;

    var active = state.screen===s.key;

/* ---------- Player preview (real Discussion Session look) ---------- */
// The full click-through order a student actually experiences: scenarios 1-3, the
// halftime check-in, scenarios 4-6, then the closing reflection.
var PP_SEQUENCE = [
  {kind:'scenario', i:0}, {kind:'scenario', i:1}, {kind:'scenario', i:2},
  {kind:'halftime'},
  {kind:'scenario', i:3}, {kind:'scenario', i:4}, {kind:'scenario', i:5},
  {kind:'reflection'}
];
function ppStepLabel(entry){
  if(entry.kind==='scenario') return 'Scenario '+(entry.i+1);
  if(entry.kind==='halftime') return 'Halftime';
  return 'Closing Reflection';
}
function ppStepForKind(kind, idx){
  for(var s=0; s<PP_SEQUENCE.length; s++){
    var entry = PP_SEQUENCE[s];
    if(entry.kind!==kind) continue;
    if(kind!=='scenario' || entry.i===idx) return s;
  }
  return 0;
}
function renderPPScenario(sc, i){
  var optsHtml = sc.options.map(function(o){
    var iconHtml = o.selectedIcon
      ? '<img src="'+esc(o.selectedIcon.iconUrl || o.selectedIcon.thumbnailUrl)+'" alt="">'
      : ppIconFor((o.iconDescription||'')+' '+(o.label||'')+' '+(o.rationale||''));
    var label = o.label.trim() || 'Untitled option';
    var rationale = o.rationale.trim();
    return '<div class="pp-opt"><div class="pp-opt-icon">'+iconHtml+'</div><div class="pp-opt-cap"><b>'+esc(label)+'</b>'+(rationale? ': '+esc(rationale):'')+'</div></div>';
  }).join('');
  var cqs = sc.challenge.filter(function(q){return q.trim();});
  var cqIdx = clamp(state.ppChallengeIndex, 0, Math.max(0, cqs.length-1));
  var cq = cqs[cqIdx] || '';
  return ''+
  '<h2 class="pp-h2">Scenario '+(i+1)+': '+esc(sc.title||'Untitled Scenario')+'</h2>'+
  '<p class="pp-setup">'+esc(sc.setup||'(setup not written yet)')+'</p>'+
  '<div class="pp-opts pp-opts-'+sc.options.length+'">'+optsHtml+'</div>'+
  (cq ? '<div class="pp-cqbar"><button class="pp-arrow" data-action="ppPrevCq"'+(cqIdx===0?' disabled':'')+'>‹</button><div class="pp-cq"><span class="pp-cq-label">CHALLENGE QUESTION '+(cqIdx+1)+' / '+cqs.length+'</span>'+esc(cq)+'</div><button class="pp-arrow" data-action="ppNextCq"'+(cqIdx===cqs.length-1?' disabled':'')+'>›</button></div>' : '');
}
function renderPPCheckin(block, headerLabel){
  var opts = (block.options||[]).filter(function(o){return o.trim();});
  var optsHtml = opts.map(function(o){ return '<div class="pp-checkopt">'+esc(o)+'</div>'; }).join('');
  return ''+
  '<h2 class="pp-h2">'+esc(headerLabel)+'</h2>'+
  '<p class="pp-setup">'+esc(block.question||'(question not written yet)')+'</p>'+
  (optsHtml? '<div class="pp-checkopts">'+optsHtml+'</div>' : '')+
  (block.reflection? '<div class="pp-cqbar"><div class="pp-cq"><span class="pp-cq-label">'+(headerLabel==='Halftime'?'LOOKING AHEAD':'REFLECTION')+'</span>'+esc(block.reflection)+'</div></div>' : '');
}
function renderPlayerPreview(){
  var d = state.draft;
  var step = clamp(state.ppStep, 0, PP_SEQUENCE.length-1);
  var entry = PP_SEQUENCE[step];
  var title = d.title || 'Untitled Session';
  var body;
  if(entry.kind==='scenario'){
    body = renderPPScenario(d.scenarios[entry.i], entry.i);
  } else if(entry.kind==='halftime'){
    body = renderPPCheckin(d.halftime, 'Halftime');
  } else {
    body = renderPPCheckin(d.reflection, 'Closing Reflection');
  }
  return ''+
  '<div class="pp-screen">'+
    '<div class="pp-topbar"><span class="pp-brand">Discussion</span><span class="pp-dot">◆</span><span class="pp-title">'+esc(title)+'</span>'+
      '<button class="pp-exit" data-action="closePlayerPreview">✕ Exit preview</button>'+
    '</div>'+
    '<div class="pp-stage"><div class="pp-card">'+body+'</div></div>'+
    '<div class="pp-scenav">'+
      '<button class="pp-navbtn" data-action="ppPrevStep"'+(step===0?' disabled':'')+'>← '+(step>0? ppStepLabel(PP_SEQUENCE[step-1]) : '')+'</button>'+
      '<span>Previewing '+ppStepLabel(entry)+' — '+(step+1)+' of '+PP_SEQUENCE.length+'</span>'+
      '<button class="pp-navbtn" data-action="ppNextStep"'+(step===PP_SEQUENCE.length-1?' disabled':'')+'>'+(step<PP_SEQUENCE.length-1? ppStepLabel(PP_SEQUENCE[step+1]) : '')+' →</button>'+
    '</div>'+
    '<div class="pp-progress-track"><div class="pp-progress-fill" style="width:'+Math.round(((step+1)/PP_SEQUENCE.length)*100)+'%"></div></div>'+
  '</div>';
}

/* ---------- Review ---------- */
function renderReviewPreview(d){
  var scenarioBlocks = d.scenarios.map(function(sc,i){
    var opts = sc.options.map(function(o,oi){
      var lane = LANES[o.colorIndex];
      var iconHtml = o.selectedIcon
        ? '<img src="'+esc(o.selectedIcon.thumbnailUrl)+'" alt="">'
        : ICON_PLACEHOLDER_SVG;

    }).join('');

    var block = '<div class="p-scenario"><h4>Scenario '+(i+1)+': '+esc(sc.title||'Untitled')+'<span class="p-preview-link" data-action="openPlayerPreview" data-kind="scenario" data-idx="'+i+'">🖥️ Preview</span></h4>'+
      '<div class="p-setup">'+esc(sc.setup)+'</div>'+
      '<div class="p-opts">'+opts+'</div>'+
      (cqs? '<div class="p-q-label">Challenge questions</div><div class="p-cqs">'+cqs+'</div>' : '')+

  var reflectionBlock = '<div class="p-half"><h4>Closing Reflection</h4><div class="p-setup">'+esc(refl.question)+'</div><div class="p-cqs">'+refl.options.filter(function(o){return o.trim();}).map(function(o){return '• '+esc(o);}).join('<br>')+'</div>'+(refl.reflection? '<div class="p-q-label">Reflection</div><div class="p-refl">'+esc(refl.reflection)+'</div>':'')+'</div>';

  var ideaBlock = d.bigIdea ? ('<div class="p-blurb"><span class="p-q-label" style="margin:0 0 4px;">The big idea</span><br>'+esc(d.bigIdea)+'</div>') : '';

  return ''+
  '<div class="print-card">'+
    '<div class="p-eyebrow">SYNTHESIS DISCUSSION SESSION</div>'+
    '<h2 class="p-title">'+esc(d.title||'Untitled Session')+'</h2>'+
    ideaBlock+
    scenarioBlocks.slice(0,3).join('')+
    halftimeBlock+
    scenarioBlocks.slice(3).join('')+
    reflectionBlock+
  '</div>';
}
function balanceStripHtml(){
  return '<div class="panel"><div class="balance-strip"><div class="bs-title"><span class="b-icon">⚖️</span>Balance self-check</div><ul>'+
    '<li>Does every option have its own real reason behind it?</li>'+
    '<li>If your friend picked an option you didn\'t pick, would you understand why they thought that way?</li>'+
    '<li>Are there words in any of the options that make it sound obviously smarter, safer, or kinder than the rest?</li>'+

}
function renderReview(){
  var d = state.draft;
  var statusCls = d.status==='draft'?'status-draft':(d.status==='submitted'?'status-submitted':'status-reviewed');
  var statusLabel = d.status==='draft'?'Drafting':(d.status==='submitted'?'Waiting for coach':'Reviewed');
  var notes = d.coachNotes.length? (
    '<div class="panel"><h3>Notes from your coach</h3><div class="coach-notes">'+
      d.coachNotes.map(function(n){return '<div class="coach-note"><div class="cn-meta">'+timeAgo(n.at)+'</div>'+esc(n.text)+'</div>';}).join('')+
    '</div></div>'
  ) : '';
  return ''+
  '<div class="page-head"><div class="eyebrow">STEP 4</div><h2>Review &amp; send to your coach</h2><p>Here\'s the full session, put together. This is shared with your coach so they can leave notes.</p></div>'+
  '<div style="margin-bottom:14px;"><span class="status-badge '+statusCls+'">'+statusLabel+'</span></div>'+
  renderReviewPreview(d)+
  notes+
  balanceStripHtml()+

/* ============================= STICKY NOTES (private, freeform, per-screen) ============================= */
var DRAG_HANDLE_SVG = '<svg viewBox="0 0 10 16" width="10" height="16" fill="currentColor"><circle cx="2" cy="2" r="1.3"/><circle cx="8" cy="2" r="1.3"/><circle cx="2" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="2" cy="14" r="1.3"/><circle cx="8" cy="14" r="1.3"/></svg>';
function renderStickyNote(n){
  var sel = n.id===selectedNoteId ? ' selected' : '';
  return ''+
  '<div class="sticky-note note-'+n.color+sel+'" data-noteid="'+n.id+'" style="left:'+n.x+'px; top:'+n.y+'px; z-index:'+n.z+'">'+
    '<div class="sticky-drag-handle" data-drag-note="'+n.id+'">'+DRAG_HANDLE_SVG+
      '<button class="note-delete" data-action="deleteNote" data-noteid="'+n.id+'" title="Delete note">✕</button>'+
    '</div>'+
    '<div class="note-colors">'+NOTE_COLORS.map(function(c){
      return '<button class="note-color-dot note-color-'+c+(c===n.color?' selected':'')+'" data-action="setNoteColor" data-noteid="'+n.id+'" data-color="'+c+'" title="'+c+'"></button>';
    }).join('')+'</div>'+
    '<textarea data-bind="noteText" data-noteid="'+n.id+'" placeholder="Write a thought...">'+esc(n.text)+'</textarea>'+
  '</div>';
}
function renderStickyLayer(){
  var attach = currentAttachForScreen();
  var notes = notesFor(attach);
  var html = ''+
    '<div class="note-dock">'+
      '<div class="note-stack">'+
        '<div class="note-stack-sheet"></div><div class="note-stack-sheet"></div>'+
        '<div class="note-stack-sheet note-stack-top" id="noteStackTop">+</div>'+
      '</div>'+
      '<div class="note-stack-hint">Drag or click to grab a note</div>'+
    '</div>'+
    '<div class="note-trash" id="noteTrash" title="Drag a note here to throw it away">🗑️</div>'+
    notes.map(renderStickyNote).join('');

  var existing = document.getElementById('notesOverlayRoot');
  var wrap = existing;
  var isNew = false;
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'notesOverlayRoot';
    document.body.appendChild(wrap);
    isNew = true;
  }
  wrap.innerHTML = html;
  if(isNew){
    wrap.addEventListener('click', handleClick);
    // Clicking empty overlay background (not a note) clears the selection outline.
    wrap.addEventListener('pointerdown', function(e){
      if(!e.target.closest('.sticky-note') && selectedNoteId){
        selectedNoteId = null;
        wrap.querySelectorAll('.sticky-note.selected').forEach(function(el){ el.classList.remove('selected'); });
      }
    });
  }
  attachStickyInputHandlers(wrap, attach);
}
function attachStickyInputHandlers(wrap, attach){
  wrap.querySelectorAll('.sticky-note').forEach(function(cardEl){
    var noteId = cardEl.getAttribute('data-noteid');
    // Selecting (and bringing to front) is separate from dragging, so clicking
    // anywhere on a note — including its textarea — always raises it, even
    // though (per the handle-band rule below) a note's handle never actually
    // ends up fully buried in the first place.
    cardEl.addEventListener('pointerdown', function(){
      selectedNoteId = noteId;
      var note = state.notes.filter(function(n){ return n.id===noteId; })[0];
      if(note){ note.z = ++noteZCounter; cardEl.style.zIndex = note.z; }
      wrap.querySelectorAll('.sticky-note.selected').forEach(function(el){ el.classList.remove('selected'); });
      cardEl.classList.add('selected');
    });
  });
  wrap.querySelectorAll('textarea[data-bind="noteText"]').forEach(function(el){
    el.addEventListener('input', function(){
      var note = state.notes.filter(function(n){ return n.id===el.getAttribute('data-noteid'); })[0];
      if(note){ note.text = el.value; note.updatedAt = Date.now(); debounceSaveNotes(); }
    });
  });
  wrap.querySelectorAll('[data-drag-note]').forEach(function(handle){
    handle.addEventListener('pointerdown', function(e){
      if(e.target.closest('.note-delete')) return; // let the delete button's own click through
      var note = state.notes.filter(function(n){ return n.id===handle.getAttribute('data-drag-note'); })[0];
      if(note) startNoteDrag(e, note);
    });
  });
  var stackTop = wrap.querySelector('#noteStackTop');
  if(stackTop){
    stackTop.addEventListener('pointerdown', function(e){
      var x = clamp(e.clientX - STICKY_W/2, 0, window.innerWidth-STICKY_W);
      var y = clamp(e.clientY - STICKY_H/2, 0, window.innerHeight-STICKY_H);
      var note = newNote(attach, '', x, y);
      state.notes.push(note);
      renderStickyLayer();
      startNoteDrag(e, note); // pulling from the stack is just a drag that starts on a brand-new note
    });
  }
}
function showTrash(visible){
  var t = document.getElementById('noteTrash');
  if(t) t.classList.toggle('visible', visible);
}
function isOverTrash(noteEl){
  var t = document.getElementById('noteTrash');
  if(!t || !noteEl) return false;
  var a = noteEl.getBoundingClientRect(), b = t.getBoundingClientRect();
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}
// Ensures a just-moved note never fully covers another note's grab-bar band,
// so every note in a pile stays individually grabbable by its visible top edge —
// mirrors how a real pile of sticky notes fans out. Runs once, on drop (not
// continuously mid-drag), so dragging itself stays smooth and unconstrained.
function resolveHandleOcclusion(note){
  var guard = 0, moved = true;
  while(moved && guard < 50){
    moved = false; guard++;
    state.notes.forEach(function(n){
      if(n.id===note.id || attachKey(n.attach)!==attachKey(note.attach)) return;
      var overlapsX = note.x < n.x+STICKY_W && note.x+STICKY_W > n.x;
      var overlapsHandleY = note.y < n.y+HANDLE_H && note.y+STICKY_H > n.y;
      if(overlapsX && overlapsHandleY){ note.y = n.y+HANDLE_H; moved = true; }
    });
  }
  note.y = clamp(note.y, 0, window.innerHeight-STICKY_H);
}
function startNoteDrag(e, note){
  e.preventDefault();
  note.z = ++noteZCounter;
  selectedNoteId = note.id;
  var startX = e.clientX, startY = e.clientY, origX = note.x, origY = note.y;
  var el = document.querySelector('.sticky-note[data-noteid="'+note.id+'"]');
  if(el){ el.style.zIndex = note.z; el.classList.add('selected'); }
  showTrash(true);
  function onMove(ev){
    note.x = clamp(origX + (ev.clientX-startX), 0, window.innerWidth-STICKY_W);
    note.y = clamp(origY + (ev.clientY-startY), 0, window.innerHeight-STICKY_H);
    if(el){
      el.style.left = note.x+'px'; el.style.top = note.y+'px';
      el.classList.toggle('over-trash', isOverTrash(el));
    }
  }
  function onUp(ev){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    showTrash(false);
    if(el && isOverTrash(el)){
      state.notes = state.notes.filter(function(n){ return n.id!==note.id; });
      selectedNoteId = null;
      saveNotes();
      renderStickyLayer();
    } else {
      resolveHandleOcclusion(note);
      if(el){ el.style.left = note.x+'px'; el.style.top = note.y+'px'; el.classList.remove('over-trash'); }
      debounceSaveNotes();
    }
  }
  // A drag can be interrupted (alt-tab, a context menu popping up mid-drag)
  // without a pointerup ever firing — without this, the note would be stuck
  // "mid-drag" with the trash left showing and these window listeners never
  // cleaned up. Treat a cancel exactly like a normal drop.
  function onCancel(ev){ onUp(ev); }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
}
function removeNotesOverlay(){
  var existing = document.getElementById('notesOverlayRoot');
  if(existing) existing.remove();
}

/* ============================= AI COACH CALL ============================= */
function askCoach(userText, contextObj){
  var d = state.draft;
  if(state.moderation && state.moderation.locked){
    state.coachOpen = true; render(); return;
  }
  d.aiChat.push({role:'user', text:userText});
  state.coachOpen = true;
  state.coachLoading = true;
  render();
  var msgPayload = contextObj ?
    ('Here is what I\'m working on right now (as data): '+JSON.stringify(contextObj)+'\n\nMy question: '+userText) :
    userText;
  var history = d.aiChat.slice(0,-1).map(function(m){ return {role: m.role==='user'?'user':'assistant', content:m.text}; });
  history.push({role:'user', content: msgPayload});

  fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system: COACH_SYSTEM_PROMPT,
      messages: history
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    var text = '';
    if(data && data.content){
      text = data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n');
    }
    var parsed = null;
    if(text){
      try{ parsed = JSON.parse(text.replace(/```json|```/g,'').trim()); }catch(e){ parsed = null; }
    }
    if(!parsed || typeof parsed.verdict !== 'string' || typeof parsed.reply !== 'string'){
      parsed = {verdict:'ok', reply: text || "Hmm, I didn't get a clear answer back. Try asking again, or check with a human coach."};
    }
    handleVerdict(parsed.verdict, parsed.reply, userText);
  }).catch(function(e){
    d.aiChat.push({role:'assistant', text:"I couldn't reach the assistant just now. Try again in a moment, or ask a human coach for now."});
  }).finally(function(){
    state.coachLoading = false;
    debounceSave();
    render();
  });
}
function ensureModeration(){
  if(!state.moderation) state.moderation = newModerationRecord(state.draft.studentName);
  return state.moderation;
}
function handleVerdict(verdict, reply, userText){
  var d = state.draft;
  var mod = ensureModeration();
  if(verdict==='severe'){
    mod.locked = true;
    mod.lockReason = 'severe';
    mod.lockedAt = Date.now();
    mod.lockSourceDraftId = d.id;
    mod.lockMessageExcerpt = userText.slice(0,300);
    mod.incidents.push({at:Date.now(), severity:'severe', excerpt:userText.slice(0,200), draftId:d.id, modelNote:(reply||'').slice(0,200)});
    saveModeration(mod);
    d.aiChat.push({role:'assistant', text: LOCK_MESSAGE_SEVERE});
    return;
  }
  if(verdict==='mild'){
    mod.redirectCount = (mod.redirectCount||0) + 1;
    mod.incidents.push({at:Date.now(), severity:'mild', excerpt:userText.slice(0,200), draftId:d.id, modelNote:(reply||'').slice(0,200)});
    if(mod.redirectCount >= 3){
      mod.locked = true;
      mod.lockReason = 'repeated';
      mod.lockedAt = Date.now();
      mod.lockSourceDraftId = d.id;
      mod.lockMessageExcerpt = userText.slice(0,300);
      saveModeration(mod);
      d.aiChat.push({role:'assistant', text: LOCK_MESSAGE_REPEATED});
      return;
    }
    saveModeration(mod);
    var shown = mod.redirectCount===1 ? REDIRECT_MESSAGE_1 : (REDIRECT_MESSAGE_2 + '\n\n' + WARN_MESSAGE);
    d.aiChat.push({role:'assistant', text: shown});
    return;
  }
  d.aiChat.push({role:'assistant', text: reply});
}

/* ============================= MARKDOWN EXPORT ============================= */
function iconExportFilename(o){
  var word = (o.iconDescription || o.label || 'icon').trim().toLowerCase().split(/\s+/)[0].replace(/[^a-z0-9]/g,'') || 'icon';
  return 'noun-'+word+'-'+o.selectedIcon.id+'.webp';
}
function toMarkdown(d){
  var lines = [];
  lines.push('# '+(d.title||'Untitled Session'));
  lines.push('');
  lines.push('## Title');
  lines.push('');
  lines.push('- '+(d.title||'Untitled Session'));
  lines.push('');
  lines.push('## Session idea');
  lines.push('');
  lines.push((d.bigIdea||'').trim());
  lines.push('');
  lines.push('> Staff: use this to write the official Parent blurb (closing with: "'+MANTRA+'") and the Alex/Florence intro.');
  lines.push('');
  if((d.coachMessage||'').trim()){
    lines.push('## Message to coach');
    lines.push('');
    lines.push(d.coachMessage.trim());
    lines.push('');
  }
  lines.push('## Portal Image');
  lines.push('');
  lines.push('[Portal image placeholder]');
  lines.push('');
  lines.push('### Intro to discussions and Session Context 🎞️ 1-2');
  lines.push('');
  lines.push('[To be written by staff — see Session idea above]');
  lines.push('');
  var ranges = ['2-6','6-10','10-14','15-19','19-23','23-27'];
  d.scenarios.forEach(function(sc,i){
    lines.push('### Scenario '+(i+1)+': '+(sc.title||'Untitled')+' '+ranges[i]);
    lines.push('');
    lines.push(sc.setup||'');
    lines.push('');
    sc.options.forEach(function(o,oi){
      lines.push((oi+1)+'.\t'+(o.label||'(untitled)')+': '+(o.rationale||''));
      lines.push('');
      if(o.selectedIcon){
        lines.push('!['+iconExportFilename(o)+']('+o.selectedIcon.iconUrl+')');
        if(o.selectedIcon.attributionName){
          lines.push('<!-- Icon credit: '+o.selectedIcon.attributionName+(o.selectedIcon.attributionUrl? ' — '+o.selectedIcon.attributionUrl : '')+' -->');
        }
      } else {
        lines.push('![Icon placeholder — '+(o.iconDescription? o.iconDescription : 'no description yet')+'](icon-placeholder.webp)');
      }
      lines.push('');
    });
    lines.push('`challenge questions`');
    lines.push('');
    sc.challenge.filter(function(q){return q.trim();}).forEach(function(q){ lines.push(q); lines.push(''); });
    lines.push('`reflection question`');
    lines.push('');
    lines.push(sc.reflection||'');
    lines.push('');
    if(i===2){
      var h = d.halftime;
      lines.push('### Halftime 14-15');
      lines.push('');
      lines.push(h.question||'');
      lines.push('');
      h.options.filter(function(o){return o.trim();}).forEach(function(o){ lines.push('- '+o); });
      lines.push('');
      lines.push('`reflection question`');
      lines.push('');
      lines.push(h.reflection||'');
      lines.push('');
    }
  });
  var r = d.reflection;
  lines.push('### Reflection 27-28');
  lines.push('');
  lines.push(r.question||'');
  lines.push('');
  r.options.filter(function(o){return o.trim();}).forEach(function(o){ lines.push('- '+o); });
  lines.push('');
  lines.push('`reflection`');
  lines.push('');
  lines.push(r.reflection||'');
  lines.push('');
  lines.push('### Say goodbye 28+');
  return lines.join('\n');
}

/* ============================= EVENT HANDLING ============================= */
function updateDraftField(bind, el, oidx, qidx){
  var d = state.draft;
  var v = el.value;
  if(bind==='title') d.title=v;
  else if(bind==='bigIdea') d.bigIdea=v;
  else if(bind==='scTitle') d.scenarios[state.scenarioIndex].title=v;
  else if(bind==='scDomain') d.scenarios[state.scenarioIndex].domain=v;
  else if(bind==='scSetup') d.scenarios[state.scenarioIndex].setup=v;
  else if(bind==='scReflection') d.scenarios[state.scenarioIndex].reflection=v;
  else if(bind==='option.label') d.scenarios[state.scenarioIndex].options[oidx].label=v;
  else if(bind==='option.rationale') d.scenarios[state.scenarioIndex].options[oidx].rationale=v;
  else if(bind==='option.iconDescription') d.scenarios[state.scenarioIndex].options[oidx].iconDescription=v;
  else if(bind==='challenge') d.scenarios[state.scenarioIndex].challenge[qidx]=v;
  else if(bind==='halftimeQ') d.halftime.question=v;
  else if(bind==='halftimeRefl') d.halftime.reflection=v;
  else if(bind==='halftimeOpt') d.halftime.options[oidx]=v;
  else if(bind==='reflectionQ') d.reflection.question=v;
  else if(bind==='reflectionRefl') d.reflection.reflection=v;
  else if(bind==='reflectionOpt') d.reflection.options[oidx]=v;
  else if(bind==='coachMessage') d.coachMessage=v;
}

function attachGlobalHandlers(){
  // text inputs / textareas -> update state without full rerender
  app.querySelectorAll('input[data-bind], textarea[data-bind]').forEach(function(el){
    el.addEventListener('input', function(){
      var bind = el.getAttribute('data-bind');
      var oidx = el.getAttribute('data-oidx');
      var qidx = el.getAttribute('data-qidx');
      updateDraftField(bind, el, oidx!==null?parseInt(oidx,10):null, qidx!==null?parseInt(qidx,10):null);
      debounceSave();
    });
  });
  // coach password: Enter submits, and the field takes focus on arrival
  var pwField = document.getElementById('coachPassword');
  if(pwField){
    pwField.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var btn = app.querySelector('[data-action="coachLogin"]');
        if(btn) btn.click();
      }
    });
    if(!state.coachAuthBusy) pwField.focus();
  }
  // icon search: Enter runs the search, same as clicking the Search button
  app.querySelectorAll('input[data-bind="option.iconDescription"]').forEach(function(el){
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var btn = el.parentElement.querySelector('[data-action="searchIcon"]');
        if(btn) btn.click();
      }
    });
  });
  // select dropdown
  app.querySelectorAll('select[data-bind]').forEach(function(el){
    el.addEventListener('change', function(){
      var bind = el.getAttribute('data-bind');
      updateDraftField(bind, el, null, null);
      debounceSave();
      render();
    });
  });
}
function attachAppDelegatesOnce(){

}

// Opens an already-loaded draft: resets save/notes state, enters the shell, then
// fills in moderation + notes asynchronously. Shared by "start new", "resume", and
// "open an example session" (startScreen lets the example land on the storyboard
// instead of setup, since there's nothing to fill in there).
function enterDraft(d, startScreen){
  state.draft = d; state.homeError=''; state.screen=startScreen||'setup'; saveStatus='saved'; isDirty=false;
  state.notes=[]; notesDirty=false; selectedNoteId=null; state.resumeMatches=[];
  render();
  loadModeration(d.studentName).then(function(m){ state.moderation = m; render(); });
  loadNotes(d.id).then(function(n){
    var needsSave = false;
    n.forEach(function(note, idx){
      if(note.x==null || note.y==null){
        // Legacy note from before freeform positions existed — give it a
        // sane starting spot instead of rendering at left:NaNpx.
        note.x = clamp(window.innerWidth - 260 + (idx%4)*14, 0, window.innerWidth-STICKY_W);
        note.y = clamp(120 + idx*30, 0, window.innerHeight-STICKY_H);
        note.z = ++noteZCounter;
        needsSave = true;
      } else if(note.z > noteZCounter){
        noteZCounter = note.z; // keep future new notes on top of previously-saved ones
      }
    });
    state.notes = n;
    if(needsSave) debounceSaveNotes();
    render();
  });
}

function handleClick(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.getAttribute('data-action');

  if(action==='startNew'){
    var nameEl = document.getElementById('username');
    var name = nameEl ? nameEl.value.trim() : '';
    if(!name){ state.homeError='Type a username to get started.'; render(); return; }
    state.draft = newDraft(name);
    state.notes = [];
    state.homeError='';
    state.resumeMatches=[];
    state.screen='setup';
    saveDraft();
    render();
    loadModeration(name).then(function(m){ state.moderation = m; render(); });
    return;
  }
  if(action==='resumeDraft'){
    var nameEl2 = document.getElementById('username');
    var uname = nameEl2 ? nameEl2.value.trim() : '';
    if(!uname){ state.homeError='Type your username.'; state.resumeMatches=[]; render(); return; }
    if(!hasStorage){ state.homeError='Saving isn\'t available in this preview, so drafts can\'t be resumed.'; render(); return; }
    listDraftsForUser(uname).then(function(matches){
      if(!matches.length){ state.homeError='No sessions found for that username. Check the spelling, or start a new one.'; state.resumeMatches=[]; render(); return; }
      state.homeError=''; state.resumeMatches=matches; render();
    }).catch(function(e){
      console.error('draft lookup failed', e);
      state.homeError='Couldn\'t reach storage to look up your drafts. Your work is safe — try again in a moment.';
      state.resumeMatches=[]; render();
    });
    return;
  }
  if(action==='openResumeDraft'){
    var resumeId = t.getAttribute('data-id');
    var chosen = state.resumeMatches.filter(function(d){ return d.id===resumeId; })[0];
    if(!chosen) return;
    enterDraft(chosen);
    return;
  }
  if(action==='previewResumeDraft'){
    var previewId = t.getAttribute('data-id');
    var previewDraft = state.resumeMatches.filter(function(d){ return d.id===previewId; })[0];
    if(!previewDraft) return;
    state.draft = previewDraft;
    state.ppStep = ppStepForKind('scenario', 0);
    state.ppChallengeIndex = 0;
    state.ppReturnScreen = 'home';
    state.screen = 'playerPreview';
    render();
    return;
  }
  if(action==='renameResumeDraft'){
    var renameId = t.getAttribute('data-id');
    var renameDraft = state.resumeMatches.filter(function(d){ return d.id===renameId; })[0];
    if(!renameDraft) return;
    var newTitle = prompt('Rename this draft:', renameDraft.title || '');
    if(newTitle===null) return; // cancelled
    newTitle = newTitle.trim();
    if(!newTitle || newTitle===renameDraft.title) return;
    renameDraft.title = newTitle;
    renameDraft.updatedAt = Date.now();
    render(); // optimistic — reflect the new name immediately
    window.storage.set('draft:'+renameDraft.id, JSON.stringify(renameDraft), true).catch(function(e){
      console.error('rename failed', e);
      state.homeError = "Couldn't save the new name — try again in a moment.";
      render();
    });
    return;
  }
  if(action==='deleteResumeDraft'){
    var deleteId = t.getAttribute('data-id');
    var deleteDraft = state.resumeMatches.filter(function(d){ return d.id===deleteId; })[0];
    if(!deleteDraft) return;
    if(!confirm('Are you sure you want to delete "'+(deleteDraft.title||'Untitled')+'"? This can\'t be undone.')) return;
    window.storage.delete('draft:'+deleteDraft.id).then(function(){
      state.resumeMatches = state.resumeMatches.filter(function(d){ return d.id!==deleteId; });
      render();
    }).catch(function(e){
      console.error('delete failed', e);
      state.homeError = "Couldn't delete that draft — try again in a moment.";
      render();
    });
    return;
  }
  if(action==='openExampleDraft'){
    var exampleKey = t.getAttribute('data-example');
    var exampleDraft = buildExampleDraft(exampleKey);
    if(!exampleDraft) return;
    enterDraft(exampleDraft, 'storyboard');
    return;
  }
  if(action==='goHome'){ if(state.draft) saveDraft(); if(notesDirty) saveNotes(); state.draft=null; state.moderation=null; state.notes=[]; selectedNoteId=null; state.resumeMatches=[]; removeNotesOverlay(); state.screen='home'; state.coachOpen=false; removeCoachOverlay(); render(); return; }
  if(action==='goInbox'){
    if(!window.storage.hasCoachToken()){
      state.screen='coachLogin'; state.coachAuthError=''; state.coachAuthBusy=false; render(); return;
    }
    state.screen='inbox';
    render();
    loadInbox();
    return;
  }
  if(action==='coachLogin'){
    var pwEl = document.getElementById('coachPassword');
    var pw = pwEl ? pwEl.value : '';
    if(!pw){ state.coachAuthError='Enter the coach password.'; render(); return; }
    state.coachAuthBusy=true; state.coachAuthError=''; render();
    window.storage.coachLogin(pw).then(function(){
      state.coachAuthBusy=false; state.coachAuthError='';
      state.screen='inbox'; render();
      loadInbox();
    }).catch(function(e){
      console.error('coach sign-in failed', e);
      state.coachAuthBusy=false;
      state.coachAuthError=(e && e.message) || 'Sign-in failed. Try again.';
      render();
    });
    return;
  }
  if(action==='coachSignOut'){
    window.storage.coachSignOut();
    state.screen='home';
    state.inboxList=[]; state.flaggedList=[]; state.inboxError=''; state.coachAuthError='';
    render();
    return;
  }
  if(action==='openInboxDraft'){
    state.inboxSelectedId = t.getAttribute('data-id');
    state.screen='inboxDraft';
    render();
    return;
  }
  if(action==='openInboxFlagged'){
    state.inboxFlaggedUsername = t.getAttribute('data-username');
    state.screen='inboxFlagged';
    render();
    return;
  }
  if(action==='unlockUser'){
    var username = t.getAttribute('data-username');
    var noteEl = document.getElementById('unlockNoteText');
    var note = noteEl ? noteEl.value.trim() : '';
    loadModeration(username).then(function(m){
      m.locked = false;
      m.unlocked = true;
      m.unlockedAt = Date.now();
      m.redirectCount = 0;
      if(note) m.coachNote = note;
      m.studentAppeal = '';
      m.studentAppealAt = null;
      saveModeration(m);
      return listModerationRecords();
    }).then(function(list){
      state.flaggedList = list;
      state.screen = 'inbox';
      render();
    });
    return;
  }
  if(action==='sendBackForRevision' || action==='markReviewed'){
    var id = t.getAttribute('data-id');
    var fbEl = document.getElementById('coachFeedbackText');
    var text = fbEl ? fbEl.value.trim() : '';
    loadDraft(id).then(function(d){
      if(!d) return;
      if(text) d.coachNotes.push({text:text, at:Date.now()});
      d.status = action==='markReviewed' ? 'reviewed' : 'draft';
      d.updatedAt = Date.now();
      window.storage.set('draft:'+d.id, JSON.stringify(d), true).then(function(){
        return listAllDrafts();
      }).then(function(list){
        state.inboxList = list;
        state.screen='inbox';
        render();
      }).catch(function(e){
        console.error('coach action failed', e);
        if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
        state.inboxError='Couldn\'t save that change — it may not have gone through. Try again in a moment.';
        state.screen='inbox';
        render();
      });
    });
    return;
  }

  if(action==='exportMarkdownInbox'){
    var exportId = t.getAttribute('data-id');
    var exportDraft = state.inboxList.filter(function(x){return x.id===exportId;})[0];
    if(exportDraft) downloadText((exportDraft.title||'session').toLowerCase().replace(/[^a-z0-9]+/g,'_')+'.md', toMarkdown(exportDraft));
    return;
  }

  if(!state.draft) return; // remaining actions require a loaded draft

  if(action==='nav'){ state.screen = t.getAttribute('data-target'); render(); return; }
  if(action==='openScenario'){ state.scenarioIndex = parseInt(t.getAttribute('data-idx'),10); state.screen='scenario'; render(); return; }
  if(action==='openHalftime'){ state.screen='halftimeEditor'; render(); return; }
  if(action==='prevScenario'){ if(state.scenarioIndex>0){ state.scenarioIndex--; render(); } return; }
  if(action==='nextScenario'){ if(state.scenarioIndex<5){ state.scenarioIndex++; render(); } return; }

  if(action==='openPlayerPreview'){
    var ppKindAttr = t.getAttribute('data-kind');
    var ppIdxAttr = t.getAttribute('data-idx');
    var ppIdx = ppIdxAttr!==null ? parseInt(ppIdxAttr,10) : state.scenarioIndex;
    state.ppStep = ppStepForKind(ppKindAttr, ppIdx);
    state.ppChallengeIndex = 0;
    state.ppReturnScreen = state.screen;
    state.screen = 'playerPreview';
    render(); return;
  }
  if(action==='closePlayerPreview'){ state.screen = state.ppReturnScreen || 'storyboard'; render(); return; }
  if(action==='searchIcon'){
    var scenarioIdx = parseInt(t.getAttribute('data-scenarioidx'),10);
    var optionIdx = parseInt(t.getAttribute('data-oidx'),10);
    var query = state.draft.scenarios[scenarioIdx].options[optionIdx].iconDescription.trim();
    if(!query) return;
    state.iconSearchOpen = {scenarioIndex:scenarioIdx, optionIndex:optionIdx};
    performIconSearch(query);
    return;
  }
  if(action==='dismissIconSearch'){ state.iconSearchOpen = null; render(); return; }
  if(action==='selectIcon'){
    var iconIdx = parseInt(t.getAttribute('data-idx'),10);
    var icon = state.iconSearchResults[iconIdx];
    if(!icon || !state.iconSearchOpen) return;
    var loc = state.iconSearchOpen;
    state.draft.scenarios[loc.scenarioIndex].options[loc.optionIndex].selectedIcon = icon;
    debounceSave();
    state.iconSearchOpen = null;
    render();
    return;
  }
  if(action==='clearIcon'){
    var clearScenarioIdx = parseInt(t.getAttribute('data-scenarioidx'),10);
    var clearOptionIdx = parseInt(t.getAttribute('data-oidx'),10);
    state.draft.scenarios[clearScenarioIdx].options[clearOptionIdx].selectedIcon = null;
    debounceSave();
    render();
    return;
  }
  if(action==='ppPrevStep'){ if(state.ppStep>0){ state.ppStep--; state.ppChallengeIndex=0; render(); } return; }
  if(action==='ppNextStep'){ if(state.ppStep<PP_SEQUENCE.length-1){ state.ppStep++; state.ppChallengeIndex=0; render(); } return; }
  if(action==='ppPrevCq'){ if(state.ppChallengeIndex>0){ state.ppChallengeIndex--; render(); } return; }
  if(action==='ppNextCq'){ state.ppChallengeIndex++; render(); return; }

  if(action==='setOptionCount'){
    var n = parseInt(t.getAttribute('data-n'),10);
    var anyContent = state.draft.scenarios.some(function(sc){ return sc.title.trim()||sc.setup.trim()||sc.options.some(function(o){return o.label.trim()||o.rationale.trim();}); });
    if(anyContent && n!==state.draft.optionCount){
      if(!confirm('Changing option count will reset all 6 scenarios\' options. Continue?')) return;
    }
    state.draft.optionCount = n;
    state.draft.scenarios.forEach(function(sc){
      var opts=[]; for(var i=0;i<n;i++) opts.push(sc.options[i] || newOption(i));
      sc.options = opts;
    });
    debounceSave(); render(); return;
  }

  if(action==='moveLane'){
    var idx = parseInt(t.getAttribute('data-idx'),10), dir = parseInt(t.getAttribute('data-dir'),10);
    var opts = state.draft.scenarios[state.scenarioIndex].options;
    var j = idx+dir;
    if(j<0||j>=opts.length) return;
    var tmp = opts[idx]; opts[idx]=opts[j]; opts[j]=tmp;
    debounceSave(); render(); return;
  }
  if(action==='addChallenge'){
    var chal = state.draft.scenarios[state.scenarioIndex].challenge;
    if(chal.length<4) chal.push('');
    debounceSave(); render(); return;
  }
  if(action==='removeChallenge'){
    var qidx2 = parseInt(t.getAttribute('data-qidx'),10);
    state.draft.scenarios[state.scenarioIndex].challenge.splice(qidx2,1);
    debounceSave(); render(); return;
  }
  if(action==='addhalftimeOpt'){ if(state.draft.halftime.options.length<3) state.draft.halftime.options.push(''); debounceSave(); render(); return; }
  if(action==='removehalftimeOpt'){ var hi=parseInt(t.getAttribute('data-oidx'),10); state.draft.halftime.options.splice(hi,1); debounceSave(); render(); return; }
  if(action==='addreflectionOpt'){ if(state.draft.reflection.options.length<3) state.draft.reflection.options.push(''); debounceSave(); render(); return; }
  if(action==='removereflectionOpt'){ var ri=parseInt(t.getAttribute('data-oidx'),10); state.draft.reflection.options.splice(ri,1); debounceSave(); render(); return; }

  if(action==='submitToCoach'){
    state.draft.status='submitted';
    saveDraft();
    render();
    return;
  }
  if(action==='exportMarkdown'){
    downloadText((state.draft.title||'session').toLowerCase().replace(/[^a-z0-9]+/g,'_')+'.md', toMarkdown(state.draft));
    return;
  }
  if(action==='askCoachScenario'){
    var sc = state.draft.scenarios[state.scenarioIndex];
    askCoach('Can you check the balance and tone of this scenario?', {scenario:sc, optionCount:state.draft.optionCount});
    return;
  }
  if(action==='askCoachWhole'){
    askCoach('Can you review my whole session for balance, tone, sensitivity, and structure?', {title:state.draft.title, bigIdea:state.draft.bigIdea, scenarios:state.draft.scenarios, halftime:state.draft.halftime, reflection:state.draft.reflection});
    return;
  }
  if(action==='toggleCoach'){
    state.coachOpen=!state.coachOpen;
    var coachDrawerEl = document.querySelector('.coach-drawer');
    if(coachDrawerEl){ coachDrawerEl.classList.toggle('open', state.coachOpen); }
    else { renderCoachOverlay(); }
    return;
  }
  if(action==='deleteNote'){
    var delNoteId = t.getAttribute('data-noteid');
    state.notes = state.notes.filter(function(n){ return n.id!==delNoteId; });
    debounceSaveNotes();
    render();
    return;
  }
  if(action==='setNoteColor'){
    var colorNoteId = t.getAttribute('data-noteid');
    var newColor = t.getAttribute('data-color');
    var colorNote = state.notes.filter(function(n){ return n.id===colorNoteId; })[0];
    if(colorNote){ colorNote.color = newColor; colorNote.updatedAt = Date.now(); debounceSaveNotes(); }
    render();
    return;
  }
  if(action==='sendCoachMsg'){ sendCoachFromInput(); return; }
  if(action==='sendAppeal'){ sendAppealFromInput(); return; }
}

/* ---------- Drag and drop ---------- */
function handleDragStart(e){
  // Don't let the card's draggable="true" hijack normal text selection/typing
  // inside its own inputs, textareas, or buttons — only the surrounding card
  // area should act as the grab handle.
  if(e.target.closest('input, textarea, select, button')){ e.preventDefault(); return; }
  var t = e.target.closest('[data-drag]');
  if(!t) return;
  var kind = t.getAttribute('data-drag');
  if(kind==='scenario'){
    state.dragScenarioIdx = parseInt(t.getAttribute('data-dragidx'),10);
    e.dataTransfer.setData('text/plain','scenario');
    t.classList.add('dragging');
  } else if(kind==='lane'){
    state.dragLaneIdx = parseInt(t.getAttribute('data-dragidx'),10);
    e.dataTransfer.setData('text/plain','lane');
    t.classList.add('dragging');
  }
}
function handleDragOver(e){
  if(state.dragScenarioIdx!==null || state.dragLaneIdx!==null){
    // A drag we initiated is in progress — always block the browser's default
    // handling so it never falls back to inserting the drag payload as text
    // into whatever input/textarea happens to be under the cursor.
    e.preventDefault();
    return;
  }
  if(e.target.closest('[data-action="openScenario"]') || e.target.closest('.lane')){
    e.preventDefault();
  }
}
function handleDrop(e){
  var payload;
  try{ payload = e.dataTransfer.getData('text/plain'); }catch(err){ payload=''; }
  if(payload==='scenario' || payload==='lane'){
    // Always suppress the browser's default drop action for our own drag
    // payloads (e.g. text fields inserting the literal word "note"), even
    // when the drop lands somewhere that isn't a recognized target below.
    e.preventDefault();
  }
  var cardTarget = e.target.closest('[data-action="openScenario"]');
  if(cardTarget && payload==='scenario' && state.dragScenarioIdx!==null){
    e.preventDefault();
    var toIdx = parseInt(cardTarget.getAttribute('data-idx'),10);
    var scs = state.draft.scenarios;
    var moved = scs.splice(state.dragScenarioIdx,1)[0];
    scs.splice(toIdx,0,moved);
    state.dragScenarioIdx=null;
    debounceSave(); render();
    return;
  }
  var laneTarget = e.target.closest('.lane');
  if(laneTarget && payload==='lane' && state.dragLaneIdx!==null){
    e.preventDefault();
    var toLaneIdx = parseInt(laneTarget.getAttribute('data-dragidx'),10);
    var opts = state.draft.scenarios[state.scenarioIndex].options;
    var movedOpt = opts.splice(state.dragLaneIdx,1)[0];
    opts.splice(toLaneIdx,0,movedOpt);
    state.dragLaneIdx=null;
    debounceSave(); render();
    return;
  }
}
function handleDragEnd(){
  state.dragScenarioIdx=null; state.dragLaneIdx=null;
  document.querySelectorAll('.dragging').forEach(function(el){ el.classList.remove('dragging'); });
}

/* ============================= INIT ============================= */
attachAppDelegatesOnce();
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);
// Sticky notes store raw viewport-pixel x/y — if the window shrinks, pull any
// note back into view rather than leaving it stranded off-screen with no way
// to reach it.
window.addEventListener('resize', function(){
  if(!document.getElementById('notesOverlayRoot')) return;
  var changed = false;
  state.notes.forEach(function(n){
    if(n.x==null || n.y==null) return;
    var nx = clamp(n.x, 0, window.innerWidth-STICKY_W);
    var ny = clamp(n.y, 0, window.innerHeight-STICKY_H);
    if(nx!==n.x || ny!==n.y){ n.x=nx; n.y=ny; changed=true; }
  });
  if(changed){ renderStickyLayer(); debounceSaveNotes(); }
});
render();
})();
</script>
