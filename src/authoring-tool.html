// Coach-only UI prefs (which inbox subsections are collapsed, which pipeline stages
// are checked in the filter bar) — kept in localStorage rather than on a draft/pending
// record since they describe how one coach's browser likes to view the inbox, not
// anything about the sessions themselves. Falls back to an in-memory default whenever
// localStorage throws (private browsing, blocked site data, etc.).
var INBOX_COLLAPSE_KEY = 'coachInboxCollapsedGroups';
var INBOX_STAGE_FILTER_KEY = 'coachInboxStageFilter';
var INBOX_STAGES = ['submitted', 'revision', 'draft', 'pending', 'ready', 'shipped'];
var INBOX_STAGE_LABELS = {
  submitted: 'Ready for review', revision: 'Needs revision', draft: 'In progress',
  pending: 'Pending polish', ready: 'Ready for Code', shipped: 'Shipped'
};
function loadInboxPref(key, fallback){
  try {
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch(e){ return fallback; }
}
function saveInboxPref(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){}
}
var inboxCollapsedGroups = loadInboxPref(INBOX_COLLAPSE_KEY, {});
// Every stage checked except 'draft' (In progress) — the one expected to pile up
// fastest, per Eric: "I imagine there will be hundreds fairly quickly."
var inboxStageFilter = loadInboxPref(INBOX_STAGE_FILTER_KEY, {
  submitted:true, revision:true, draft:false, pending:true, ready:true, shipped:true
});
// One emoji per pipeline stage, shared by the coach inbox's group headings, every
// status badge (via statusMeta below), and the student's own inbox on the home screen —
// same visual language on both sides of the review, not a separate scheme each.
var STAGE_EMOJI = {
  draft: '📝', submitted: '📥', revision: '✏️', accepted: '🎉',
  reviewed: '✅', pending: '✨', ready: '📦', shipped: '🚀'
};
// Single source of truth for the status badge — three call sites (student review, inbox
// row, coach review) used to each carry their own copy of this ternary, which is how the
// 'submitted' label ended up drifting ("Waiting for coach" vs "Waiting for review") and
// why the fallback for an unrecognized status quietly renders as "Reviewed" everywhere.
function statusMeta(status, audience){
  var known = status==='draft' || status==='submitted' || status==='revision' || status==='reviewed' || status==='accepted';
  var normalized = known ? status : 'reviewed';
  var cls = 'status-'+normalized;
  var label = status==='draft' ? 'Drafting'
    : status==='submitted' ? (audience==='student' ? 'Waiting for coach' : 'Waiting for review')
    : status==='revision' ? (audience==='student' ? 'Sent back with notes' : 'Needs revision')
    : status==='accepted' ? 'Accepted'
    : 'Reviewed';
  return {cls:cls, label:label, emoji:STAGE_EMOJI[normalized], full:STAGE_EMOJI[normalized]+' '+label};
}
// A student's own draft never changes status past 'accepted' — the pending/shipped
// distinction lives on the separate pending:<id> record their coach owns, looked up
// into resumeStageById by enrichMatchesWithStage, so the home-screen inbox can show
// "being polished" vs "shipped" instead of just "accepted" once it knows which. Falls
// back to the plain statusMeta reading whenever that lookup hasn't happened or found
// nothing (still loading, or an older accepted draft with no matching pending record).
function studentStageMeta(d){
  var pendingStatus = resumeStageById[d.id];
  if(d.status==='accepted' && pendingStatus==='shipped'){
    return {cls:'status-reviewed', full:STAGE_EMOJI.shipped+' Shipped to code'};
  }
  if(d.status==='accepted' && pendingStatus==='pending'){
    return {cls:'status-submitted', full:STAGE_EMOJI.pending+' Being polished'};
  }
  var sm = statusMeta(d.status, 'student');
  return {cls:sm.cls, full:sm.full};
}

/* ============================= COACH INBOX (for the human coach) ============================= */
// One row's markup — pulled out so the three priority groups below render
// identically instead of three copies of the same template drifting apart.
// No Download-as-Markdown button here — that's only offered once a session has been
// accepted (Pending polish / Ready for Code / Shipped, via renderPendingRow), not while
// it's still in the student/coach back-and-forth.
function renderInboxRow(d){
  var sm = statusMeta(d.status, 'coach'), statusCls = sm.cls, statusLabel = sm.full;

  '<div class="inbox-row" data-action="openInboxDraft" data-id="'+esc(d.id)+'">'+
    '<div class="ir-left"><h4>'+esc(d.title||'Untitled')+' — <span style="font-weight:400;">'+esc(d.studentName)+'</span></h4><p>CODE '+esc(d.id)+' · updated '+timeAgo(d.updatedAt)+'</p></div>'+
    '<span class="status-badge '+statusCls+'">'+statusLabel+'</span>'+
  '</div>';

// A submitted draft is the only one waiting on the coach to do anything, so it leads;
// a still-drafting one has no action pending yet; a reviewed one is done. Each group
// keeps listAllDrafts' existing most-recently-updated-first order. rowFn defaults to
// renderInboxRow (draft: records); the Pending/Finalized groups pass renderPendingRow
// instead, since those rows come from pending: records with a different shape.
// groupKey is the stable id (see INBOX_STAGES) collapse state is saved under —
// separate from `label`, which carries an emoji and can't double as a storage key.
// A Unicode ▾ renders as a barely-visible sliver at this size in most UI fonts —
// an inline SVG chevron stays crisp and rotates cleanly for the collapsed state.
var INBOX_CHEVRON_SVG = '<svg viewBox="0 0 12 8" width="10" height="7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.5l5 5 5-5"/></svg>';
function renderInboxGroup(label, list, rowFn, groupKey){
  if(!list.length) return '';

  return '<div class="inbox-group">'+
    '<h3 class="inbox-group-head" data-action="toggleInboxGroup" data-groupkey="'+esc(groupKey||'')+'">'+
      '<span class="inbox-group-arrow'+(collapsed?' collapsed':'')+'">'+INBOX_CHEVRON_SVG+'</span>'+esc(label)+' ('+list.length+')'+
    '</h3>'+
    (collapsed ? '' : list.map(rowFn || renderInboxRow).join(''))+
  '</div>';
}
// Coach inbox search/filter — applied to both draft: and pending: records before they're
// split into groups, so a search narrows every group (and Finalized) consistently.
// "Date submitted" reads submittedAt on either record type (see newPendingFromDraft,
// which carries it over) rather than updatedAt, which drifts every time anyone — coach
// or student — touches the record again.
function matchesInboxFilter(record){
  var q = (state.inboxSearch||'').trim().toLowerCase();
  if(q){
    var hay = ((record.title||'')+' '+(record.studentName||'')).toLowerCase();
    if(hay.indexOf(q)===-1) return false;
  }
  var dateVal = record.submittedAt;
  if(state.inboxDateFrom){
    var fromTs = new Date(state.inboxDateFrom+'T00:00:00').getTime();
    if(!dateVal || dateVal < fromTs) return false;
  }
  if(state.inboxDateTo){
    var toTs = new Date(state.inboxDateTo+'T23:59:59').getTime();
    if(!dateVal || dateVal > toTs) return false;
  }
  return true;
}
// One "Week of <date>" entry reads better than the raw ISO string a <input type="date">
// hands back — this is display-only, the stored value stays the plain "YYYY-MM-DD".
function formatWeekOf(isoDate){
  var dt = new Date(isoDate+'T00:00:00');
  if(isNaN(dt.getTime())) return isoDate;
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function renderPendingRow(p){

    ? ('Sent to code '+timeAgo(p.sentToCodeAt)+(p.usageWeeks.length? ' · used '+p.usageWeeks.length+'×' : ''))

    '<div style="display:flex; align-items:center; gap:10px;">'+

      '<span class="status-badge '+badgeCls+'">'+badgeLabel+'</span>'+

function renderShellInbox(){
  var filteredDrafts = state.inboxList.filter(matchesInboxFilter);
  var filteredPending = state.pendingList.filter(matchesInboxFilter);

  // (inboxStageFilter) rather than just visually hidden — see renderInboxFilterBar.
  var submitted = inboxStageFilter.submitted ? filteredDrafts.filter(function(d){ return d.status==='submitted'; }) : [];
  var needsRevision = inboxStageFilter.revision ? filteredDrafts.filter(function(d){ return d.status==='revision'; }) : [];
  var inProgress = inboxStageFilter.draft ? filteredDrafts.filter(function(d){ return d.status==='draft'; }) : [];
  // 'reviewed' drafts don't get their own group any more — loadInbox migrates every one

  // by the time a coach sees the inbox they've already folded into Pending polish below.
  var pendingRows = inboxStageFilter.pending ? filteredPending.filter(function(p){ return p.status==='pending'; }) : [];

  var shippedRows = inboxStageFilter.shipped ? filteredPending.filter(function(p){ return p.status==='shipped'; }) : [];

      renderInboxGroup(STAGE_EMOJI.revision+' Needs revision', needsRevision, null, 'revision')+

  // A separate archive, not another priority group — nothing here is waiting on the

  ) : '';
  var errorBanner = state.inboxError ? '<div class="banner">⚠️ '+esc(state.inboxError)+'</div>' : '';

    '<div style="margin-bottom:30px;">'+

          '<div class="ir-left"><h4>'+esc(m.displayUsername||m.username)+'</h4><p>'+esc(reasonLabel)+' · locked '+timeAgo(m.lockedAt)+(m.studentAppeal&&m.studentAppealAt?' · explanation sent':'')+'</p></div>'+
          '<span class="status-badge status-flagged">High priority</span>'+

    '</div>'
  ) : '';

  return ''+
  '<div class="home-wrap" style="padding-top:44px;">'+
    '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:26px;">'+
      '<div><div class="eyebrow">COACH INBOX</div><h1 style="color:#fff; font-size:28px; margin-top:6px;">Drafts to review</h1></div>'+
      '<div style="display:flex; align-items:center; gap:10px;">'+
        (FEEDBACK_ENABLED? '<button class="btn btn-ghost-light" data-action="openInboxFeedback">💬 Feedback</button>' : '')+
        '<button class="btn btn-ghost-light" data-action="goHome">← Back home</button>'+
        '<button class="btn btn-ghost-light" data-action="coachSignOut">Sign out</button>'+
      '</div>'+
    '</div>'+
    '<div class="inbox-filter-bar">'+
      '<input type="text" id="inboxSearchInput" placeholder="Search by title or username…" value="'+esc(state.inboxSearch)+'">'+
      '<label class="inbox-filter-date-label">Submitted<input type="date" id="inboxDateFromInput" value="'+esc(state.inboxDateFrom)+'" title="Submitted from"></label>'+
      '<span class="inbox-filter-sep">–</span>'+
      '<input type="date" id="inboxDateToInput" value="'+esc(state.inboxDateTo)+'" title="Submitted to">'+
      ((state.inboxSearch || state.inboxDateFrom || state.inboxDateTo) ? '<button type="button" class="btn btn-ghost-light btn-small" data-action="clearInboxFilter">Clear</button>' : '')+
    '</div>'+
    '<div class="inbox-stage-filter">'+
      '<span class="inbox-stage-filter-label">Show:</span>'+
      INBOX_STAGES.map(function(stageKey){
        var checked = !!inboxStageFilter[stageKey];
        return '<label class="inbox-stage-chip'+(checked?' checked':'')+'">'+

          esc(STAGE_EMOJI[stageKey])+' '+esc(INBOX_STAGE_LABELS[stageKey])+
        '</label>';
      }).join('')+
    '</div>'+
    errorBanner+
    flaggedSection+
    rows+
    pastSection+
  '</div>';
}

/* ============================= PENDING (coach polish, post-acceptance) ============================= */
// The one long-scrolling form a coach polishes before shipping — see newPendingFromDraft
// for how it's built and updatePendingField/data-pbind for how edits get wired up.
function pendingCheckinBlockHtml(block, prefix, heading, locked){
  var optsRows = block.options.map(function(o, oi){
    return '<div class="qrow"><input type="text" data-pbind="'+prefix+'Opt" data-oidx="'+oi+'" maxlength="200" value="'+esc(o)+'"'+(locked?' disabled':'')+'></div>';
  }).join('');
  return ''+
  '<div class="panel">'+
    '<h3>'+esc(heading)+'</h3>'+
    '<div class="field"><label>Question</label><textarea data-pbind="'+prefix+'Q" maxlength="300"'+(locked?' disabled':'')+'>'+esc(block.question)+'</textarea></div>'+
    '<div class="field"><label>Options</label><div class="qlist">'+optsRows+'</div></div>'+
    '<div class="field"><label>'+(prefix==='halftime'?'Forward-looking line':'Closing line')+'</label><textarea data-pbind="'+prefix+'Refl" maxlength="300"'+(locked?' disabled':'')+'>'+esc(block.reflection)+'</textarea></div>'+
  '</div>';
}
function renderPendingScreen(){
  var p = state.pendingDraft;
  if(!p){
    return '<div class="home-wrap inbox-draft-wrap">'+
      '<button class="btn btn-ghost-light btn-small" data-action="closePendingDraft" style="margin-bottom:16px;">← All drafts</button>'+
      '<div class="empty-state">Loading…</div>'+
    '</div>';
  }
  // 'ready' means the coach has signaled polishing is done, same as 'shipped' —
  // fields lock at that point, and only "Mark shipped" / usage weeks stay live.
  var locked = p.status==='ready' || p.status==='shipped';

  var scenarioBlocks = p.scenarios.map(function(sc, i){
    var optsHtml = sc.options.map(function(o, oi){
      var lane = LANES[o.colorIndex];
      return ''+
      '<div class="pending-option" style="--c:'+lane.color+'; --soft:'+lane.soft+'">'+
        '<div class="field"><label>Option '+(oi+1)+' label</label><input type="text" data-pbind="optLabel" data-sidx="'+i+'" data-oidx="'+oi+'" maxlength="60" value="'+esc(o.label)+'"'+(locked?' disabled':'')+'></div>'+
        '<div class="field"><label>Why</label><textarea data-pbind="optRationale" data-sidx="'+i+'" data-oidx="'+oi+'" maxlength="400"'+(locked?' disabled':'')+'>'+esc(o.rationale)+'</textarea></div>'+
        '<div class="field"><label>Icon</label><div class="icon-desc-box"><span class="icon-desc-glyph">'+iconGlyphHtml(o, i, oi, 'pending', locked)+'</span>'+
          '<input type="text" data-pbind="optIcon" data-sidx="'+i+'" data-oidx="'+oi+'" maxlength="80" value="'+esc(o.iconDescription)+'" placeholder="Search for an image"'+(locked?' disabled':'')+'>'+
          (locked? '' : iconSearchBtnHtml(i, oi, 'pending'))+
        '</div>'+
        (locked? '' : iconSearchStripHtml(o, i, oi, 'pending'))+
        '</div>'+
      '</div>';
    }).join('');
    var chHtml = sc.challenge.map(function(q, qi){
      return '<div class="qrow"><input type="text" data-pbind="challenge" data-sidx="'+i+'" data-qidx="'+qi+'" maxlength="300" value="'+esc(q)+'"'+(locked?' disabled':'')+'></div>';
    }).join('');
    return ''+
    '<div class="panel">'+
      '<h3>Scenario '+(i+1)+' <span class="hint-inline">'+esc(sc.domain||'no domain set')+'</span></h3>'+
      '<div class="field"><label>Title</label><input type="text" data-pbind="scTitle" data-sidx="'+i+'" maxlength="80" value="'+esc(sc.title)+'"'+(locked?' disabled':'')+'></div>'+
      '<div class="field"><label>Setup</label><textarea data-pbind="scSetup" data-sidx="'+i+'" maxlength="600"'+(locked?' disabled':'')+'>'+esc(sc.setup)+'</textarea></div>'+
      '<div class="pending-options">'+optsHtml+'</div>'+
      '<div class="field" style="margin-top:12px;"><label>Challenge questions</label><div class="qlist">'+chHtml+'</div></div>'+
      '<div class="field"><label>Reflection question <span class="hint-inline">(coach-written — never shown to the student)</span></label><textarea data-pbind="scReflection" data-sidx="'+i+'" maxlength="300"'+(locked?' disabled':'')+'>'+esc(sc.reflection)+'</textarea></div>'+
    '</div>';
  });

  var usageWeeksHtml = (p.usageWeeks||[]).slice().sort().map(function(w){
    return '<div class="usage-week-row"><span>Week of '+esc(formatWeekOf(w))+'</span>'+
      '<button type="button" class="btn-icon" data-action="removeUsageWeek" data-week="'+esc(w)+'" title="Remove">✕</button></div>';
  }).join('');

  // The pending-polish pipeline example is meant to stay pending — advancing it would
  // collapse the demo stages into each other, so it gets the same reference-material
  // treatment as the two seeded example sessions.
  var isPipelineDemo = isSeededExampleId(p.id);
  var shipControls;
  if(p.status==='shipped'){
    shipControls = '<div class="hint">Sent to code '+timeAgo(p.sentToCodeAt)+'.</div>';
  } else if(p.status==='ready'){
    shipControls = isPipelineDemo
      ? '<div class="hint">This is a pipeline example, so there\'s nothing to ship — it\'s meant to stay Ready for code.</div>'
      : (''+
          '<button type="button" class="btn btn-ghost" disabled title="Coming soon — will export directly to the session code / Notion">🚀 Ship to code — coming soon!</button>'+
          '<button type="button" class="btn btn-primary" data-action="markSentToCode" data-id="'+esc(p.id)+'">✓ Mark shipped</button>'
        );
  } else {
    shipControls = isPipelineDemo
      ? '<div class="hint">This is a pipeline example, so there\'s nothing to mark ready — it\'s meant to stay Pending.</div>'
      : '<button type="button" class="btn btn-primary" data-action="markPendingReady" data-id="'+esc(p.id)+'">📦 Mark ready for code</button>';
  }

  var statusBadgeCls = p.status==='shipped' ? 'status-reviewed' : p.status==='ready' ? 'status-ready' : 'status-submitted';
  var statusBadgeLabel = p.status==='shipped' ? 'Shipped' : p.status==='ready' ? 'Ready for code' : 'Pending';

  var blurbMissingMantra = !locked && p.parentBlurb.trim() && p.parentBlurb.indexOf(MANTRA)===-1;

  return ''+
  '<div class="home-wrap inbox-draft-wrap">'+
    '<button class="btn btn-ghost-light btn-small" data-action="closePendingDraft" style="margin-bottom:16px;">← All drafts</button>'+
    '<div style="margin-bottom:10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">'+
      '<span class="status-badge '+statusBadgeCls+'">'+statusBadgeLabel+'</span>'+
      (locked? '' : '<span id="pendingSaveIndicator" class="rail-save-indicator '+pendingSaveStatus+'">'+saveStatusText(pendingSaveStatus)+'</span>')+
      '<button class="btn btn-ghost btn-small" data-action="exportMarkdownPending" data-id="'+esc(p.id)+'">⬇ Download as Markdown</button>'+
    '</div>'+
    '<div class="page-head"><h2>'+esc(p.title||'Untitled')+' <span style="font-weight:400; font-size:16px; color:var(--ink-soft);">— '+esc(p.studentName)+'</span></h2></div>'+
    (p.bigIdea ? ('<div class="panel" style="background:#F0EBDA;"><h3>Original overall idea <span class="hint-inline">(the student\'s brainstorm — reference only, not part of the session)</span></h3><p style="font-size:13.5px; line-height:1.5; white-space:pre-wrap;">'+esc(p.bigIdea)+'</p></div>') : '')+
    '<div class="panel">'+
      '<h3>Title</h3>'+
      '<div class="field"><input type="text" data-pbind="title" maxlength="80" value="'+esc(p.title)+'"'+(locked?' disabled':'')+'></div>'+
    '</div>'+
    '<div class="panel">'+
      '<h3>Parent blurb</h3>'+
      '<div class="hint" style="margin-bottom:8px;">This is what parents actually see. Close with: "'+MANTRA+'"</div>'+
      '<div class="field"><textarea id="pendingParentBlurbInput" data-pbind="parentBlurb" maxlength="2000" style="min-height:140px;"'+(locked?' disabled':'')+'>'+esc(p.parentBlurb)+'</textarea></div>'+
      '<div class="banner" id="pendingParentBlurbWarning"'+(blurbMissingMantra?'':' hidden')+'>⚠️ Doesn\'t close with the standard line yet.</div>'+
    '</div>'+
    scenarioBlocks.slice(0,3).join('')+
    pendingCheckinBlockHtml(p.halftime, 'halftime', 'Halftime', locked)+
    scenarioBlocks.slice(3).join('')+
    pendingCheckinBlockHtml(p.reflection, 'reflection', 'Closing reflection', locked)+
    // Usage tracking only makes sense once it's actually shipped — nothing to log while
    // it's still pending or ready-but-not-yet-sent.
    (p.status==='shipped' ? (
      '<div class="panel">'+
        '<h3>Used in sessions</h3>'+
        (usageWeeksHtml || '<div class="hint" style="margin-bottom:10px;">Not used yet.</div>')+
        '<div class="usage-week-add"><input type="date" id="usageWeekInput"><button type="button" class="btn btn-ghost btn-small" data-action="addUsageWeek" data-id="'+esc(p.id)+'">+ Add a week used</button></div>'+
      '</div>'
    ) : '')+
    '<div class="panel"><div class="review-actions">'+shipControls+'</div></div>'+
  '</div>';
}

/* ============================= COACH DRAWER (AI) ============================= */
function renderLockedBody(mod){
  var reasonText = mod.lockReason==='severe' ? 'a flagged message' : 'repeated off-topic messages';
  var appealSent = mod.studentAppeal && mod.studentAppealAt;
  return ''+
  '<div class="bubble system-hint">🔒 Your assistant chat is turned off after '+reasonText+'. This applies to every session you build until a coach turns it back on.</div>'+
  (appealSent ?
    '<div class="bubble ai">Your explanation has been sent to your coaches. Sit tight — you can keep working on your scenarios in the meantime.</div>'
    :
    '<div class="bubble ai">If you\'d like, you can send a coach a short explanation asking them to review this.</div>'
  );
}
function renderCoachOverlay(){
  var d = state.draft;
  var mod = state.moderation;
  var isLocked = !!(mod && mod.locked);
  var appealSent = isLocked && mod.studentAppeal && mod.studentAppealAt;
  var existing = document.getElementById('coachOverlayRoot');
  var html = ''+
  '<button class="coach-tab" data-action="toggleCoach">'+(isLocked?'🔒':'💬')+'<span>Help</span></button>'+
  '<div class="coach-drawer'+(state.coachOpen?' open':'')+'">'+
    '<div class="coach-head"><div><h3>Assistant</h3><p>'+(isLocked?'Turned off for now.':'Ask about balance, tone, or anything else.')+'</p></div><button class="coach-close" data-action="toggleCoach">✕</button></div>'+
    '<div class="coach-body" id="coachBody">'+
      (isLocked ? renderLockedBody(mod) : (
        (d.aiChat.length===0 ? '<div class="bubble system-hint">Say hi, or use the buttons on a scenario / review page to get instant feedback.</div>' : '')+
        d.aiChat.map(function(m){
          return '<div class="bubble '+(m.role==='user'?'user':'ai')+'">'+esc(m.text)+'</div>';
        }).join('')+
        (state.coachLoading? '<div class="bubble ai typing-dots"><span></span><span></span><span></span></div>' : '')
      ))+
    '</div>'+
    (isLocked ? (
      appealSent ? '' : (
        '<div class="coach-foot">'+
          '<textarea id="coachInput" placeholder="Explain what happened (sent to a coach)..."></textarea>'+
          '<button class="btn btn-primary btn-small" data-action="sendAppeal">Send</button>'+
        '</div>'
      )
    ) : (
      '<div class="coach-foot">'+
        '<textarea id="coachInput" placeholder="Ask your assistant..."></textarea>'+
        '<button class="btn btn-primary btn-small" data-action="sendCoachMsg">Send</button>'+
      '</div>'
    ))+
  '</div>';
  var wrap = existing;
  var isNew = false;
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'coachOverlayRoot';
    document.body.appendChild(wrap);
    isNew = true;
  }
  wrap.innerHTML = html;
  if(isNew){ wrap.addEventListener('click', handleClick); }
  var input = wrap.querySelector('#coachInput');
  if(input){
    input.addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(isLocked) sendAppealFromInput(); else sendCoachFromInput(); }
    });
  }
  var body = document.getElementById('coachBody');
  if(body) body.scrollTop = body.scrollHeight;
}

/* ============================= STICKY NOTES (private, freeform, per-screen) ============================= */
var DRAG_HANDLE_SVG = '<svg viewBox="0 0 10 16" width="10" height="16" fill="currentColor"><circle cx="2" cy="2" r="1.3"/><circle cx="8" cy="2" r="1.3"/><circle cx="2" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="2" cy="14" r="1.3"/><circle cx="8" cy="14" r="1.3"/></svg>';
function renderStickyNote(n){
  var sel = n.id===selectedNoteId ? ' selected' : '';
  return ''+
  '<div class="sticky-note note-'+n.color+sel+'" data-noteid="'+n.id+'" style="left:'+n.x+'px; top:'+n.y+'px; z-index:'+n.z+'">'+
    '<div class="sticky-drag-handle" data-drag-note="'+n.id+'">'+DRAG_HANDLE_SVG+
      '<button class="note-delete" data-action="deleteNote" data-noteid="'+n.id+'" title="Delete note">✕</button>'+
    '</div>'+
    '<div class="note-colors">'+NOTE_COLORS.map(function(c){
      return '<button class="note-color-dot note-color-'+c+(c===n.color?' selected':'')+'" data-action="setNoteColor" data-noteid="'+n.id+'" data-color="'+c+'" title="'+c+'"></button>';
    }).join('')+'</div>'+
    '<textarea data-bind="noteText" maxlength="1000" data-noteid="'+n.id+'" placeholder="Write a thought...">'+esc(n.text)+'</textarea>'+
  '</div>';
}
function renderStickyLayer(){
  var attach = currentAttachForScreen();
  var notes = notesFor(attach);
  var html = ''+
    '<div class="note-dock">'+
      '<div class="note-stack">'+
        '<div class="note-stack-sheet"></div><div class="note-stack-sheet"></div>'+
        '<div class="note-stack-sheet note-stack-top" id="noteStackTop" tabindex="0" role="button" aria-label="Add a sticky note">+</div>'+
      '</div>'+
      '<div class="note-stack-hint">Drag or click to grab a note</div>'+
    '</div>'+
    '<div class="note-trash" id="noteTrash" title="Drag a note here to throw it away">🗑️</div>'+
    notes.map(renderStickyNote).join('');

  var existing = document.getElementById('notesOverlayRoot');
  var wrap = existing;
  var isNew = false;
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'notesOverlayRoot';
    document.body.appendChild(wrap);
    isNew = true;
  }
  wrap.innerHTML = html;
  if(isNew){
    wrap.addEventListener('click', handleClick);
    // Clicking empty overlay background (not a note) clears the selection outline.
    wrap.addEventListener('pointerdown', function(e){
      if(!e.target.closest('.sticky-note') && selectedNoteId){
        selectedNoteId = null;
        wrap.querySelectorAll('.sticky-note.selected').forEach(function(el){ el.classList.remove('selected'); });
      }
    });
  }
  attachStickyInputHandlers(wrap, attach);
}
function attachStickyInputHandlers(wrap, attach){
  wrap.querySelectorAll('.sticky-note').forEach(function(cardEl){
    var noteId = cardEl.getAttribute('data-noteid');
    // Selecting (and bringing to front) is separate from dragging, so clicking
    // anywhere on a note — including its textarea — always raises it, even
    // though (per the handle-band rule below) a note's handle never actually
    // ends up fully buried in the first place.
    cardEl.addEventListener('pointerdown', function(){
      selectedNoteId = noteId;
      var note = state.notes.filter(function(n){ return n.id===noteId; })[0];
      if(note){ note.z = ++noteZCounter; cardEl.style.zIndex = note.z; }
      wrap.querySelectorAll('.sticky-note.selected').forEach(function(el){ el.classList.remove('selected'); });
      cardEl.classList.add('selected');
    });
  });
  wrap.querySelectorAll('textarea[data-bind="noteText"]').forEach(function(el){
    el.addEventListener('input', function(){
      var note = state.notes.filter(function(n){ return n.id===el.getAttribute('data-noteid'); })[0];
      if(note){ note.text = el.value; note.updatedAt = Date.now(); debounceSaveNotes(); }
    });
  });
  wrap.querySelectorAll('[data-drag-note]').forEach(function(handle){
    handle.addEventListener('pointerdown', function(e){
      if(e.target.closest('.note-delete')) return; // let the delete button's own click through
      var note = state.notes.filter(function(n){ return n.id===handle.getAttribute('data-drag-note'); })[0];
      if(note) startNoteDrag(e, note);
    });
  });
  var stackTop = wrap.querySelector('#noteStackTop');
  if(stackTop){
    stackTop.addEventListener('pointerdown', function(e){
      var x = clamp(e.clientX - STICKY_W/2, 0, window.innerWidth-STICKY_W);
      var y = clamp(e.clientY - STICKY_H/2, 0, window.innerHeight-STICKY_H);
      var note = newNote(attach, '', x, y);
      state.notes.push(note);
      renderStickyLayer();
      startNoteDrag(e, note); // pulling from the stack is just a drag that starts on a brand-new note
    });
    // Keyboard path: there's no cursor to drop the note under, so place it beside the
    // dock and focus its textarea instead of starting a drag.
    stackTop.addEventListener('keydown', function(e){
      if(e.key!=='Enter' && e.key!==' ') return;
      e.preventDefault();
      var note = newNote(attach, '',
        clamp(window.innerWidth - STICKY_W - 90, 0, window.innerWidth-STICKY_W),
        clamp(240, 0, window.innerHeight-STICKY_H));
      state.notes.push(note);
      selectedNoteId = note.id;
      debounceSaveNotes();
      renderStickyLayer();
      var ta = document.querySelector('.sticky-note[data-noteid="'+note.id+'"] textarea');
      if(ta) ta.focus();
    });
  }
}
function showTrash(visible){
  var t = document.getElementById('noteTrash');
  if(t) t.classList.toggle('visible', visible);
}
function isOverTrash(noteEl){
  var t = document.getElementById('noteTrash');
  if(!t || !noteEl) return false;
  var a = noteEl.getBoundingClientRect(), b = t.getBoundingClientRect();
  // A full-box overlap test against a note several times the trash icon's size meant
  // its edge merely passing near the icon was enough to delete it. Require the note's
  // own center to actually land on (or just past the edge of) the icon instead — a
  // modest touch-friendly pad, not "anywhere the note happens to reach."
  var pad = 16;
  var cx = a.left + a.width/2, cy = a.top + a.height/2;
  return cx > b.left-pad && cx < b.right+pad && cy > b.top-pad && cy < b.bottom+pad;
}
// Ensures a just-moved note never fully covers another note's grab-bar band,
// so every note in a pile stays individually grabbable by its visible top edge —
// mirrors how a real pile of sticky notes fans out. Runs once, on drop (not
// continuously mid-drag), so dragging itself stays smooth and unconstrained.
function resolveHandleOcclusion(note){
  var guard = 0, moved = true;
  while(moved && guard < 50){
    moved = false; guard++;
    state.notes.forEach(function(n){
      if(n.id===note.id || attachKey(n.attach)!==attachKey(note.attach)) return;
      var overlapsX = note.x < n.x+STICKY_W && note.x+STICKY_W > n.x;
      var overlapsHandleY = note.y < n.y+HANDLE_H && note.y+STICKY_H > n.y;
      if(overlapsX && overlapsHandleY){ note.y = n.y+HANDLE_H; moved = true; }
    });
  }
  note.y = clamp(note.y, 0, window.innerHeight-STICKY_H);
}
function startNoteDrag(e, note){
  e.preventDefault();
  note.z = ++noteZCounter;
  selectedNoteId = note.id;
  var startX = e.clientX, startY = e.clientY, origX = note.x, origY = note.y;
  var el = document.querySelector('.sticky-note[data-noteid="'+note.id+'"]');
  if(el){ el.style.zIndex = note.z; el.classList.add('selected'); }
  showTrash(true);
  function onMove(ev){
    note.x = clamp(origX + (ev.clientX-startX), 0, window.innerWidth-STICKY_W);
    note.y = clamp(origY + (ev.clientY-startY), 0, window.innerHeight-STICKY_H);
    if(el){
      el.style.left = note.x+'px'; el.style.top = note.y+'px';
      el.classList.toggle('over-trash', isOverTrash(el));
    }
  }
  function onUp(ev){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    showTrash(false);
    if(el && isOverTrash(el)){
      state.notes = state.notes.filter(function(n){ return n.id!==note.id; });
      selectedNoteId = null;
      saveNotes();
      renderStickyLayer();
    } else {
      resolveHandleOcclusion(note);
      if(el){ el.style.left = note.x+'px'; el.style.top = note.y+'px'; el.classList.remove('over-trash'); }
      debounceSaveNotes();
    }
  }
  // A drag can be interrupted (alt-tab, a context menu popping up mid-drag)
  // without a pointerup ever firing — without this, the note would be stuck
  // "mid-drag" with the trash left showing and these window listeners never
  // cleaned up. Treat a cancel exactly like a normal drop.
  function onCancel(ev){ onUp(ev); }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
}
function removeNotesOverlay(){
  var existing = document.getElementById('notesOverlayRoot');
  if(existing) existing.remove();
}

/* ---------- Coach editor's notes, student-facing overlay ----------
   Same idea as the sticky-note dock above, but the notes come from the coach (stored on
   the draft, see newEditorNote) and are read-only, draggable-only — no delete, no color.
   A separate #editorNotesOverlayRoot so this never fights with renderStickyLayer's full
   innerHTML replacement of #notesOverlayRoot. */
var EDITOR_NOTE_W = 200, EDITOR_NOTE_H = 120;
var editorNoteZCounter = 46;
function editorNotesForScreen(d){
  if(!d) return [];
  return (d.editorNotes||[]).filter(function(n){
    if(n.resolvedAt) return false;
    var loc = screenForFieldKey(n.field, d);
    if(!loc || loc.screen !== state.screen) return false;
    if(loc.screen==='scenario' && loc.scenarioIndex !== state.scenarioIndex) return false;
    return true;
  });
}
// Finds the DOM field a note is attached to, so a freshly-arrived note can drop in next
// to the thing it's actually about instead of a generic corner of the screen.
function editorNoteAnchorEl(n, d){
  var p = parseFieldKey(n.field);
  var sel = null;
  if(p.kind==='setup') sel = '[data-bind="'+(p.sub==='title'?'title':'bigIdea')+'"]';
  else if(p.kind==='halftime') sel = '[data-bind="'+(p.sub==='question'?'halftimeQ':(p.sub==='options'?'halftimeOpt':'halftimeRefl'))+'"]';
  else if(p.kind==='reflection') sel = '[data-bind="'+(p.sub==='question'?'reflectionQ':(p.sub==='options'?'reflectionOpt':'reflectionRefl'))+'"]';
  else if(p.kind==='scenario') sel = '[data-bind="'+(p.sub==='title'?'scTitle':(p.sub==='setup'?'scSetup':'challenge'))+'"]';
  else if(p.kind==='scenarioOption'){
    var idx = scenarioIndexById(d, p.scenarioId);
    var sc = idx===-1 ? null : d.scenarios[idx];
    var oi = sc ? optionIndexById(sc, p.optionId) : -1;
    if(oi===-1) return null;
    var bindName = p.sub==='label' ? 'option.label' : (p.sub==='rationale' ? 'option.rationale' : 'option.iconDescription');
    sel = '[data-bind="'+bindName+'"][data-oidx="'+oi+'"]';
  }
  return sel ? document.querySelector(sel) : null;
}
function placeEditorNoteIfNeeded(n, d){
  if(n.x!=null && n.y!=null) return;
  var el = editorNoteAnchorEl(n, d);
  var x, y;
  if(el){
    var r = el.getBoundingClientRect();
    x = r.right + 16; y = r.top;
  } else {
    x = window.innerWidth - EDITOR_NOTE_W - 24; y = 120;
  }
  n.x = clamp(x, 0, window.innerWidth-EDITOR_NOTE_W);
  n.y = clamp(y, 0, window.innerHeight-EDITOR_NOTE_H);
  n.z = ++editorNoteZCounter;
  debounceSave();
}
function renderEditorNote(n){
  return ''+
  '<div class="editor-note" data-editornoteid="'+n.id+'" style="left:'+n.x+'px; top:'+n.y+'px; z-index:'+(n.z||editorNoteZCounter)+'">'+
    '<div class="editor-note-drag" data-drag-editornote="'+n.id+'" title="Drag to move">'+DRAG_HANDLE_SVG+'</div>'+
    '<div class="editor-note-text">'+esc(n.text)+'</div>'+
    '<div class="editor-note-byline">— Your coach</div>'+
  '</div>';
}
function renderEditorNoteLayer(){
  var d = state.draft;
  var notes = editorNotesForScreen(d);
  notes.forEach(function(n){ placeEditorNoteIfNeeded(n, d); });
  var html = notes.map(renderEditorNote).join('');
  var wrap = document.getElementById('editorNotesOverlayRoot');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'editorNotesOverlayRoot';
    document.body.appendChild(wrap);
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-drag-editornote]').forEach(function(handle){
    handle.addEventListener('pointerdown', function(e){
      var note = notes.filter(function(n){ return n.id===handle.getAttribute('data-drag-editornote'); })[0];
      if(note) startEditorNoteDrag(e, note);
    });
  });
}
// Deliberately simpler than startNoteDrag: no trash target (students can't delete these),
// no handle-occlusion pass (a coach rarely leaves more than one open note per field), and
// it commits through the normal draft autosave since editorNotes lives on the draft record
// itself rather than the separate private-notes store.
function startEditorNoteDrag(e, note){
  e.preventDefault();
  note.z = ++editorNoteZCounter;
  var startX = e.clientX, startY = e.clientY, origX = note.x, origY = note.y;
  var el = document.querySelector('.editor-note[data-editornoteid="'+note.id+'"]');
  if(el) el.style.zIndex = note.z;
  function onMove(ev){
    note.x = clamp(origX + (ev.clientX-startX), 0, window.innerWidth-EDITOR_NOTE_W);
    note.y = clamp(origY + (ev.clientY-startY), 0, window.innerHeight-EDITOR_NOTE_H);
    if(el){ el.style.left = note.x+'px'; el.style.top = note.y+'px'; }
  }
  function onUp(ev){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    debounceSave();
  }
  function onCancel(ev){ onUp(ev); }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
}
function removeEditorNotesOverlay(){
  var existing = document.getElementById('editorNotesOverlayRoot');
  if(existing) existing.remove();
}

/* ============================= ICON SEARCH (Noun Project, via serverless proxy) ============================= */
function performIconSearch(query){
  state.iconSearchLoading = true;
  state.iconSearchError = '';
  state.iconSearchResults = [];
  render();
  fetch(ICON_SEARCH_ENDPOINT+'?q='+encodeURIComponent(query))
    .then(function(res){
      if(!res.ok) throw new Error('search-failed');
      return res.json();
    })
    .then(function(data){
      state.iconSearchLoading = false;
      state.iconSearchResults = (data && Array.isArray(data.results)) ? data.results : [];
      render();
    })
    .catch(function(){
      state.iconSearchLoading = false;
      state.iconSearchError = "Icon search isn't working right now — try again in a bit.";
      render();
    });
}
// Fetches the chosen icon's bytes (embedded as a data: URI by api/icon-asset.js)
// and only then writes selectedIcon — never the raw search result, which still
// carries Noun Project's own, soon-to-expire thumbnailUrl/iconUrl.
function embedSelectedIcon(icon, scenarioIndex, optionIndex, mode){
  state.iconEmbedPending = {mode:mode||'draft', scenarioIndex:scenarioIndex, optionIndex:optionIndex};
  state.iconEmbedError = '';
  render();
  fetch(ICON_EMBED_ENDPOINT+'?id='+encodeURIComponent(icon.id))
    .then(function(res){
      if(!res.ok) return res.json().catch(function(){ return {}; }).then(function(err){
        throw new Error(err.error || 'embed-failed');
      });
      return res.json();
    })
    .then(function(data){
      state.iconEmbedPending = null;
      // The scenario/option this was for may no longer exist — e.g. the option
      // count shrank while this request was in flight.
      var source = mode==='pending' ? state.pendingDraft : state.draft;
      var sc = source && source.scenarios[scenarioIndex];
      var opt = sc && sc.options[optionIndex];
      if(opt){
        opt.selectedIcon = {
          id: icon.id,
          thumbnailUrl: data.dataUri,
          iconUrl: data.dataUri,
          attributionName: data.attributionName || icon.attributionName || null,
          attributionUrl: data.attributionUrl || icon.attributionUrl || null
        };
        state.iconSearchOpen = null;
        if(mode==='pending') debouncePendingSave(); else debounceSave();
      }
      render();
    })
    .catch(function(e){
      state.iconEmbedPending = null;
      state.iconEmbedError = (e && e.message && e.message!=='embed-failed')
        ? e.message
        : "Couldn't save that icon — try again in a moment.";
      render();
    });
}
function iconSearchStripHtml(o, scenarioIdx, optionIdx, mode){
  var loc = state.iconSearchOpen;
  if(!loc || loc.mode!==(mode||'draft') || loc.scenarioIndex!==scenarioIdx || loc.optionIndex!==optionIdx) return '';
  var pending = state.iconEmbedPending;
  var isEmbedding = !!(pending && pending.mode===(mode||'draft') && pending.scenarioIndex===scenarioIdx && pending.optionIndex===optionIdx);
  var resultsHtml = state.iconSearchResults.map(function(icon, idx){
    var selected = o.selectedIcon && o.selectedIcon.id===icon.id;
    return '<button type="button" class="icon-search-result'+(selected?' selected':'')+'" data-action="selectIcon" data-idx="'+idx+'" title="'+esc(icon.attributionName||'Noun Project icon')+'"><img src="'+esc(icon.thumbnailUrl)+'" alt=""></button>';
  }).join('');
  var body = isEmbedding
    ? '<div class="icon-search-status">Saving icon…</div>'
    : state.iconEmbedError
      ? '<div class="icon-search-status icon-search-error">'+esc(state.iconEmbedError)+'</div>'
      : (state.iconSearchLoading
        ? '<div class="icon-search-status">Searching…</div>'
        : state.iconSearchError
          ? '<div class="icon-search-status icon-search-error">'+esc(state.iconSearchError)+'</div>'
          : (state.iconSearchResults.length
              ? '<div class="icon-search-results">'+resultsHtml+'</div>'
              : '<div class="icon-search-status">No icons found. Try a simpler word.</div>'));
  return '<div class="icon-search-strip"><button type="button" class="icon-search-dismiss" data-action="dismissIconSearch" title="Close">✕</button>'+body+'</div>';
}

/* ============================= AI COACH CALL ============================= */
function askCoach(userText, contextObj){
  var d = state.draft;
  if(state.moderation && state.moderation.locked){
    state.coachOpen = true; render(); return;
  }
  d.aiChat.push({role:'user', text:userText});
  state.coachOpen = true;
  state.coachLoading = true;
  render();
  var msgPayload = contextObj ?
    ('Here is what I\'m working on right now (as data): '+JSON.stringify(contextObj)+'\n\nMy question: '+userText) :
    userText;
  var history = d.aiChat.slice(0,-1).map(function(m){ return {role: m.role==='user'?'user':'assistant', content:m.text}; });
  history.push({role:'user', content: msgPayload});

  fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system: COACH_SYSTEM_PROMPT,
      messages: history
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    var text = '';
    if(data && data.content){
      text = data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n');
    }
    var parsed = null;
    if(text){
      try{ parsed = JSON.parse(text.replace(/```json|```/g,'').trim()); }catch(e){ parsed = null; }
    }
    if(!parsed || typeof parsed.verdict !== 'string' || typeof parsed.reply !== 'string'){
      parsed = {verdict:'ok', reply: text || "Hmm, I didn't get a clear answer back. Try asking again, or check with a human coach."};
    }
    handleVerdict(parsed.verdict, parsed.reply, userText);
  }).catch(function(e){
    d.aiChat.push({role:'assistant', text:"I couldn't reach the assistant just now. Try again in a moment, or ask a human coach for now."});
  }).finally(function(){
    state.coachLoading = false;
    debounceSave();
    render();
  });
}
function ensureModeration(){
  if(!state.moderation) state.moderation = newModerationRecord(state.draft.studentName);
  return state.moderation;
}
function handleVerdict(verdict, reply, userText){
  var d = state.draft;
  var mod = ensureModeration();
  if(verdict==='severe'){
    mod.locked = true;
    mod.lockReason = 'severe';
    mod.lockedAt = Date.now();
    mod.lockSourceDraftId = d.id;
    mod.lockMessageExcerpt = userText.slice(0,300);
    mod.incidents.push({at:Date.now(), severity:'severe', excerpt:userText.slice(0,200), draftId:d.id, modelNote:(reply||'').slice(0,200)});
    saveModeration(mod);
    d.aiChat.push({role:'assistant', text: LOCK_MESSAGE_SEVERE});
    return;
  }
  if(verdict==='mild'){
    mod.redirectCount = (mod.redirectCount||0) + 1;
    mod.incidents.push({at:Date.now(), severity:'mild', excerpt:userText.slice(0,200), draftId:d.id, modelNote:(reply||'').slice(0,200)});
    if(mod.redirectCount >= 3){
      mod.locked = true;
      mod.lockReason = 'repeated';
      mod.lockedAt = Date.now();
      mod.lockSourceDraftId = d.id;
      mod.lockMessageExcerpt = userText.slice(0,300);
      saveModeration(mod);
      d.aiChat.push({role:'assistant', text: LOCK_MESSAGE_REPEATED});
      return;
    }
    saveModeration(mod);
    var shown = mod.redirectCount===1 ? REDIRECT_MESSAGE_1 : (REDIRECT_MESSAGE_2 + '\n\n' + WARN_MESSAGE);
    d.aiChat.push({role:'assistant', text: shown});
    return;
  }
  d.aiChat.push({role:'assistant', text: reply});
}

/* ============================= MARKDOWN EXPORT ============================= */
function iconExportFilename(o){
  var word = (o.iconDescription || o.label || 'icon').trim().toLowerCase().split(/\s+/)[0].replace(/[^a-z0-9]/g,'') || 'icon';
  return 'noun-'+word+'-'+o.selectedIcon.id+'.webp';
}
function toMarkdown(d){
  var lines = [];
  lines.push('# '+(d.title||'Untitled Session'));
  lines.push('');
  lines.push('## Title');
  lines.push('');
  lines.push('- '+(d.title||'Untitled Session'));
  lines.push('');
  lines.push('## Session idea');
  lines.push('');
  lines.push((d.bigIdea||'').trim());
  lines.push('');
  lines.push('> Staff: use this to write the official Parent blurb (closing with: "'+MANTRA+'") and the Alex/Florence intro.');
  lines.push('');
  if((d.coachMessage||'').trim()){
    lines.push('## Message to coach');
    lines.push('');
    lines.push(d.coachMessage.trim());
    lines.push('');
  }
  lines.push('## Portal Image');
  lines.push('');
  lines.push('[Portal image placeholder]');
  lines.push('');
  lines.push('### Intro to discussions and Session Context 🎞️ 1-2');
  lines.push('');
  lines.push('[To be written by staff — see Session idea above]');
  lines.push('');
  var ranges = ['2-6','6-10','10-14','15-19','19-23','23-27'];
  d.scenarios.forEach(function(sc,i){
    lines.push('### Scenario '+(i+1)+': '+(sc.title||'Untitled')+' '+ranges[i]);
    lines.push('');
    lines.push(sc.setup||'');
    lines.push('');
    sc.options.forEach(function(o,oi){
      lines.push((oi+1)+'.\t'+(o.label||'(untitled)')+': '+(o.rationale||''));
      lines.push('');
      if(o.selectedIcon){
        lines.push('!['+iconExportFilename(o)+']('+o.selectedIcon.iconUrl+')');
        if(o.selectedIcon.attributionName){
          lines.push('<!-- Icon credit: '+o.selectedIcon.attributionName+(o.selectedIcon.attributionUrl? ' — '+o.selectedIcon.attributionUrl : '')+' -->');
        }
      } else {
        lines.push('![Icon placeholder — '+(o.iconDescription? o.iconDescription : 'no description yet')+'](icon-placeholder.webp)');
      }
      lines.push('');
    });
    lines.push('`challenge questions`');
    lines.push('');
    sc.challenge.filter(function(q){return q.trim();}).forEach(function(q){ lines.push(q); lines.push(''); });
    lines.push('`reflection question`');
    lines.push('');
    lines.push(sc.reflection||'');
    lines.push('');
    if(i===2){
      var h = d.halftime;
      lines.push('### Halftime 14-15');
      lines.push('');
      lines.push(h.question||'');
      lines.push('');
      h.options.filter(function(o){return o.trim();}).forEach(function(o){ lines.push('- '+o); });
      lines.push('');
      lines.push('`reflection question`');
      lines.push('');
      lines.push(h.reflection||'');
      lines.push('');
    }
  });
  var r = d.reflection;
  lines.push('### Reflection 27-28');
  lines.push('');
  lines.push(r.question||'');
  lines.push('');
  r.options.filter(function(o){return o.trim();}).forEach(function(o){ lines.push('- '+o); });
  lines.push('');
  lines.push('`reflection`');
  lines.push('');
  lines.push(r.reflection||'');
  lines.push('');
  lines.push('### Say goodbye 28+');
  return lines.join('\n');
}

/* ============================= EVENT HANDLING ============================= */
// Once a coach accepts a draft, the student's copy is frozen — see acceptDraft — so
// their edits don't drift away from the pending polish snapshot the coach is now
// working from. render() also disables every input/textarea/select on a locked draft's
// screens; this is the belt to that suspenders, in case a stale/disabled element's
// input event still manages to fire.
function isDraftLocked(d){
  return !!(d && d.status==='accepted');
}
function updateDraftField(bind, el, oidx, qidx){
  var d = state.draft;
  if(isDraftLocked(d)) return;
  var v = el.value;
  if(bind==='title') d.title=v;
  else if(bind==='bigIdea') d.bigIdea=v;
  else if(bind==='scTitle') d.scenarios[state.scenarioIndex].title=v;
  else if(bind==='scDomain') d.scenarios[state.scenarioIndex].domain=v;
  else if(bind==='scSetup') d.scenarios[state.scenarioIndex].setup=v;
  else if(bind==='option.label') d.scenarios[state.scenarioIndex].options[oidx].label=v;
  else if(bind==='option.rationale') d.scenarios[state.scenarioIndex].options[oidx].rationale=v;
  else if(bind==='option.iconDescription') d.scenarios[state.scenarioIndex].options[oidx].iconDescription=v;
  else if(bind==='challenge') d.scenarios[state.scenarioIndex].challenge[qidx]=v;
  else if(bind==='halftimeQ') d.halftime.question=v;
  else if(bind==='halftimeRefl') d.halftime.reflection=v;
  else if(bind==='halftimeOpt') d.halftime.options[oidx]=v;
  else if(bind==='reflectionQ') d.reflection.question=v;
  else if(bind==='reflectionRefl') d.reflection.reflection=v;
  else if(bind==='reflectionOpt') d.reflection.options[oidx]=v;
  else if(bind==='coachMessage') d.coachMessage=v;
}
// Parallel to updateDraftField, but for the coach's pending-polish screen — separate
// bind namespace (data-pbind) and a scenario index carried explicitly (data-sidx) since,
// unlike the student's one-scenario-per-screen editor, the whole session is one long
// scrolling page here.
function updatePendingField(bind, el, sidx, oidx, qidx){
  var p = state.pendingDraft;
  if(!p || p.status==='ready' || p.status==='shipped') return;
  var v = el.value;
  if(bind==='title') p.title=v;
  else if(bind==='parentBlurb') p.parentBlurb=v;
  else if(bind==='scTitle') p.scenarios[sidx].title=v;
  else if(bind==='scSetup') p.scenarios[sidx].setup=v;
  else if(bind==='scReflection') p.scenarios[sidx].reflection=v;
  else if(bind==='challenge') p.scenarios[sidx].challenge[qidx]=v;
  else if(bind==='optLabel') p.scenarios[sidx].options[oidx].label=v;
  else if(bind==='optRationale') p.scenarios[sidx].options[oidx].rationale=v;
  else if(bind==='optIcon') p.scenarios[sidx].options[oidx].iconDescription=v;
  else if(bind==='halftimeQ') p.halftime.question=v;
  else if(bind==='halftimeOpt') p.halftime.options[oidx]=v;
  else if(bind==='halftimeRefl') p.halftime.reflection=v;
  else if(bind==='reflectionQ') p.reflection.question=v;
  else if(bind==='reflectionOpt') p.reflection.options[oidx]=v;
  else if(bind==='reflectionRefl') p.reflection.reflection=v;
}

// The inbox search box needs the whole list to re-filter live, but a full render()
// replaces the input's own DOM node — which would drop focus and cursor position mid-
// keystroke. Debounce it, then restore focus (and cursor) to whatever was focused
// before the render, by id. Only the search box uses this; the date pickers are
// discrete change events, not continuous typing, so they render() directly.
var inboxFilterTimer = null;
function debounceInboxFilterRender(){
  if(inboxFilterTimer) clearTimeout(inboxFilterTimer);
  inboxFilterTimer = setTimeout(function(){
    inboxFilterTimer = null;
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    render();
    if(activeId){
      var el = document.getElementById(activeId);
      if(el){
        el.focus();
        if(selStart!=null && el.setSelectionRange) el.setSelectionRange(selStart, selStart);
      }
    }
  }, 300);
}
function attachGlobalHandlers(){
  // text inputs / textareas -> update state without full rerender
  app.querySelectorAll('input[data-bind], textarea[data-bind]').forEach(function(el){
    el.addEventListener('input', function(){
      var bind = el.getAttribute('data-bind');
      var oidx = el.getAttribute('data-oidx');
      var qidx = el.getAttribute('data-qidx');
      updateDraftField(bind, el, oidx!==null?parseInt(oidx,10):null, qidx!==null?parseInt(qidx,10):null);
      debounceSave();
    });
  });
  // coach password: Enter submits, and the field takes focus on arrival
  var pwField = document.getElementById('coachPassword');
  if(pwField){
    pwField.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var btn = app.querySelector('[data-action="coachLogin"]');
        if(btn) btn.click();
      }
    });
    if(!state.coachAuthBusy) pwField.focus();
  }
  // icon search: Enter runs the search, same as clicking the Search button
  app.querySelectorAll('input[data-bind="option.iconDescription"]').forEach(function(el){
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var btn = el.parentElement.querySelector('[data-action="searchIcon"]');
        if(btn) btn.click();
      }
    });
  });
  // select dropdown
  app.querySelectorAll('select[data-bind]').forEach(function(el){
    el.addEventListener('change', function(){
      var bind = el.getAttribute('data-bind');
      updateDraftField(bind, el, null, null);
      debounceSave();
      render();
    });
  });
  // Coach pending-polish screen — same shape as the data-bind wiring above, its own
  // namespace so it can carry a scenario index (data-sidx) the student's editor never
  // needs (only one scenario is ever on screen there).
  app.querySelectorAll('input[data-pbind], textarea[data-pbind]').forEach(function(el){
    el.addEventListener('input', function(){
      var bind = el.getAttribute('data-pbind');
      var sidx = el.getAttribute('data-sidx');
      var oidx = el.getAttribute('data-oidx');
      var qidx = el.getAttribute('data-qidx');
      updatePendingField(bind, el, sidx!==null?parseInt(sidx,10):null, oidx!==null?parseInt(oidx,10):null, qidx!==null?parseInt(qidx,10):null);
      debouncePendingSave();
    });
  });
  // icon search: Enter runs the search, same as clicking the Search button — mirrors
  // the data-bind wiring above for the student's own iconDescription field.
  app.querySelectorAll('input[data-pbind="optIcon"]').forEach(function(el){
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        var btn = el.parentElement.querySelector('[data-action="searchIcon"]');
        if(btn) btn.click();
      }
    });
  });
  // Live "doesn't close with the standard line yet" warning on the parent blurb —
  // a targeted toggle rather than a full render(), so typing doesn't lose the cursor.
  var blurbEl = document.getElementById('pendingParentBlurbInput');
  if(blurbEl){
    blurbEl.addEventListener('input', function(){
      var warn = document.getElementById('pendingParentBlurbWarning');
      if(warn) warn.hidden = !blurbEl.value.trim() || blurbEl.value.indexOf(MANTRA)!==-1;
    });
  }
  // Coach inbox search/filter — see matchesInboxFilter. Search is continuous typing
  // (debounced, focus-preserving); the date pickers are discrete change events, so they
  // just render() straight away.
  var inboxSearchEl = document.getElementById('inboxSearchInput');
  if(inboxSearchEl){
    inboxSearchEl.addEventListener('input', function(){
      state.inboxSearch = inboxSearchEl.value;
      debounceInboxFilterRender();
    });
  }
  var inboxDateFromEl = document.getElementById('inboxDateFromInput');
  if(inboxDateFromEl){
    inboxDateFromEl.addEventListener('change', function(){
      state.inboxDateFrom = inboxDateFromEl.value;
      render();
    });
  }
  var inboxDateToEl = document.getElementById('inboxDateToInput');
  if(inboxDateToEl){
    inboxDateToEl.addEventListener('change', function(){
      state.inboxDateTo = inboxDateToEl.value;
      render();
    });
  }
  // Coach "Leave feedback" box — autosaves onto the draft as coachDraftNote, mirroring
  // the Pending screen's autosave, so a coach's in-progress note survives a reload
  // before they've clicked Send back / Accepted. See saveCoachDraftNote.
  var coachFeedbackEl = document.getElementById('coachFeedbackText');
  if(coachFeedbackEl){
    coachFeedbackEl.addEventListener('input', function(){
      var d = state.inboxList.filter(function(x){ return x.id===state.inboxSelectedId; })[0];
      if(!d) return;
      d.coachDraftNote = coachFeedbackEl.value;
      debounceCoachNoteSave(d, 'coachFeedbackSaveIndicator');
    });
  }
  // Field-note compose box — same autosave treatment, scoped to whichever field is
  // currently open (state.composingNoteField), keyed so switching fields before saving
  // doesn't lose either draft.
  var noteComposeEl = document.getElementById('fieldNoteComposeInput');
  if(noteComposeEl){
    noteComposeEl.addEventListener('input', function(){
      var d = state.inboxList.filter(function(x){ return x.id===state.inboxSelectedId; })[0];
      if(!d || !state.composingNoteField) return;
      d.noteComposeDrafts[state.composingNoteField] = noteComposeEl.value;
      debounceCoachNoteSave(d, 'fieldNoteComposeSaveIndicator');
    });
  }
}
function attachAppDelegatesOnce(){

function sendCoachFromInput(){

// Opens an already-loaded draft: resets save/notes state, enters the shell, then
// fills in moderation + notes asynchronously. Shared by "start new", "resume", and
// "open an example session" (startScreen lets the example land on the storyboard
// instead of setup, since there's nothing to fill in there).
function enterDraft(d, startScreen){
  state.draft = d; state.homeError=''; state.submitError=''; state.screen=startScreen||'setup'; saveStatus='saved'; isDirty=false;
  state.notes=[]; notesDirty=false; selectedNoteId=null; state.resumeMatches=[];
  render();
  // The moderation record exists only to drive the AI assistant's lockout flow. While
  // the assistant is off nothing can write one and nothing reads it, so fetching it is
  // a wasted round-trip on every draft open (and one more thing that can fail).
  if(AI_ASSISTANT_ENABLED){
    loadModeration(d.studentName).then(function(m){ state.moderation = m; render(); });
  }
  loadNotes(d.id).then(function(n){
    var needsSave = false;
    n.forEach(function(note, idx){
      if(note.x==null || note.y==null){
        // Legacy note from before freeform positions existed — give it a
        // sane starting spot instead of rendering at left:NaNpx.
        note.x = clamp(window.innerWidth - 260 + (idx%4)*14, 0, window.innerWidth-STICKY_W);
        note.y = clamp(120 + idx*30, 0, window.innerHeight-STICKY_H);
        note.z = ++noteZCounter;
        needsSave = true;
      } else if(note.z > noteZCounter){
        noteZCounter = note.z; // keep future new notes on top of previously-saved ones
      }
    });
    state.notes = n;
    if(needsSave) debounceSaveNotes();
    render();
  });
}

// Structural edits an accepted, frozen draft shouldn't accept even though the disabled-
// input pass in render() only covers text/select fields, not these action buttons.
// Navigation, preview, export, and goHome are deliberately not in this list — a locked
// draft is read-only, not unreachable.
var LOCKED_DRAFT_ACTIONS = ['moveScenario','moveLane','addChallenge','removeChallenge','setOptionCount',
  'addreflectionOpt','removereflectionOpt','addhalftimeOpt','removehalftimeOpt','clearIcon','searchIcon',
  'selectIcon','dismissIconSearch','submitToCoach'];
function handleClick(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.getAttribute('data-action');
  if(state.draft && isDraftLocked(state.draft) && LOCKED_DRAFT_ACTIONS.indexOf(action)!==-1) return;

  if(action==='startNew'){
    var name = window.storage.studentUsername();
    if(!name){ state.homeError='Open your personal link to start a session.'; render(); return; }
    state.draft = newDraft(name);
    state.notes = [];
    state.homeError='';
    state.resumeMatches=[];
    state.screen='setup';
    saveDraft();
    render();
    if(AI_ASSISTANT_ENABLED){
      loadModeration(name).then(function(m){ state.moderation = m; render(); });
    }
    return;
  }
  if(action==='resumeDraft'){ refreshMyDrafts(); return; }
  if(action==='studentSignOut'){
    window.storage.studentSignOut();
    // Drop ?s= too, or the next reload would silently sign them straight back in.
    try {
      if(window.history && window.history.replaceState) window.history.replaceState(null, '', window.location.pathname);
    } catch(e){ /* nothing to do; the token is cleared either way */ }
    state.draft=null; state.notes=[]; state.resumeMatches=[]; state.homeError='';
    state.screen='home'; render();
    return;
  }
  if(action==='openResumeDraft'){
    var resumeId = t.getAttribute('data-id');
    var chosen = state.resumeMatches.filter(function(d){ return d.id===resumeId; })[0];
    if(!chosen) return;
    enterDraft(chosen);
    return;
  }
  if(action==='previewResumeDraft'){
    var previewId = t.getAttribute('data-id');
    var previewDraft = state.resumeMatches.filter(function(d){ return d.id===previewId; })[0];
    if(!previewDraft) return;
    state.draft = previewDraft;
    state.ppStep = ppStepForKind('scenario', 0);
    state.ppChallengeIndex = 0;
    state.ppReturnScreen = 'home';
    state.screen = 'playerPreview';
    render();
    return;
  }
  if(action==='renameResumeDraft'){
    var renameId = t.getAttribute('data-id');
    var renameDraft = state.resumeMatches.filter(function(d){ return d.id===renameId; })[0];
    if(!renameDraft) return;
    // This list is reachable independent of state.draft, so the LOCKED_DRAFT_ACTIONS
    // guard up top (which only looks at state.draft) never sees this one — check here too.
    if(isDraftLocked(renameDraft)) return;
    var newTitle = prompt('Rename this draft:', renameDraft.title || '');
    if(newTitle===null) return; // cancelled
    newTitle = newTitle.trim();
    if(!newTitle || newTitle===renameDraft.title) return;
    renameDraft.title = newTitle;
    renameDraft.updatedAt = Date.now();
    render(); // optimistic — reflect the new name immediately
    window.storage.set('draft:'+renameDraft.id, JSON.stringify(renameDraft), true).catch(function(e){
      console.error('rename failed', e);
      state.homeError = "Couldn't save the new name — try again in a moment.";
      render();
    });
    return;
  }
  if(action==='deleteResumeDraft'){
    var deleteId = t.getAttribute('data-id');
    var deleteDraft = state.resumeMatches.filter(function(d){ return d.id===deleteId; })[0];
    if(!deleteDraft) return;
    if(!confirm('Are you sure you want to delete "'+(deleteDraft.title||'Untitled')+'"? This can\'t be undone.')) return;
    window.storage.delete('draft:'+deleteDraft.id).then(function(){
      state.resumeMatches = state.resumeMatches.filter(function(d){ return d.id!==deleteId; });
      render();
    }).catch(function(e){
      console.error('delete failed', e);
      state.homeError = "Couldn't delete that draft — try again in a moment.";
      render();
    });
    return;
  }
  if(action==='openExampleDraft'){
    var exampleKey = t.getAttribute('data-example');
    var exampleDraft = buildExampleDraft(exampleKey);
    if(!exampleDraft) return;
    enterDraft(exampleDraft, 'storyboard');
    return;
  }
  if(action==='goHome'){ if(state.draft) saveDraft(); if(notesDirty) saveNotes(); state.draft=null; state.moderation=null; state.notes=[]; selectedNoteId=null; state.resumeMatches=[]; state.submitError=''; state.feedbackSent=false; state.feedbackError=''; state.feedbackSending=false; removeNotesOverlay(); removeEditorNotesOverlay(); state.screen='home'; state.coachOpen=false; removeCoachOverlay(); render(); refreshMyDrafts(); return; }
  if(action==='openFeedback'){ state.feedbackSent=false; state.feedbackError=''; state.screen='feedback'; render(); return; }
  if(action==='submitFeedback'){
    var likesEl = document.getElementById('feedbackLikes');
    var frustrationsEl = document.getElementById('feedbackFrustrations');
    var otherEl = document.getElementById('feedbackOther');
    var feedbackLikes = likesEl ? likesEl.value.trim() : '';
    var feedbackFrustrations = frustrationsEl ? frustrationsEl.value.trim() : '';
    var feedbackOther = otherEl ? otherEl.value.trim() : '';
    if(!feedbackLikes && !feedbackFrustrations && !feedbackOther){
      state.feedbackError='Fill in at least one box before sending — even a sentence helps.';
      render(); return;
    }
    var feedbackUsername = window.storage.studentUsername();
    state.feedbackSending=true; state.feedbackError=''; render();
    var feedbackId = genCode();
    window.storage.set('feedback:'+feedbackId, JSON.stringify({
      id: feedbackId, username: feedbackUsername,
      likes: feedbackLikes, frustrations: feedbackFrustrations, other: feedbackOther,
      createdAt: Date.now()
    })).then(function(){
      state.feedbackSending=false; state.feedbackSent=true; render();
    }).catch(function(e){
      console.error('feedback submit failed', e);
      state.feedbackSending=false;
      state.feedbackError="Couldn't send that — try again in a moment.";
      render();
    });
    return;
  }
  if(action==='goInbox'){
    if(!window.storage.hasCoachToken()){
      state.screen='coachLogin'; state.coachAuthError=''; state.coachAuthBusy=false; render(); return;
    }
    state.screen='inbox';
    render();
    loadInbox();
    return;
  }
  if(action==='clearInboxFilter'){
    state.inboxSearch=''; state.inboxDateFrom=''; state.inboxDateTo='';
    render();
    return;
  }
  if(action==='toggleInboxGroup'){
    var toggleGroupKey = t.getAttribute('data-groupkey');
    if(!toggleGroupKey) return;
    inboxCollapsedGroups[toggleGroupKey] = !inboxCollapsedGroups[toggleGroupKey];
    saveInboxPref(INBOX_COLLAPSE_KEY, inboxCollapsedGroups);
    render();
    return;
  }
  if(action==='toggleInboxStage'){
    var stageKey = t.getAttribute('data-stage');
    if(!stageKey) return;
    inboxStageFilter[stageKey] = !inboxStageFilter[stageKey];
    saveInboxPref(INBOX_STAGE_FILTER_KEY, inboxStageFilter);
    render();
    return;
  }
  if(action==='openInboxFeedback'){
    state.screen='inboxFeedback';
    render();
    loadInboxFeedback();
    return;
  }
  if(action==='coachLogin'){
    var pwEl = document.getElementById('coachPassword');
    var pw = pwEl ? pwEl.value : '';
    if(!pw){ state.coachAuthError='Enter the coach password.'; render(); return; }
    state.coachAuthBusy=true; state.coachAuthError=''; render();
    window.storage.coachLogin(pw).then(function(){
      state.coachAuthBusy=false; state.coachAuthError='';
      state.screen='inbox'; render();
      loadInbox();
    }).catch(function(e){
      console.error('coach sign-in failed', e);
