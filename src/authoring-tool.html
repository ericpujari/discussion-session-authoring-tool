<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Session Builder — Synthesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2937;
    --ink-soft:#4B5768;
    --board:#1D2B3A;
    --board-2:#26394C;
    --paper:#F6F1E4;
    --paper-2:#EFE6CE;
    --lane-a:#2E8B84;   --lane-a-soft:#DCEEEC; --lane-a-line:#bfe0dc;
    --lane-b:#6C63A6;   --lane-b-soft:#E8E4F5; --lane-b-line:#d3cdec;
    --lane-c:#B9791F;   --lane-c-soft:#F5E8CE; --lane-c-line:#e8d4a4;
    --lane-d:#A15B78;   --lane-d-soft:#F3E2EA; --lane-d-line:#e9cdd9;
    --pin:#B08A3E;
    --line: rgba(31,41,55,.14);
    --shadow: 0 10px 28px rgba(8,12,20,.22);
    --shadow-sm: 0 3px 10px rgba(8,12,20,.14);
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: 'Work Sans', system-ui, -apple-system, sans-serif;
    --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'Work Sans', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0) 0 0/22px 22px,
      linear-gradient(180deg, var(--board), var(--board-2));
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh; min-height:100dvh;}
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.02em;}
  h1{font-weight:700;}
  h2{font-weight:500;}
  h3{font-weight:600;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:15px; color:var(--ink);}
  /* iOS Safari zooms the whole page when a focused control is under 16px, and never
     zooms back out. Coarse-pointer only, so the desktop type scale is unaffected.
     Must come after every other font-size rule for inputs to win without !important. */
  @media (pointer:coarse){
    input,textarea,select,
    .lane input[type=text], .lane textarea,
    .icon-desc-box input[type=text],
    .sticky-note textarea,
    .coach-foot textarea{font-size:16px;}
  }
  a{color:inherit;}
  ::selection{background:var(--lane-b-soft);}
  :focus-visible{outline:3px solid #F2C572; outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#B9C4D0;}
  .eyebrow.dark{color:var(--ink-soft);}
  .glass-pill{
    display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16); border-radius:9999px; padding:8px 18px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .home-hero .eyebrow{font-size:11.5px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    padding:11px 18px; border-radius:999px; border:1.5px solid transparent;
    font-weight:600; font-size:14.5px; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink); color:var(--paper); box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:#31404f;}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:rgba(31,41,55,.06);}
  .btn-ghost-light{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#F2EEE1;}
  .btn-ghost-light:hover{background:rgba(255,255,255,.16);}
  .btn-small{padding:6px 12px; font-size:12.5px; border-radius:999px;}
  .btn-large{padding:15px 26px; font-size:16.5px;}
  .btn-icon{width:32px; height:32px; padding:0; border-radius:999px; border:1.5px solid var(--line); background:#fff;}
  .btn-danger-text{color:#9B3B34; background:transparent; border:none; font-size:13px; font-weight:600;}

  /* ---------- Home ---------- */
  .home-wrap{max-width:none; margin:0; padding:64px clamp(24px, 6vw, 120px) 80px;}
  /* Coach review page: no max-width cap, just a sticky-note's worth of gutter on each
     side (STICKY_W = 170px in JS, kept in sync here) so the card grows with the window. */
  .inbox-draft-wrap{max-width:none; margin:0; padding:44px 190px 80px;}
  @media (max-width:900px){ .inbox-draft-wrap{padding-left:24px; padding-right:24px;} }
  .home-hero{text-align:center; color:#F2EEE1; margin-bottom:44px;}
  .home-hero h1{
    font-size:clamp(30px,5vw,46px); margin:14px 0 12px; line-height:1.14;
    color:#fff;
    background-image:linear-gradient(165deg, #ffffff 35%, rgba(255,255,255,.42));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .home-hero p{color:#C7D2DD; font-size:16.5px; max-width:520px; margin:0 auto;}
  .home-hero .visibility-note{color:#93A2B3; font-size:13px; max-width:460px; margin:12px auto 0;}
  .home-cards{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:720px){.home-cards{grid-template-columns:1fr;}}
  .home-cards.single{display:flex; justify-content:center;}
  .home-cards.single .home-card{max-width:clamp(460px, 55vw, 780px); width:100%;}
  .home-card{
    background:var(--paper); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow);
    border-top:6px solid var(--lane-a);
    position:relative;
  }
  .home-card h3{font-size:20px; margin-bottom:6px;}
  .home-card p{color:var(--ink-soft); font-size:14px; margin-bottom:18px; line-height:1.5;}
  .home-card-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .field input[type=text], .field textarea, .field select{
    width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{border-color:var(--ink-soft);}
  .field textarea{resize:vertical; min-height:70px; line-height:1.45;}
  .field .hint{font-size:12px; color:#8B94A0; margin-top:5px; font-weight:400; text-transform:none; letter-spacing:0;}
  .home-footer-link{display:block; text-align:center; margin-top:36px; color:#C7D2DD; font-size:13.5px; text-decoration:underline; text-underline-offset:3px;}
  .home-footer-link:hover{color:#fff;}
  .student-inbox-heading{font-size:13px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:18px 0 4px;}
  .resume-matches{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .resume-match-row{
    background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer;
  }
  .resume-match-row:hover{border-color:var(--ink-soft);}
  .resume-match-row h4{font-size:14px; margin:0;}
  .resume-match-row p{font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); margin:2px 0 0;}
  .resume-match-row.with-actions{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .resume-match-actions{display:flex; gap:6px; flex-shrink:0;}
  .resume-match-actions .btn-icon{width:28px; height:28px; font-size:13px;}
  .feedback-callout{
    max-width:clamp(460px, 55vw, 780px); margin:20px auto 0; background:var(--lane-c-soft); border:1.5px solid var(--lane-c-line);
    border-radius:var(--radius); padding:26px 24px; text-align:center; box-shadow:var(--shadow);
  }
  .feedback-callout h3{color:var(--ink); font-size:20px; margin-bottom:8px;}
  .feedback-callout p{color:var(--ink-soft); font-size:14px; margin:0 0 18px; line-height:1.5;}
  .feedback-callout .btn-primary{background:var(--lane-c); color:#fff;}
  .feedback-callout .btn-primary:hover{background:#9c6519;}
  .example-sessions{max-width:clamp(460px, 55vw, 780px); margin:30px auto 0; text-align:center;}
  .example-sessions h3{color:#fff; font-size:15px; margin-bottom:4px;}
  .example-sessions p{color:#93A2B3; font-size:13px; margin-bottom:14px;}
  .example-sessions .resume-matches{margin-top:0; text-align:left;}

  /* ---------- Shell (after a draft is loaded) ---------- */
  .shell{display:flex; min-height:100vh; min-height:100dvh;}
  .rail{
    width:220px; flex-shrink:0; background:rgba(0,0,0,.18); padding:22px 14px; display:flex; flex-direction:column;
    border-right:1px solid rgba(255,255,255,.08);
    position:sticky; top:0; height:100vh; height:100dvh; overflow-y:auto;
  }
  .rail-code{font-family:var(--font-mono); font-size:11px; color:#9FB0C0; letter-spacing:.06em; margin-bottom:2px;}
  .rail-name{color:#fff; font-weight:600; font-size:14.5px; margin-bottom:18px;}
  .rail-step{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; color:#C7D2DD; font-size:13.5px;
    margin-bottom:2px; font-weight:500;
  }
  .rail-step .dot{width:7px; height:7px; border-radius:50%; background:#4A5C6E; flex-shrink:0;}
  .rail-step.active{background:rgba(255,255,255,.12); color:#fff;}
  .rail-step.active .dot{background:#F2C572;}
  .rail-step.done .dot{background:var(--lane-a);}
  .rail-step:hover{background:rgba(255,255,255,.08); cursor:pointer;}
  .rail-scenarios{margin:6px 0 10px 0; padding-left:4px; border-left:1.5px solid rgba(255,255,255,.14); margin-left:13px;}
  .rail-spacer{flex:1;}
  .rail-bottom{display:flex; flex-direction:column; gap:8px;}
  .rail-save-indicator{
    font-family:var(--font-mono); font-size:11px; color:#7C8CA0; padding:0 10px 8px; display:block;
    transition:color .15s ease;
  }
  .rail-save-indicator.unsaved{color:#E0A94C;}
  .rail-save-indicator.saving{color:#9FB0C0;}
  .rail-save-indicator.saved{color:#6FAE9F;}
  .rail-save-indicator.failed{color:#E08A7D; font-weight:600;}
  .rail-save-indicator.failedfinal, .rail-save-indicator.toobig{color:#F0776A; font-weight:700;}

  .main{flex:1; min-width:0; padding:34px clamp(40px, 5vw, 120px) 120px;}
  @media (max-width:860px){
    .shell{flex-direction:column;}
    .rail{width:100%; flex-direction:row; align-items:center; overflow-x:auto; overflow-y:visible; padding:12px 16px; gap:14px; height:auto; top:0;}
    .rail-scenarios{display:none;}
    .rail-name, .rail-code{display:none;}
    .rail-spacer{display:none;}
    .rail-bottom{flex-direction:row;}
    .rail-save-indicator{padding:0 4px; white-space:nowrap;}
    .main{padding:22px 18px 140px; margin:0;}
  }

  .page-head{margin-bottom:26px;}
  .page-head h2{color:#fff; font-size:clamp(24px,3vw,30px); margin:6px 0 8px;}
  .page-head p{color:#C7D2DD; font-size:14.5px; line-height:1.5;}

  .panel{background:var(--paper); border-radius:var(--radius); padding:26px 28px; box-shadow:var(--shadow); margin-bottom:20px; container-type:inline-size;}
  .panel h3{font-size:17px; margin-bottom:14px;}
  .row{display:flex; gap:14px;}
  .row > *{flex:1;}
  @media (max-width:600px){.row{flex-direction:column;}}

  .radio-cards{display:flex; gap:10px;}
  .radio-card{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; text-align:center;
    font-weight:600; font-size:14px; background:#fff; transition:all .12s ease;
  }
  .radio-card.selected{border-color:var(--ink); background:var(--paper-2); box-shadow:inset 0 0 0 1.5px var(--ink);}

  /* ---------- Storyboard ---------- */
  .board{
    background:var(--board); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0);
    background-size:16px 16px;
  }
  .board-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}
  @media (max-width:700px){.board-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:460px){.board-grid{grid-template-columns:1fr;}}
  .index-card{
    background:var(--paper); border-radius:10px; padding:16px; min-height:130px; box-shadow:0 6px 14px rgba(0,0,0,.35);
    position:relative; cursor:grab; transform:rotate(var(--r,0deg)); transition:transform .12s ease;
    border:1px solid rgba(0,0,0,.06);
  }
  .index-card:hover{transform:rotate(0deg) translateY(-2px);}
  .index-card.dragging{opacity:.4;}
  .index-card .pin{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #E4C77E, var(--pin)); box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .index-card .num{
    font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.05em;
    color:#fff; background:var(--ink); display:inline-block; padding:3px 9px; border-radius:6px;
    margin-bottom:10px;
  }
  .index-card h4{font-size:15.5px; margin-bottom:6px; line-height:1.25;}
  .index-card .domain-chip{
    display:inline-block; font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft); margin-top:8px;
  }
  .index-card .empty{color:#A69A78; font-size:13px; font-style:italic;}

  .index-card .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .index-card .move-btns{display:flex; gap:4px; flex-shrink:0;}
  .index-card .move-btns button{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:#fff;
    font-size:11px; line-height:1; padding:0; color:var(--ink-soft);
  }
  .index-card .move-btns button:hover{background:var(--paper-2); color:var(--ink);}
  /* HTML5 drag-and-drop never fires on touch, so these buttons are the only way to
     reorder there — size them for a fingertip rather than a cursor. */
  @media (pointer:coarse){
    .index-card .move-btns button, .lane .move-btns button{width:36px; height:36px; font-size:14px;}
  }

  .index-card.halftime-card{border:1.5px dashed var(--pin); cursor:pointer;}
  .index-card.halftime-card .num{background:var(--pin);}
  .index-card.halftime-card .halftime-pin{
    position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:17px; line-height:1;
  }

  .domain-panel{
    margin-top:18px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:16px 18px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .domain-panel h4{color:#fff; font-size:13px; margin-bottom:10px; font-family:var(--font-body); font-weight:600;}
  .domain-list{display:flex; flex-wrap:wrap; gap:8px;}
  .domain-pill{
    font-size:12.5px; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.10); color:#C7D2DD;
    display:flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .domain-pill.covered{background:rgba(46,139,132,.30); color:#CDEDE9; border-color:rgba(46,139,132,.4);}

  /* ---------- Scenario editor ---------- */
  .lanes{display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:6px;}
  /* Step the option-card grid up to 2, then 3/4 columns as the panel widens, instead of
     squeezing every lane into one unwrapped row (which forced lanes past their own
     min-content width and let them spill past the panel's edge). */
  @container (min-width:480px){
    .lanes-2, .lanes-3, .lanes-4{grid-template-columns:repeat(2, minmax(240px,1fr));}
  }
  @container (min-width:480px) and (max-width:739.98px){
    .lanes-3 .lane:last-child{grid-column:1 / -1;} /* odd one out spans full width instead of leaving a dead half-row */
  }
  @container (min-width:740px){
    .lanes-3{grid-template-columns:repeat(3, minmax(240px,1fr));}
  }
  @container (min-width:1050px){
    .lanes-4{grid-template-columns:repeat(4, minmax(240px,1fr));}
  }
  .lane, .lane *{min-width:0;}
  .lane{
    border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:9px;
    border-top:6px solid var(--c); background:var(--soft); cursor:grab; position:relative;
  }
  .lane.dragging{opacity:.45;}
  .lane .lane-head{display:flex; align-items:center; justify-content:space-between;}
  .lane .lane-tag{
    font-family:var(--font-mono); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:#fff; background:var(--c); display:inline-block; padding:3px 9px; border-radius:6px;
  }
  .lane .move-btns{display:flex; gap:4px;}
  .lane .move-btns button{width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:#fff; font-size:11px; line-height:1; padding:0;}
  .icon-desc-box{display:flex; align-items:center; gap:8px; align-self:stretch;}
  .icon-desc-glyph{
    width:38px; height:38px; border-radius:10px; background:#fff; border:1.5px dashed var(--line); color:#B9AF8E;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
  }
  .icon-desc-glyph svg{width:20px; height:20px;}
  .icon-desc-glyph img{width:100%; height:100%; object-fit:cover; border-radius:8px;}
  .icon-desc-clear{
    position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%; padding:0;
    background:#fff; border:1.5px solid var(--line); color:var(--ink-soft); font-size:9px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-desc-clear:hover{color:#9B3B34; border-color:#9B3B34;}
  .icon-desc-box input[type=text]{font-weight:500; font-style:italic; font-size:13px; flex:1;}
  .btn-icon-search{
    flex-shrink:0; padding:7px 12px; font-size:12px; font-weight:600; border-radius:8px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  }
  .btn-icon-search:hover{background:rgba(31,41,55,.06);}
  .lane input[type=text]{background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-weight:600;}
  .lane textarea{background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; min-height:150px; line-height:1.42; font-size:13.8px;}
  .wc{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); text-align:right;}

  .balance-strip{
    margin-top:4px; padding:14px 16px; border-radius:10px; background:#fff; border:1.5px solid var(--line);
    font-size:13px; color:var(--ink-soft); margin-bottom:22px;
  }
  .balance-strip .bs-title{display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink); margin-bottom:8px;}
  .balance-strip .b-icon{font-size:16px;}
  .balance-strip ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px;}
  .balance-strip li{line-height:1.4;}

  .qlist{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
  .qrow{display:flex; gap:8px; align-items:center;}
  .qrow input{flex:1;}
  .qrow button{flex-shrink:0;}
  .add-row-btn{font-size:13px; font-weight:600; color:var(--ink-soft); background:none; border:1.5px dashed var(--line); border-radius:8px; padding:8px 12px; text-align:left;}
  .add-row-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .scenario-nav{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}

  /* ---------- Review ---------- */
  .print-card{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:34px; margin-bottom:20px;}
  .print-card .p-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#9B8F6E;}
  .print-card h2.p-title{font-size:30px; margin:6px 0 10px;}
  .print-card .p-blurb{font-size:15px; line-height:1.6; color:#3c3527; margin-bottom:4px;}
  .print-card .p-blurb.p-internal{background:#F0EBDA; border:1px dashed #C9BE9C; border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:16px;}
  .print-card .p-blurb.p-internal .p-q-label{color:#8A7C52;}
  .p-scenario{padding:18px 0; border-top:1px solid var(--line);}
  .p-scenario h4{font-size:17px; margin-bottom:6px; display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .p-preview-link{font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--lane-a); cursor:pointer; white-space:nowrap; margin-left:auto;}
  .p-preview-link:hover{text-decoration:underline;}
  .p-scenario .p-setup{font-size:14.5px; line-height:1.55; margin-bottom:12px; color:#3c3527;}
  .p-opts{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .p-opt{display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border-radius:9px; border-left:5px solid var(--c); background:var(--soft);}
  .p-opt .p-opt-icon{width:44px; height:44px; flex-shrink:0; color:var(--c); background:#fff; border-radius:8px; padding:6px; box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .p-opt .p-opt-icon svg{width:100%; height:100%;}
  .p-opt .p-opt-icon img{width:100%; height:100%; object-fit:contain;}
  .p-icon-desc{display:block; font-size:12px; font-style:italic; color:#8a7f5e; margin-top:4px;}
  .p-opt b{font-size:14px;}
  .p-opt span{display:block; font-size:13.5px; color:#3c3527; margin-top:2px;}
  .p-q-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:#9B8F6E; margin:10px 0 4px;}
  .p-cqs{font-size:13.5px; line-height:1.9; color:#3c3527;}
  .p-refl{font-size:13.5px; font-style:italic; color:#3c3527;}
  .p-half{padding:18px 0; border-top:2px dashed var(--line);}
  .p-opt-content{flex:1; min-width:0;}
  .p-opt-notes{flex:0 0 240px; max-width:240px;}
  .p-opt-note-slot{margin-bottom:8px;}
  .p-opt-note-slot:last-child{margin-bottom:0;}
  @media (max-width:760px){
    .p-opt{flex-wrap:wrap;}
    .p-opt-notes{flex:1 1 100%; max-width:none; margin-top:8px;}
  }

  /* ---------- Coach editor's notes (per-field, review preview) ---------- */
  .field-notes{margin:6px 0 4px;}
  /* Notes sit in line with their content, to the right, instead of stacked underneath —
     see withNote. Collapses to stacked below a breakpoint, since a side column that
     narrow stops being legible. */
  .field-with-note{display:flex; gap:16px; align-items:flex-start; margin-bottom:2px;}
  .field-with-note-content{flex:1; min-width:0;}
  .field-with-note-side{flex:0 0 260px; max-width:260px;}
  @media (max-width:760px){
    .field-with-note{flex-direction:column; gap:6px;}
    .field-with-note-side{flex:none; max-width:none; width:100%;}
  }
  .field-note-slot-label{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:#B0A583; margin-bottom:3px;}
  .field-note{background:#FBEAE7; border:1px solid #E8C3BC; border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:12.5px; line-height:1.5;}
  .field-note-text{color:#7A342A;}
  .field-note-meta{font-family:var(--font-mono); font-size:10.5px; color:#9B6459; margin-top:4px;}
  .field-note-done{display:inline-flex; align-items:center; gap:5px; cursor:pointer; text-transform:none; letter-spacing:0;}
  .field-note-add-btn{font-size:11.5px; font-weight:700; color:#C0463A; background:none; border:none; padding:2px 0; cursor:pointer; margin-bottom:6px;}
  .field-note-add-btn:hover{text-decoration:underline;}
  .field-note-compose{background:#fff; border:2px solid #C0463A; border-radius:9px; padding:10px; margin-bottom:8px; box-shadow:0 0 0 3px rgba(192,70,58,.12);}
  .field-note-compose-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#9B8F6E; margin-bottom:6px;}
  .field-note-compose textarea{width:100%; min-height:60px; border:none; font-family:var(--font-body); font-size:13px; resize:vertical;}
  .field-note-compose textarea:focus{outline:none;}
  .field-note-compose-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}

  /* ---------- Pending (coach polish screen) ---------- */
  .hint-inline{font-size:11px; font-weight:400; color:#8B94A0; text-transform:none; letter-spacing:0;}
  .pending-options{display:flex; flex-direction:column; gap:12px; margin-top:12px;}
  .pending-option{border-left:4px solid var(--c); background:var(--soft); border-radius:10px; padding:12px 14px;}
  .pending-option .field{margin-bottom:8px;}
  .pending-option .field:last-child{margin-bottom:0;}
  .usage-week-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
  .usage-week-row:last-of-type{border-bottom:none; margin-bottom:10px;}
  .usage-week-add{display:flex; align-items:center; gap:8px;}
  .usage-week-add input[type="date"]{padding:6px 8px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px;}

  .review-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
  .status-badge{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:5px 11px; border-radius:999px; font-weight:600;}
  .status-draft{background:var(--lane-b-soft); color:#403A6E;}
  .status-submitted{background:var(--lane-c-soft); color:#7A5A16;}
  .status-revision{background:var(--lane-d-soft); color:#7A3C54;}
  .status-reviewed{background:var(--lane-a-soft); color:#1E5B56;}
  .status-accepted{background:var(--lane-a-soft); color:#1E5B56;}
  .status-ready{background:var(--lane-b-soft); color:#403A6E;}
  .status-flagged{background:#F5D4CF; color:#8A241A;}

  .accept-banner{display:flex; gap:14px; align-items:flex-start; background:var(--lane-a-soft); border:1.5px solid var(--lane-a-line);}
  .accept-banner-icon{font-size:28px; line-height:1;}
  .accept-banner h3{margin-bottom:4px;}
  .accept-banner p{font-size:13.5px; line-height:1.5; margin:0;}

  .coach-notes{background:#fff; border-radius:10px; padding:16px 18px; border:1.5px solid var(--line);}
  .coach-note{padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.8px; line-height:1.5;}
  .coach-note:last-child{border-bottom:none;}
  .coach-note .cn-meta{font-family:var(--font-mono); font-size:10.5px; color:#8B94A0; margin-bottom:3px;}

  /* ---------- Coach drawer ---------- */
  .coach-tab{
    position:fixed; right:max(0px, env(safe-area-inset-right)); top:calc(50% + 68px);
    transform:translateY(-50%) rotate(0deg); z-index:40;
    background:var(--ink); color:#F2EEE1; padding:14px 12px; border-radius:12px 0 0 12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:700; cursor:pointer;
    border:none;
  }
  .coach-drawer{
    position:fixed; top:0; right:0; height:100vh; height:100dvh; width:380px; max-width:92vw; background:#fff; box-shadow:-8px 0 30px rgba(0,0,0,.35);
    z-index:50; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .18s cubic-bezier(.4,0,1,1);
  }
  .coach-drawer.open{transform:translateX(0); transition:transform .42s cubic-bezier(.34,1.56,.64,1);}
  .coach-head{padding:18px 18px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start;}
  .coach-head h3{font-size:16.5px;}
  .coach-head p{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .coach-close{background:none; border:none; font-size:20px; color:var(--ink-soft); line-height:1;}
  .coach-body{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; background:#FAF7EF;}
  .bubble{max-width:88%; padding:10px 13px; border-radius:12px; font-size:13.8px; line-height:1.5;}
  .bubble.user{align-self:flex-end; background:var(--ink); color:#F2EEE1; border-bottom-right-radius:3px;}
  .bubble.ai{align-self:flex-start; background:#fff; border:1.5px solid var(--line); border-bottom-left-radius:3px; white-space:pre-wrap;}
  .bubble.system-hint{align-self:center; background:var(--lane-c-soft); color:#7A5A16; font-size:12.5px; text-align:center;}
  .coach-foot{padding:14px 16px; border-top:1px solid var(--line); display:flex; gap:8px;}
  .coach-foot textarea{flex:1; resize:none; min-height:42px; max-height:100px; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13.5px;}
  .typing-dots span{display:inline-block; width:5px; height:5px; border-radius:50%; background:#9B8F6E; margin-right:3px; animation:blink 1.1s infinite ease-in-out;}
  .typing-dots span:nth-child(2){animation-delay:.15s;} .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  /* ---------- Sticky notes ---------- */
  /* z-index budget: stack/trash sit at 45 (above the dormant coach tab's 40, below
     the coach drawer's 50 and the full-screen player-preview modal's 500 — see
     CLAUDE.md's note about not colliding with the AI coach overlay if it's ever
     turned back on). Individual notes use noteZCounter (starts at 40) for stacking
     order among themselves; the trash icon sits above all of it at 9999 so it's
     never accidentally buried under a pile of notes. */
  /* The dock sits mostly off-screen (sliver peeking at the right edge) and slides
     fully into view on hover — see the note pile UX note below. */
  .note-dock{
    position:fixed; right:max(6px, env(safe-area-inset-right)); top:130px; width:96px; height:96px; z-index:45;
    transform:translateY(-50%) translateX(calc(100% - 30px));
    transition:transform .18s ease;
  }
  .note-dock:hover, .note-dock:focus-within{transform:translateY(-50%) translateX(0);}
  .note-stack{
    position:absolute; inset:0;
  }
  .note-stack-sheet{
    position:absolute; inset:0; border-radius:6px; background:#F5E6A8; box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  .note-stack-sheet:nth-child(1){transform:rotate(-6deg) translate(-4px,3px);}
  .note-stack-sheet:nth-child(2){transform:rotate(4deg) translate(3px,-2px);}
  .note-stack-top{
    transform:rotate(-2deg); cursor:grab; display:flex; align-items:center; justify-content:center;
    font-size:26px; color:rgba(0,0,0,.35); user-select:none; touch-action:none;
  }
  .note-stack-top:active{cursor:grabbing;}
  .note-stack-hint{
    position:absolute; top:108px; left:-7px; width:110px; text-align:center;
    font-size:11px; color:#C7D2DD; pointer-events:none;
    opacity:0; transition:opacity .15s;
  }
  .note-dock:hover .note-stack-hint, .note-dock:focus-within .note-stack-hint{opacity:1;}
  /* Without hover the dock would sit 70% off-screen forever and the whole notes
     feature would be invisible on a tablet. Show it outright on coarse pointers. */
  @media (pointer:coarse){
    .note-dock{transform:translateY(-50%) translateX(0); width:72px; height:72px;}
    .note-stack-hint{opacity:1;}
  }
  .note-trash{
    position:fixed; right:calc(132px + env(safe-area-inset-right, 0px)); top:130px;
    transform:translateY(-50%) scale(.8); width:52px; height:52px;
    border-radius:50%; background:#3a2a1a; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
    font-size:22px; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; z-index:9999;
  }
  .note-trash.visible{opacity:1; pointer-events:auto; transform:translateY(-50%) scale(1);}
  @media (pointer:coarse){
    /* Matches the shrunk .note-dock above: keeps roughly the same visual gap between
       dock and trash while the whole cluster hugs the edge more tightly. */
    .note-trash{right:calc(96px + env(safe-area-inset-right, 0px));}
  }
  @media (max-width:480px){
    /* Keep in sync with syncStickySize() — the drag/clamp maths reads those constants. */
    .sticky-note{width:140px; min-height:140px;}
  }
  .sticky-note{
    position:fixed; width:170px; min-height:170px; border-radius:4px; background:#F5E6A8;
    box-shadow:0 6px 16px rgba(0,0,0,.3); padding:34px 8px 8px; display:flex; flex-direction:column; gap:6px;
  }
  .sticky-note.note-pink{background:#F5C6D6;} .sticky-note.note-blue{background:#C6DCF5;}
  .sticky-note.note-green{background:#C9E8CE;} .sticky-note.note-purple{background:#DAC6F0;}
  .sticky-note.selected{outline:2px solid #fff; outline-offset:-2px;}
  .sticky-note.over-trash{opacity:.45;}
  .sticky-drag-handle{
    position:absolute; top:0; left:0; right:0; height:30px; background:rgba(0,0,0,.08); border-radius:4px 4px 0 0;
    cursor:grab; display:flex; justify-content:space-between; align-items:center; padding:0 6px; color:rgba(0,0,0,.35);
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .sticky-drag-handle:active{cursor:grabbing;}
  .note-colors{
    position:absolute; top:-14px; left:8px; display:flex; gap:4px; opacity:0; pointer-events:none; transition:opacity .12s;
  }
  .sticky-note:hover .note-colors{opacity:1; pointer-events:auto;}
  .note-color-dot{width:13px; height:13px; border-radius:50%; border:1.5px solid rgba(0,0,0,.15); padding:0; cursor:pointer;}
  .note-color-dot.selected{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--ink);}
  .note-color-yellow, .note-color-dot.note-color-yellow{background:#F5E6A8;}
  .note-color-pink, .note-color-dot.note-color-pink{background:#F5C6D6;}
  .note-color-blue, .note-color-dot.note-color-blue{background:#C6DCF5;}
  .note-color-green, .note-color-dot.note-color-green{background:#C9E8CE;}
  .note-color-purple, .note-color-dot.note-color-purple{background:#DAC6F0;}
  .note-delete{background:none; border:none; font-size:13px; color:rgba(0,0,0,.4); cursor:pointer; line-height:1;}
  .note-delete:hover{color:rgba(0,0,0,.7);}
  .sticky-note textarea{
    flex:1; width:100%; resize:none; overflow-y:auto; border:none; background:transparent;
    font-size:13px; font-family:inherit; color:#3c3527;
  }

  /* ---------- Coach editor's notes (student-facing) ----------
     Deliberately not a sticky note: an arrow-shaped callout pointing back at the field
     it's about, red/coral so it reads as "an adult marked this up" rather than the
     student's own yellow/pink/blue/green/purple stickies. Draggable, but no delete and
     no recolor — only a coach clears it, from the review page. */
  .editor-note{
    position:fixed; width:200px; background:#FCEBE7; border:1.5px solid #E3A99D;
    border-radius:10px; box-shadow:var(--shadow-sm); padding:10px 26px 10px 14px;
  }
  .editor-note::before{
    content:''; position:absolute; left:-9px; top:16px; width:0; height:0;
    border-top:8px solid transparent; border-bottom:8px solid transparent; border-right:9px solid #E3A99D;
  }
  .editor-note::after{
    content:''; position:absolute; left:-7px; top:16px; width:0; height:0;
    border-top:7px solid transparent; border-bottom:7px solid transparent; border-right:8px solid #FCEBE7;
  }
  .editor-note-drag{position:absolute; top:6px; right:6px; color:#C98A7B; cursor:grab; padding:2px;}
  .editor-note-drag:active{cursor:grabbing;}
  .editor-note-text{font-size:12.5px; line-height:1.5; color:#7A342A; white-space:pre-wrap; word-break:break-word;}
  .editor-note-byline{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:#B9807A; margin-top:6px;}

  /* ---------- Coach inbox ---------- */
  .inbox-filter-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:rgba(255,255,255,.06);
    border-radius:12px; padding:10px 14px; margin-bottom:22px;
  }
  .inbox-filter-bar input[type="text"]{
    flex:1; min-width:200px; padding:9px 12px; border-radius:8px; border:1.5px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.94); color:var(--ink); font-family:inherit; font-size:13.5px;
  }
  .inbox-filter-bar input[type="date"]{
    padding:8px 10px; border-radius:8px; border:1.5px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.94); color:var(--ink); font-family:inherit; font-size:13px;
  }
  .inbox-filter-date-label{display:flex; align-items:center; gap:8px; color:#C7D2DD; font-size:12.5px; font-weight:600;}
  .inbox-filter-sep{color:#7C8CA0;}
  .inbox-stage-filter{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:-10px 0 22px; padding:0 2px;
  }
  .inbox-stage-filter-label{color:#7C8CA0; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .inbox-stage-chip{
    display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px;
    border:1.5px solid rgba(255,255,255,.16); background:rgba(255,255,255,.04);
    color:#8A96A6; font-size:12.5px; cursor:pointer; user-select:none;
  }
  .inbox-stage-chip.checked{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); color:#fff;}
  .inbox-stage-chip input{margin:0;}
  .inbox-group{margin-bottom:26px;}
  .inbox-group:last-child{margin-bottom:0;}
  .inbox-section-divider{border-top:1px solid rgba(255,255,255,.14); margin:28px 0 24px;}
  .inbox-group-head{
    color:#fff; font-size:14px; margin-bottom:10px; opacity:.75; cursor:pointer;
    display:flex; align-items:center; gap:7px; user-select:none;
  }
  .inbox-group-head:hover{opacity:1;}
  .inbox-group-arrow{display:inline-flex; align-items:center; color:#fff; transition:transform .15s ease;}
  .inbox-group-arrow.collapsed{transform:rotate(-90deg);}
  .inbox-row{
    background:var(--paper); border-radius:12px; padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow-sm); margin-bottom:10px; cursor:pointer; border-left:5px solid var(--lane-b);
  }
  .inbox-row:hover{transform:translateY(-1px);}
  .inbox-row .ir-left h4{font-size:15px; margin-bottom:3px;}
  .inbox-row .ir-left p{font-size:12.5px; color:var(--ink-soft); font-family:var(--font-mono);}
  .inbox-row.flagged-row{border-left:5px solid #C0392B; background:#FBEAE8;}
  .empty-state{color:#C7D2DD; text-align:center; padding:50px 20px; font-size:14.5px;}
  .banner{
    background:var(--lane-c-soft); border:1.5px solid var(--lane-c-line); color:#7A5A16; padding:12px 16px; border-radius:10px;
    font-size:13.5px; margin-bottom:18px; display:flex; align-items:center; gap:8px;
  }
  .banner[hidden]{display:none;} /* .banner's own display:flex above would otherwise beat the bare [hidden] attribute */
  .guardrail-box{background:rgba(255,255,255,.06); border-radius:10px; padding:14px 16px; margin-top:14px;}
  .guardrail-box summary{color:#fff; font-size:13px; font-weight:600; cursor:pointer;}
  .guardrail-box ul{margin:10px 0 0; padding-left:18px; color:#C7D2DD; font-size:12.5px; line-height:1.7;}

  /* ============ Icon search strip (Noun Project results, inline under an option) ============ */
  .icon-search-strip{
    position:relative; background:#F8F8F6; border:1.5px solid var(--line); border-radius:10px;
    padding:10px 28px 10px 10px; margin-top:-2px;
  }
  .icon-search-dismiss{
    position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:50%; padding:0;
    background:#fff; border:1.5px solid var(--line); color:var(--ink-soft); font-size:10px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-search-dismiss:hover{color:var(--ink); border-color:var(--ink-soft);}
  .icon-search-status{color:var(--ink-soft); font-size:12.5px; text-align:center; padding:4px 0;}
  .icon-search-error{color:#9B3B34;}
  .icon-search-results{display:flex; flex-wrap:wrap; gap:8px;}
  .icon-search-result{
    width:44px; height:44px; flex-shrink:0; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; padding:6px; cursor:pointer;
  }
  .icon-search-result:hover{border-color:var(--ink-soft);}
  .icon-search-result.selected{border-color:var(--ink); background:#EDECE7;}
  .icon-search-result img{width:100%; height:100%; object-fit:contain;}

  /* ============ Player Preview (mimics the real Discussion Session screen) ============ */
  .pp-screen{
    position:fixed; inset:0; z-index:500;
    display:flex; flex-direction:column; align-items:center;
    padding:max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
            calc(34px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left));
    background:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,.9) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 15%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 55%, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 75%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 68%, rgba(255,255,255,.9) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 45% 30%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 90%, rgba(255,255,255,.6) 50%, transparent 51%),

<script>
  // Bridges the app's window.storage.get/set/list calls (used throughout the IIFE
  // below) to /api/storage, a small serverless shim over a Redis database — see
  // api/storage.js. Must run before the main script, since that script checks
  // `typeof window.storage` once at load time.
  window.storage = (function(){
    // The coach token, not the coach password, is what lives in the browser — and in
    // sessionStorage rather than localStorage, so closing the tab signs you out. That
    // matters because the password is shared: a token leak is one tab for a few hours,
    // whereas a leaked password would have to be re-issued to every coach.
    var TOKEN_HEADER = 'x-coach-token';
    var TOKEN_STORE_KEY = 'coachToken';
    var token = null;
    try { token = sessionStorage.getItem(TOKEN_STORE_KEY); } catch(e){ token = null; }

    // The student token arrives in the link itself (?s=...). It goes to localStorage
    // rather than sessionStorage because an 8-to-14-year-old should not have to dig the
    // email out again every time they close the tab — a deliberately different trade-off
    // from the coach token, which is a shared password and expires with the tab.
    var STUDENT_HEADER = 'x-student-token';
    var STUDENT_STORE_KEY = 'studentToken';
    var studentToken = null;
    try {
      var fromUrl = /[?&]s=([^&#]+)/.exec(window.location.search);
      // A freshly opened link always wins over whatever this browser remembered, so
      // handing a kid a new link is enough to switch them over.
      if(fromUrl) studentToken = decodeURIComponent(fromUrl[1]);
    } catch(e){ studentToken = null; }
    if(!studentToken){
      try { studentToken = localStorage.getItem(STUDENT_STORE_KEY); } catch(e){ studentToken = null; }
    }

    function setStudentToken(t){
      studentToken = t || null;
      try {
        if(studentToken) localStorage.setItem(STUDENT_STORE_KEY, studentToken);
        else localStorage.removeItem(STUDENT_STORE_KEY);
      } catch(e){ /* private mode: token stays in memory for this tab only */ }
    }
    if(studentToken) setStudentToken(studentToken);

    // Display only — the server re-verifies the signature on every single request,
    // so nothing here is trusted for access decisions.
    function studentUsername(){
      if(!studentToken) return '';
      var b = String(studentToken).split('.')[0].replace(/-/g,'+').replace(/_/g,'/');
      while(b.length % 4) b += '=';
      try { return atob(b); } catch(e){ return ''; }
    }

    function setToken(t){
      token = t || null;
      try {
        if(token) sessionStorage.setItem(TOKEN_STORE_KEY, token);
        else sessionStorage.removeItem(TOKEN_STORE_KEY);
      } catch(e){ /* private mode / storage disabled: token stays in memory only */ }
    }

    function call(body){
      var headers = {'Content-Type': 'application/json'};
      if(token) headers[TOKEN_HEADER] = token;
      if(studentToken) headers[STUDENT_HEADER] = studentToken;
      var payload = JSON.stringify(body);
      var opts = {method: 'POST', headers: headers, body: payload};
      // keepalive is what lets a save fired during pagehide survive the unload, but the
      // spec caps keepalive bodies at 64KB and browsers reject anything larger outright
      // — so only opt in when comfortably under, and let big saves take their chances.
      if(payload.length < 60000) opts.keepalive = true;
      return fetch('/api/storage', opts).then(function(res){
        if(!res.ok){
          return res.json().catch(function(){ return {}; }).then(function(err){
            var e = new Error(err.error || ('Storage request failed: '+res.status));
            // Flagged so callers can bounce to the sign-in screen rather than showing
            // a generic "storage is down" banner for what is really an expired token.
            // Two different expired credentials reach here; clearing the wrong one
            // would sign a coach out of a student problem and vice versa.
            if(res.status===401){
              if(err.reason==='student'){ setStudentToken(null); e.studentAuthRequired = true; }
              else { setToken(null); e.authRequired = true; }
            }
            throw e;
          });
        }
        return res.json();
      });
    }

    return {
      get: function(key){ return call({op:'get', key:key}); },
      set: function(key, value){ return call({op:'set', key:key, value:value}); },
      delete: function(key){ return call({op:'delete', key:key}); },
      list: function(prefix){ return call({op:'list', key:prefix}); },
      listByUser: function(prefix, username){ return call({op:'listByUser', key:prefix, username:username}); },
      coachLogin: function(password){
        return call({op:'coachLogin', password:password}).then(function(r){
          setToken(r && r.token);
          return r;
        });
      },
      hasCoachToken: function(){ return !!token; },
      coachSignOut: function(){ setToken(null); },
      hasStudentToken: function(){ return !!studentToken; },
      studentUsername: studentUsername,
      studentSignOut: function(){ setStudentToken(null); }
    };
  })();
</script>

// Backoff schedule for retrying a save the server rejected. Without a retry, a failed

// successful write. Budget resets on every fresh edit (see debounceSave).
var SAVE_RETRY_DELAYS = [2000, 5000, 15000];

/* ============================= UTIL ============================= */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
var STICKY_W = 170, STICKY_H = 170, HANDLE_H = 30; // keep in sync with .sticky-drag-handle's height
// Mirrors the .sticky-note @media rule above. Every drag/clamp calculation reads these,
// so if the CSS size changes and these don't, notes clamp to the wrong bounds.
function syncStickySize(){
  var small = window.innerWidth <= 480;
  STICKY_W = STICKY_H = small ? 140 : 170;
}
syncStickySize();
function genCode(){
  var alpha = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var s = '';
  for(var i=0;i<5;i++){ s += alpha[Math.floor(Math.random()*alpha.length)]; }
  return s;
}
function wordCount(t){ t=(t||'').trim(); return t? t.split(/\s+/).length : 0; }
var isDirty = false;
function debounceSave(){
  if(state.draft && state.draft.isExample) return;
  isDirty = true;
  setSaveIndicator('unsaved');
  // Fresh edit: cancel any pending retry (it would carry a stale snapshot) and hand
  // the new save a full retry budget.
  if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
  saveRetryAttempt = 0;
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 600);
}
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
  if(state.draft && isDirty) saveDraft();
  if(notesSaveTimer){ clearTimeout(notesSaveTimer); notesSaveTimer = null; }
  if(state.draft && notesDirty) saveNotes();
}
function downloadText(filename, text){
  var blob = new Blob([text], {type:'text/markdown'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function timeAgo(ts){
  if(!ts) return '';
  var s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function newOption(colorIndex){ return {id:uid(), label:'', rationale:'', iconDescription:'', selectedIcon:null, colorIndex: colorIndex||0}; }
function newScenario(){
  var opts = [];
  var n = (state.draft && state.draft.optionCount) || 3;
  for(var i=0;i<n;i++) opts.push(newOption(i));
  return {
    id:uid(), title:'', domain:'', setup:'',
    options: opts,
    challenge:['',''],
    reflection:''
  };
}
function newDraft(name){
  var d = {
    id: genCode(),
    studentName: name || 'Student',
    createdAt: Date.now(), updatedAt: Date.now(),
    status: 'draft', submittedAt: null,
    title:'', bigIdea:'',
    optionCount: 3,
    scenarios: [],
    halftime:{question:'', options:['',''], reflection:''},
    reflection:{question:'', options:['',''], reflection:''},
    aiChat: [],
    coachNotes: [],
    editorNotes: [],
    coachMessage: ''
  };
  for(var i=0;i<6;i++) d.scenarios.push(newScenario.call(null));
  // rebuild scenarios now that optionCount is set on d (newScenario reads state.draft, so patch directly)
  d.scenarios = d.scenarios.map(function(){
    var opts=[]; for(var i=0;i<d.optionCount;i++) opts.push(newOption(i));
    return {id:uid(), title:'', domain:'', setup:'', options:opts, challenge:['',''], reflection:''};
  });
  return d;
}

// Key grammar: 'title' | 'bigIdea' | 'sc:<scenarioId>:title|setup|challenge' |

  if(key==='title' || key==='bigIdea') return {kind:'setup', sub:key};
  if(key.indexOf('halftime:')===0) return {kind:'halftime', sub:key.slice(9)};
  if(key.indexOf('reflection:')===0) return {kind:'reflection', sub:key.slice(11)};
  if(key.indexOf('sc:')===0){

  if(p.kind==='halftime') return {screen:'halftimeEditor'};
  if(p.kind==='reflection') return {screen:'reflection'};
  if(p.kind==='scenario' || p.kind==='scenarioOption'){

var saveStatus = 'saved'; // 'saved' | 'unsaved' | 'saving' | 'failed' | 'failedfinal' | 'toobig'

function saveDraft(){
  if(!hasStorage || !state.draft) return;

  // Any armed retry is stale the moment we send newer content.
  if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
  var draftId = state.draft.id;
  var payload = JSON.stringify(state.draft);
  if(payload.length > MAX_DRAFT_BYTES){
    isDirty = true;
    setSaveIndicator('toobig');
    return;
  }
  isDirty = false;
  state.draft.updatedAt = Date.now();
  setSaveIndicator('saving');
  window.storage.set('draft:'+draftId, payload, true).then(function(){
    saveRetryAttempt = 0;
    // isDirty flips back to true if the user typed while this was in flight — saying
    // "Saved" then would be a lie about content the server hasn't seen.
    setSaveIndicator(isDirty ? 'unsaved' : 'saved');
  }).catch(function(e){
    if(e && e.studentAuthRequired){ studentLinkExpired(); return; }
    console.error('save failed', e);

function scheduleSaveRetry(draftId){

  saveRetryTimer = setTimeout(function(){
    saveRetryTimer = null;
    // The draft may have been closed or swapped out while we waited.
    if(state.draft && state.draft.id === draftId && isDirty) saveDraft();

}

// Resume-by-username. The server does the matching and returns only this student's

  if(!accepted.length) return;
  Promise.all(accepted.map(function(d){
    return loadPending(d.id).then(function(p){ resumeStageById[d.id] = p ? p.status : null; }).catch(function(){ resumeStageById[d.id] = null; });
  })).then(function(){ render(); });
}
// With links on, identity comes from the token, so the drafts list can just load
// itself whenever the student lands on the home screen — no username to type, and
// nothing to press.
function refreshMyDrafts(){
  if(!window.storage.hasStudentToken()) return;
  if(!hasStorage){ state.homeError='Saving isn\'t available in this preview, so sessions can\'t be resumed.'; render(); return; }
  state.resumeLoading = true; state.homeError = ''; render();
  resumeStageById = {};
  listDraftsForUser(window.storage.studentUsername()).then(function(matches){
    state.resumeLoading = false; state.resumeMatches = matches; render();
    enrichMatchesWithStage(matches);
  }).catch(function(e){
    state.resumeLoading = false;
    if(e && e.studentAuthRequired){ studentLinkExpired(); return; }
    console.error('draft lookup failed', e);
    state.homeError = 'Couldn\'t reach storage to look up your sessions. Your work is safe — try again in a moment.';
    state.resumeMatches = []; render();
  });
}

// Fixed ids (not host genCode() output) so re-checking "does this already exist" is
// idempotent across reloads/coaches, instead of reseeding a fresh copy every time.
var EXAMPLE_INBOX_IDS = {heartMindGut: 'EXAMPLE-HMG', askOrGuess: 'EXAMPLE-AOG'};
// One "Ask or Guess?" draft frozen at each of the other stages, so the coach inbox always
// has a worked example of the whole pipeline rather than only ever showing "Ready for
// review" — see buildPipelineExampleDraft. EXAMPLE-AOG itself already covers submitted.
var EXAMPLE_PIPELINE_IDS = {revision:'EXAMPLE-AOG-REV', pending:'EXAMPLE-AOG-PEND', ready:'EXAMPLE-AOG-READY', shipped:'EXAMPLE-AOG-SHIP'};
function isSeededExampleId(id){
  return id==='EXAMPLE-HMG' || id==='EXAMPLE-AOG' ||
    id===EXAMPLE_PIPELINE_IDS.revision || id===EXAMPLE_PIPELINE_IDS.pending ||
    id===EXAMPLE_PIPELINE_IDS.ready || id===EXAMPLE_PIPELINE_IDS.shipped;
}
var PIPELINE_STAGE_LABELS = {revision:'needs revision', pending:'pending polish', ready:'ready for code', shipped:'shipped'};
// Builds one pipeline-stage demo from the same "Ask or Guess?" content as EXAMPLE-AOG.
// 'revision' stops at a draft: record with a coach note and one inline editor's note
// (on scenario 0's second option — see the deterministic ids buildExampleDraft now
// uses, without which this note would point at a scenario id that stops existing on
// the next reseed). 'pending', 'ready', and 'shipped' mirror what
// acceptDraft/newPendingFromDraft/markPendingReady/markSentToCode actually produce: a
// frozen, accepted draft plus its own pending:<id> record, the parent blurb filled in,
// and — once 'ready' or past it — usage weeks and a ship date once truly shipped.
function buildPipelineExampleDraft(stage){
  var d = buildExampleDraft('askOrGuess');
  d.id = EXAMPLE_PIPELINE_IDS[stage];
  d.studentName = 'Example ('+PIPELINE_STAGE_LABELS[stage]+')';
  d.submittedAt = Date.now();

  if(stage==='revision'){
    d.status = 'revision';
    d.coachNotes = [{
      text: 'Loved most of these! A couple of the options could use a small rebalance — see the inline note on the first scenario. Take a look and resubmit whenever you\'re ready.',
      at: Date.now()
    }];
    d.editorNotes = [newEditorNote(
      'sc:askOrGuess-sc0:opt:askOrGuess-sc0-opt1:rationale',
      'This reads a little like giving up compared to "Ask directly" — can we give it its own confident, deliberate reason instead of leaning on "not worth the risk"?'
    )];
    return {draft:d, pending:null};
  }

  // 'pending', 'ready', and 'shipped' all start from an accepted draft.
  d.status = 'accepted';
  d.acceptedAt = Date.now();
  d.coachNotes = [{text:'Really strong set — accepting as-is. Polishing the parent-facing copy now.', at:Date.now()}];
  var p = newPendingFromDraft(d);
  p.parentBlurb = 'This week, your kid is exploring the tug-of-war between asking directly for '+
    'what you need and hoping someone notices without being told — through six everyday '+
    'moments, from a missed birthday invite to a teammate who\'s gone quiet on a call. '+MANTRA;
  if(stage==='ready' || stage==='shipped'){
    p.status = 'ready';
    p.readyAt = Date.now() - (1000*60*60*24*7); // a week ago
  }
  if(stage==='shipped'){
    p.status = 'shipped';
    p.sentToCodeAt = Date.now() - (1000*60*60*24*30); // 30 days ago, so it doesn't read as "just shipped"
    p.usageWeeks = ['2026-03-02', '2026-06-15'];
  }
  return {draft:d, pending:p};
}
// Same idempotent-seed-then-preserve-coach-edits shape as the main two examples below,
// just also covering the paired pending:<id> record for the 'pending'/'shipped' stages.
function seedPipelineExample(stage){
  var id = EXAMPLE_PIPELINE_IDS[stage];
  return window.storage.get('draft:'+id, true).then(function(existingDraft){
    var built = buildPipelineExampleDraft(stage);
    var freshDraft = built.draft, freshPending = built.pending;
    if(!existingDraft){
      var writes = [window.storage.set('draft:'+id, JSON.stringify(freshDraft), true)];
      if(freshPending) writes.push(window.storage.set('pending:'+id, JSON.stringify(freshPending), true));
      return Promise.all(writes);
    }
    var old;
    try { old = JSON.parse(existingDraft.value); } catch(e){ old = null; }
    if(!old) old = freshDraft;
    var mergedDraft = Object.assign({}, freshDraft, {
      status: old.status || freshDraft.status,
      acceptedAt: old.acceptedAt || freshDraft.acceptedAt,
      submittedAt: old.submittedAt || freshDraft.submittedAt,
      coachNotes: old.coachNotes || freshDraft.coachNotes,
      editorNotes: old.editorNotes || freshDraft.editorNotes,
      createdAt: old.createdAt || freshDraft.createdAt,
      updatedAt: old.updatedAt || freshDraft.updatedAt
    });
    var writes2 = [window.storage.set('draft:'+id, JSON.stringify(mergedDraft), true)];
    if(freshPending){
      writes2.push(window.storage.get('pending:'+id, true).then(function(existingPending){
        if(!existingPending) return window.storage.set('pending:'+id, JSON.stringify(freshPending), true);
        var oldP;
        try { oldP = JSON.parse(existingPending.value); } catch(e){ oldP = null; }
        if(!oldP) return window.storage.set('pending:'+id, JSON.stringify(freshPending), true);
        var mergedPending = Object.assign({}, freshPending, {
          status: oldP.status || freshPending.status,
          parentBlurb: oldP.parentBlurb || freshPending.parentBlurb,
          usageWeeks: oldP.usageWeeks || freshPending.usageWeeks,
          submittedAt: oldP.submittedAt || freshPending.submittedAt,
          readyAt: oldP.readyAt || freshPending.readyAt,
          sentToCodeAt: oldP.sentToCodeAt || freshPending.sentToCodeAt,
          createdAt: oldP.createdAt || freshPending.createdAt,
          updatedAt: oldP.updatedAt || freshPending.updatedAt
        });
        return window.storage.set('pending:'+id, JSON.stringify(mergedPending), true);
      }));
    }
    return Promise.all(writes2);
  }).catch(function(){});
}
// Makes sure the two example sessions exist as real, persisted drafts so they show up
// in the coach inbox like any submitted draft — reviewable, notable, markable. Only
// writes a key the first time it's missing; never overwrites a coach's own edits/notes
// on a previously-seeded copy.
function ensureExampleDraftsSeeded(){
  if(!hasStorage) return Promise.resolve();
  var keys = Object.keys(EXAMPLE_INBOX_IDS);
  return Promise.all(keys.map(function(key){
    var id = EXAMPLE_INBOX_IDS[key];
    return window.storage.get('draft:'+id, true).then(function(existing){
      var fresh = buildExampleDraft(key);
      fresh.id = id;
      if(!existing){
        fresh.status = 'submitted';
        fresh.submittedAt = Date.now();
        return window.storage.set('draft:'+id, JSON.stringify(fresh), true);
      }
      // Already seeded before. Re-sync the content on every load — title, scenarios,
      // selected icons, whatever EXAMPLE_SESSIONS says right now — so an edit to it
      // (like giving every option a real icon) reaches an already-seeded copy instead
      // of sitting invisible in Redis forever, which is exactly what happened here:
      // this draft was seeded once, then EXAMPLE_SESSIONS changed and this frozen
      // copy never heard about it. Coach-specific fields carry over untouched, and
      // updatedAt is pinned to the old value so this refresh never bumps the demo to
      // the top of "most recently updated."
      var old;
      try { old = JSON.parse(existing.value); } catch(e){ old = null; }
      if(!old) return window.storage.set('draft:'+id, JSON.stringify(fresh), true);
      var merged = Object.assign({}, fresh, {
        status: old.status || 'submitted',
        submittedAt: old.submittedAt || Date.now(),
        coachNotes: old.coachNotes || [],
        editorNotes: old.editorNotes || [],
        coachMessage: old.coachMessage || '',
        createdAt: old.createdAt || fresh.createdAt,
        updatedAt: old.updatedAt || fresh.updatedAt
      });
      return window.storage.set('draft:'+id, JSON.stringify(merged), true);
    }).catch(function(){});
  }).concat(Object.keys(EXAMPLE_PIPELINE_IDS).map(seedPipelineExample)));
}

/* ---------- Moderation (per-username, applies across every draft that username builds) ---------- */
function normalizeUsername(u){ return (u||'').trim().toLowerCase(); }
function newModerationRecord(username){
  return {
    username: normalizeUsername(username),
    displayUsername: (username||'').trim(),
    redirectCount: 0,
    locked: false,
    lockReason: '',        // 'severe' | 'repeated'
    lockedAt: null,
    lockSourceDraftId: '',
    lockMessageExcerpt: '',
    incidents: [],         // [{at, severity:'mild'|'severe', excerpt, draftId}]
    unlocked: false,
    unlockedAt: null,
    coachNote: '',
    studentAppeal: '',
    studentAppealAt: null,
    updatedAt: Date.now()
  };
}
function patchModeration(m){
  if(!Array.isArray(m.incidents)) m.incidents = [];
  if(typeof m.redirectCount !== 'number') m.redirectCount = 0;
  return m;
}
function saveModeration(m){
  if(!hasStorage || !m) return;
  m.updatedAt = Date.now();
  window.storage.set('moduser:'+m.username, JSON.stringify(m), true).catch(function(e){
    console.error('moderation save failed', e);
  });
}
function loadModeration(username){
  if(!hasStorage) return Promise.resolve(newModerationRecord(username));
  return window.storage.get('moduser:'+normalizeUsername(username), true)
    .then(function(r){ return r ? patchModeration(JSON.parse(r.value)) : newModerationRecord(username); })
    .catch(function(){ return newModerationRecord(username); });
}
function listModerationRecords(){
  if(!hasStorage) return Promise.resolve([]);
  return window.storage.list('moduser:', true).then(function(r){
    var keys = (r && r.keys) || [];
    return Promise.all(keys.map(function(k){
      return window.storage.get(k, true).then(function(res){
        try{ return patchModeration(JSON.parse(res.value)); }catch(e){ return null; }
      });
    }));
  }).then(function(list){
    return list.filter(Boolean).sort(function(a,b){ return (b.lockedAt||0)-(a.lockedAt||0); });
  });
}

/* ---------- Notes storage: shared=false, so this is genuinely private — never fetchable by a coach's session ---------- */
function notesKey(draftId){ return 'notes:'+draftId; }
function loadNotes(draftId){
  if(!hasStorage) return Promise.resolve([]);
  // An example's id is minted fresh on every open, so there is never anything stored.
  if(state.draft && state.draft.isExample && state.draft.id===draftId) return Promise.resolve([]);
  return window.storage.get(notesKey(draftId), false).then(function(r){
    if(!r) return [];
    try{ var arr = JSON.parse(r.value); return Array.isArray(arr) ? arr : []; }catch(e){ return []; }
  }).catch(function(){ return []; });
}
var notesDirty = false, notesSaveTimer = null;
function debounceSaveNotes(){
  if(state.draft && state.draft.isExample) return;
  notesDirty = true;
  if(notesSaveTimer) clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(saveNotes, 600);
}
function saveNotes(){
  if(!hasStorage || !state.draft) return;
  if(state.draft.isExample) return;
  notesDirty = false;
  window.storage.set(notesKey(state.draft.id), JSON.stringify(state.notes), false).catch(function(e){
    console.error('notes save failed', e);
    notesDirty = true;
  });
}

  else if(state.screen==='inbox') html = renderShellInbox();

  else if(state.screen==='pendingDraft') html = renderPendingScreen();
  else if(state.screen==='playerPreview') html = renderPlayerPreview();
  else if(state.screen==='feedback') html = renderFeedback();
  else html = renderShellDraft();
  app.innerHTML = html;
  attachGlobalHandlers();
  if(state.screen!=='home' && state.screen!=='coachLogin' && state.screen!=='inbox' && state.screen!=='inboxDraft' && state.screen!=='inboxFlagged' && state.screen!=='inboxFeedback' && state.screen!=='pendingDraft' && state.screen!=='playerPreview' && state.screen!=='feedback' && state.draft){
    if(AI_ASSISTANT_ENABLED) renderCoachOverlay();
    renderStickyLayer();
    renderEditorNoteLayer();
    // Accepted drafts are frozen — see isDraftLocked/acceptDraft. Disabling every form
    // field at the DOM level (rather than threading a "locked" flag through every
    // render*() template) is the belt-and-suspenders half of the lock; updateDraftField
    // refusing to write is the other half.
    if(isDraftLocked(state.draft)){
      app.querySelectorAll('input, textarea, select').forEach(function(el){ el.disabled = true; });
    }
  }
}

// Bounce back to sign-in rather than showing a generic storage error, which is what
// an expired or rejected token would otherwise look like.
function requireCoachSignIn(msg){
  window.storage.coachSignOut();
  state.screen='coachLogin';
  state.coachAuthError = msg || '';
  state.coachAuthBusy = false;
  state.inboxList=[]; state.flaggedList=[]; state.inboxLoading=false;
  render();
}
// 'reviewed' was retired once "Mark reviewed" became "Accepted" — any draft still
// carrying it is a leftover from before this pipeline existed. Fold it in for real:
// flip it to 'accepted' and give it a pending:<id> record, exactly like acceptDraft
// would, rather than leaving it stuck in a status nothing shows any more. Idempotent —
// a draft only ever does this once, since its status stops being 'reviewed' afterward.
function migrateReviewedDrafts(draftList){
  var reviewedOnes = draftList.filter(function(d){ return d.status==='reviewed'; });
  if(!reviewedOnes.length) return Promise.resolve();
  return Promise.all(reviewedOnes.map(function(d){
    return window.storage.get('pending:'+d.id, true).then(function(existingPending){
      d.status = 'accepted';
      if(!d.acceptedAt) d.acceptedAt = d.updatedAt || Date.now();
      d.updatedAt = Date.now();
      var writes = [window.storage.set('draft:'+d.id, JSON.stringify(d), true)];
      if(!existingPending) writes.push(window.storage.set('pending:'+d.id, JSON.stringify(newPendingFromDraft(d)), true));
      return Promise.all(writes);
    }).catch(function(e){ console.error('reviewed->pending migration failed for', d.id, e); });
  }));
}
function loadInbox(){
  state.inboxError=''; state.inboxLoading=true;
  ensureExampleDraftsSeeded().then(function(){
    return listAllDrafts();
  }).then(function(list){
    return migrateReviewedDrafts(list).then(function(){
      // Re-fetch both lists post-migration, rather than patch the in-memory ones, so the
      // newly-created pending records (and the drafts' flipped status) show up together.
      return Promise.all([listAllDrafts(), listAllPending()]);
    });
  }).then(function(results){
    state.inboxList = results[0];
    state.pendingList = results[1];
    state.inboxLoading = false;
    render();
  }).catch(function(e){
    console.error('inbox load failed', e);
    state.inboxLoading=false;
    if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
    state.inboxError='Couldn\'t reach storage, so drafts can\'t be listed right now. Nothing has been lost — reload to try again.';
    state.inboxList=[]; render();
  });
  // Same reasoning as enterDraft, but this one costs a full Redis SCAN of moduser:*
  // every time a coach opens the inbox — for a flagged-accounts list that is always
  // empty while the assistant is off.
  if(AI_ASSISTANT_ENABLED){
    listModerationRecords().then(function(list){
      state.flaggedList=list; render();
    }).catch(function(e){
      console.error('flagged accounts load failed', e);
      state.flaggedList=[]; render();
    });
  }
}

/* ---------- Feedback tool (beta test only — see FEEDBACK_ENABLED) ---------- */
function listAllFeedback(){
  if(!hasStorage) return Promise.resolve([]);
  return window.storage.list('feedback:').then(function(r){
    var keys = (r && r.keys) || [];
    return Promise.all(keys.map(function(k){
      return window.storage.get(k).then(function(res){
        try{ return JSON.parse(res.value); }catch(e){ return null; }
      });
    }));
  }).then(function(list){
    return list.filter(Boolean).sort(function(a,b){ return b.createdAt - a.createdAt; });
  });
}
function loadInboxFeedback(){
  state.inboxFeedbackError=''; state.inboxFeedbackLoading=true;
  listAllFeedback().then(function(list){
    state.inboxFeedbackList=list; state.inboxFeedbackLoading=false; render();
  }).catch(function(e){
    console.error('feedback load failed', e);
    state.inboxFeedbackLoading=false;
    if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
    state.inboxFeedbackError='Couldn\'t reach storage, so feedback can\'t be listed right now. Try again in a moment.';
    state.inboxFeedbackList=[]; render();
  });
}

/* ============================= SHELL (draft screens) ============================= */
var STEP_LIST = [
  {key:'setup', label:'Setup'},
  {key:'storyboard', label:'Storyboard & halftime'},
  {key:'reflection', label:'Closing reflection'},
  {key:'review', label:'Review & send'}
];
function scenarioComplete(sc){
  return sc.title.trim() && sc.setup.trim() && sc.options.every(function(o){return o.rationale.trim();});
}
function stepDone(key){
  var d = state.draft;
  if(key==='setup') return !!(d.title.trim() && d.bigIdea.trim());
  if(key==='storyboard') return d.scenarios.every(scenarioComplete) && !!(d.halftime.question.trim());
  if(key==='reflection') return !!(d.reflection.question.trim());
  return false;
}
// Reuses the same completeness checks the rail's "done" dots already use, so submit
// and the rail can never disagree about what "finished" means. Named per-scenario
// (not just "storyboard incomplete") so a writer isn't left guessing which of six
// scenarios still needs work.
function firstIncompleteSubmitReason(d){
  if(!stepDone('setup')) return 'Add a title and your overall idea on the Setup page before submitting.';
  for(var i=0;i<d.scenarios.length;i++){
    if(!scenarioComplete(d.scenarios[i])){
      var titleBit = d.scenarios[i].title.trim() ? ' ("'+d.scenarios[i].title.trim()+'")' : '';
      return 'Scenario '+(i+1)+titleBit+' still needs a title, setup, and a reason for every option before submitting.';
    }
  }
  if(!d.halftime.question.trim()) return 'Write the halftime question before submitting.';
  if(!d.reflection.question.trim()) return 'Write the closing reflection question before submitting.';
  return null;
}
function railHtml(){
  var d = state.draft;
  var rows = STEP_LIST.map(function(s){
    var active = state.screen===s.key;
    var cls = 'rail-step'+(active?' active':'')+(stepDone(s.key)?' done':'');
    var html = '<div class="'+cls+'" data-action="nav" data-target="'+s.key+'"><span class="dot"></span>'+esc(s.label)+'</div>';
    if(s.key==='storyboard'){
      var scRows = d.scenarios.map(function(sc,i){
        var a = state.screen==='scenario' && state.scenarioIndex===i;
        return '<div class="rail-step'+(a?' active':'')+(scenarioComplete(sc)?' done':'')+'" style="font-size:12.5px; padding:6px 10px;" data-action="openScenario" data-idx="'+i+'"><span class="dot"></span>'+(i+1)+'. '+esc(sc.title||'Untitled')+'</div>';
      });
      var halftimeRow = '<div class="rail-step'+(state.screen==='halftimeEditor'?' active':'')+(d.halftime.question.trim()?' done':'')+'" style="font-size:12.5px; padding:6px 10px;" data-action="openHalftime"><span class="dot"></span>🚩 Halftime</div>';
      scRows.splice(3, 0, halftimeRow);
      html += '<div class="rail-scenarios">'+scRows.join('')+'</div>';
    }
    return html;
  }).join('');
  // An example has no code to return to and never saves, so the rail must advertise
  // neither. setSaveIndicator() looks its element up by id and no-ops when absent, so
  // omitting the live indicator here needs no change there.
  return ''+
  '<div class="rail">'+
    (d.isExample? '' : '<div class="rail-code">CODE ' + esc(d.id) + '</div>')+
    '<div class="rail-name">'+(d.isExample? 'Example session' : esc(d.studentName)+'\'s session')+'</div>'+
    rows+
    '<div class="rail-spacer"></div>'+
    (d.isExample
      ? '<span class="rail-save-indicator">Not saved</span>'
      : '<span id="saveIndicator" class="rail-save-indicator '+saveStatus+'">'+saveStatusText(saveStatus)+'</span>')+
    '<div class="rail-bottom">'+
      '<button class="btn btn-ghost-light btn-small" data-action="goHome">'+(d.isExample? '← Back home' : '← Save &amp; exit')+'</button>'+
    '</div>'+
  '</div>';
}
function renderShellDraft(){
  var body = '';
  if(state.screen==='setup') body = renderSetup();
  else if(state.screen==='storyboard') body = renderStoryboard();
  else if(state.screen==='scenario') body = renderScenario();
  else if(state.screen==='halftimeEditor') body = renderHalftimeEditor();
  else if(state.screen==='reflection') body = renderReflection();
  else if(state.screen==='review') body = renderReview();
  var exampleBanner = state.draft.isExample
    ? '<div class="banner">👀 <span><strong>Example session</strong> — have a look around and try things out. Changes here aren\'t saved.</span></div>'
    : '';
  // One central spot for the locked-draft notice, so a student who navigates to Setup
  // or a scenario after acceptance (not just the Review page) still sees why everything
  // is greyed out — see isDraftLocked/render()'s disabled-field pass.
  var lockedBanner = (isDraftLocked(state.draft) && state.screen!=='review')
    ? '<div class="banner">🔒 <span>This session was accepted and is locked while your coach polishes it — see the Review page.</span></div>'
    : '';
  return '<div class="shell">'+railHtml()+'<div class="main">'+exampleBanner+lockedBanner+body+'</div></div>';
}

/* ---------- Player preview (real Discussion Session look) ---------- */
// The full click-through order a student actually experiences: scenarios 1-3, the
// halftime check-in, scenarios 4-6, then the closing reflection.
var PP_SEQUENCE = [
  {kind:'scenario', i:0}, {kind:'scenario', i:1}, {kind:'scenario', i:2},
  {kind:'halftime'},
  {kind:'scenario', i:3}, {kind:'scenario', i:4}, {kind:'scenario', i:5},

];
function ppStepLabel(entry){
  if(entry.kind==='scenario') return 'Scenario '+(entry.i+1);
  if(entry.kind==='halftime') return 'Halftime';
  return 'Closing Reflection';
}
function ppStepForKind(kind, idx){
  for(var s=0; s<PP_SEQUENCE.length; s++){
    var entry = PP_SEQUENCE[s];
    if(entry.kind!==kind) continue;
    if(kind!=='scenario' || entry.i===idx) return s;
  }
  return 0;
}
function renderPPScenario(sc, i){
  var optsHtml = sc.options.map(function(o){
    var iconHtml = o.selectedIcon
      ? '<img src="'+esc(o.selectedIcon.iconUrl || o.selectedIcon.thumbnailUrl)+'" alt="">'
      : ppIconFor((o.iconDescription||'')+' '+(o.label||'')+' '+(o.rationale||''));
    var label = o.label.trim() || 'Untitled option';
    var rationale = o.rationale.trim();
    return '<div class="pp-opt"><div class="pp-opt-icon">'+iconHtml+'</div><div class="pp-opt-cap"><b>'+esc(label)+'</b>'+(rationale? ': '+esc(rationale):'')+'</div></div>';
  }).join('');
  var cqs = sc.challenge.filter(function(q){return q.trim();});
  var cqIdx = clamp(state.ppChallengeIndex, 0, Math.max(0, cqs.length-1));

function noteBlockHtml(d, fieldKey, opts){

// Wraps a piece of content and its field notes in a two-column row — content on the

// Skips the wrapper entirely when there's nothing to show (no open note, and not the
// coach view, which always has at least a "+ Note" button), so a field with no notes

function withNote(contentHtml, d, fieldKey, opts){
