    render();
    return;
  }
  if(action==='deleteInboxDraft'){
    var inboxDeleteId = t.getAttribute('data-id');
    var inboxDeleteDraft = state.inboxList.filter(function(d){ return d.id===inboxDeleteId; })[0];
    if(!inboxDeleteDraft) return;
    if(isSeededExampleId(inboxDeleteId)) return; // belt and suspenders: the button is already hidden for these
    if(!confirm('Delete "'+(inboxDeleteDraft.title||'Untitled')+'" by '+(inboxDeleteDraft.studentName||'Student')+'? This can\'t be undone.')) return;
    // Notes are a separate key from the draft itself (see notesKey()) — clean up both,
    // rather than leaving an orphaned notes:<id> behind with nothing left to attach to.
    Promise.all([
      window.storage.delete('draft:'+inboxDeleteId),
      window.storage.delete(notesKey(inboxDeleteId))
    ]).then(function(){
      state.inboxList = state.inboxList.filter(function(d){ return d.id!==inboxDeleteId; });
      state.inboxSelectedId = null;
      state.screen = 'inbox';
      render();
    }).catch(function(e){
      console.error('inbox delete failed', e);
      if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
      state.inboxError = "Couldn't delete that session — try again in a moment.";
      state.screen = 'inbox';
      render();
    });
    return;
  }
  if(action==='openInboxDraft'){
    state.inboxSelectedId = t.getAttribute('data-id');
    state.screen='inboxDraft';
    render();
    return;
  }
  if(action==='openInboxFlagged'){
    state.inboxFlaggedUsername = t.getAttribute('data-username');
    state.screen='inboxFlagged';
    render();
    return;
  }
  if(action==='unlockUser'){
    var username = t.getAttribute('data-username');
    var noteEl = document.getElementById('unlockNoteText');
    var note = noteEl ? noteEl.value.trim() : '';
    loadModeration(username).then(function(m){
      m.locked = false;
      m.unlocked = true;
      m.unlockedAt = Date.now();
      m.redirectCount = 0;
      if(note) m.coachNote = note;
      m.studentAppeal = '';
      m.studentAppealAt = null;
      saveModeration(m);
      return listModerationRecords();
    }).then(function(list){
      state.flaggedList = list;
      state.screen = 'inbox';
      render();
    }).catch(function(e){
      console.error('unlock failed', e);
      if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
      state.inboxError = 'Couldn\'t unlock that account — try again in a moment.';
      state.screen = 'inbox';
      render();
    });
    return;
  }
  if(action==='sendBackForRevision'){
    var revisionId = t.getAttribute('data-id');
    var revisionFbEl = document.getElementById('coachFeedbackText');
    var revisionText = revisionFbEl ? revisionFbEl.value.trim() : '';
    // A pending autosave from the feedback box or a note-compose box (debounceCoachNoteSave)
    // must not fire after this write — it would carry the pre-send-back in-memory record
    // and silently revert the status change. See saveCoachDraftRecord.
    if(coachDraftSaveTimers[revisionId]){ clearTimeout(coachDraftSaveTimers[revisionId]); delete coachDraftSaveTimers[revisionId]; }
    loadDraft(revisionId).then(function(d){
      if(!d){
        state.inboxError = 'Couldn\'t find that draft — it may have been deleted. Try again from the drafts list.';
        state.screen='inbox';
        render();
        return;
      }
      if(revisionText) d.coachNotes.push({text:revisionText, at:Date.now()});
      d.coachDraftNote = ''; // committed into the note above — don't leave it lingering as a draft
      d.status = 'revision';
      d.updatedAt = Date.now();
      return window.storage.set('draft:'+d.id, JSON.stringify(d), true).then(function(){
        return listAllDrafts();
      }).then(function(list){
        state.inboxList = list;
        state.screen='inbox';
        render();
      });
    }).catch(function(e){
      console.error('coach action failed', e);
      if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
      state.inboxError='Couldn\'t save that change — it may not have gone through. Try again in a moment.';
      state.screen='inbox';
      render();
    });
    return;
  }
  // Accepting freezes the student's draft (see isDraftLocked) and spins off a separate
  // pending:<id> snapshot the coach polishes on its own — see newPendingFromDraft. Both
  // writes have to land for this to be consistent; if the second one fails after the
  // first succeeds, the draft would show "Accepted" with no matching Pending row, which
  // is why the error path here specifically says to check the Pending list before retrying.
  if(action==='acceptDraft'){
    var acceptId = t.getAttribute('data-id');
    var acceptFbEl = document.getElementById('coachFeedbackText');
    var acceptText = acceptFbEl ? acceptFbEl.value.trim() : '';
    if(coachDraftSaveTimers[acceptId]){ clearTimeout(coachDraftSaveTimers[acceptId]); delete coachDraftSaveTimers[acceptId]; }
    loadDraft(acceptId).then(function(d){
      if(!d){
        state.inboxError = 'Couldn\'t find that draft — it may have been deleted. Try again from the drafts list.';
        state.screen='inbox';
        render();
        return;
      }
      if(acceptText) d.coachNotes.push({text:acceptText, at:Date.now()});
      d.coachDraftNote = '';
      d.status = 'accepted';
      d.acceptedAt = Date.now();
      d.updatedAt = Date.now();
      var pending = newPendingFromDraft(d);
      return window.storage.set('draft:'+d.id, JSON.stringify(d), true).then(function(){
        return window.storage.set('pending:'+pending.id, JSON.stringify(pending), true);
      }).then(function(){
        return Promise.all([listAllDrafts(), listAllPending()]);
      }).then(function(results){
        state.inboxList = results[0];
        state.pendingList = results[1];
        state.screen='inbox';
        render();
      });
    }).catch(function(e){
      console.error('accept failed', e);
      if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
      state.inboxError='Couldn\'t accept that draft — it may not have gone through. Check the Pending list before retrying, in case only part of it saved.';
      state.screen='inbox';
      render();
    });
    return;
  }

  // Per-field editor's notes — see noteBlockHtml. Unlike send-back/mark-reviewed, these
  // stay on the same draft's review page rather than returning to the inbox list, so a
  // coach can add several notes in one pass.
  if(action==='addFieldNote'){
    state.composingNoteField = t.getAttribute('data-field');
    render();
    var composeEl = document.getElementById('fieldNoteComposeInput');
    if(composeEl) composeEl.focus();
    return;
  }
  if(action==='cancelFieldNote'){
    // Discard the autosaved scratch too, not just the open compose box — otherwise a
    // cancelled note's half-written text quietly persists and comes back next time this
    // field's "+ Note" is clicked.
    var cancelDraft = state.inboxList.filter(function(x){ return x.id===state.inboxSelectedId; })[0];
    if(cancelDraft && state.composingNoteField && cancelDraft.noteComposeDrafts[state.composingNoteField]){
      delete cancelDraft.noteComposeDrafts[state.composingNoteField];
      if(coachDraftSaveTimers[cancelDraft.id]){ clearTimeout(coachDraftSaveTimers[cancelDraft.id]); delete coachDraftSaveTimers[cancelDraft.id]; }
      saveCoachDraftRecord(cancelDraft, 'fieldNoteComposeSaveIndicator');
    }
    state.composingNoteField = null;
    render();
    return;
  }
  if(action==='saveFieldNote'){
    var noteField = t.getAttribute('data-field');
    var noteDraftId = t.getAttribute('data-id');
    var composeInput = document.getElementById('fieldNoteComposeInput');
    var noteText = composeInput ? composeInput.value.trim() : '';
    if(!noteText){ state.composingNoteField = null; render(); return; }
    state.editorNoteBusy = true;
    render();
    // Same reasoning as sendBackForRevision/acceptDraft — don't let a pending compose
    // autosave fire after this authoritative write and clobber the freshly-added note.
    if(coachDraftSaveTimers[noteDraftId]){ clearTimeout(coachDraftSaveTimers[noteDraftId]); delete coachDraftSaveTimers[noteDraftId]; }
    loadDraft(noteDraftId).then(function(d){
      if(!d){
        state.inboxError = 'Couldn\'t find that draft — it may have been deleted. Try again from the drafts list.';
        state.editorNoteBusy = false;
        state.composingNoteField = null;
        state.screen = 'inbox';
        render();
        return;
      }
      d.editorNotes.push(newEditorNote(noteField, noteText));
      delete d.noteComposeDrafts[noteField]; // committed into the note above
      d.updatedAt = Date.now();
      return window.storage.set('draft:'+d.id, JSON.stringify(d), true).then(function(){
        return listAllDrafts();
      }).then(function(list){
        state.inboxList = list;
        state.composingNoteField = null;
        state.editorNoteBusy = false;
        render();
      });
    }).catch(function(e){
      console.error('save field note failed', e);
      state.editorNoteBusy = false;
      if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
      state.inboxError = 'Couldn\'t save that note — it may not have gone through. Try again in a moment.';
      render();
    });
    return;
  }
  if(action==='toggleNoteResolved'){
    var resolveDraftId = t.getAttribute('data-id');
    var resolveNoteId = t.getAttribute('data-noteid');
    var resolveChecked = t.checked;
    state.editorNoteBusy = true;
    render();
    loadDraft(resolveDraftId).then(function(d){
      if(!d){
        state.inboxError = 'Couldn\'t find that draft — it may have been deleted. Try again from the drafts list.';
        state.editorNoteBusy = false;
        state.screen = 'inbox';
        render();
        return;
      }
      var note = d.editorNotes.filter(function(n){ return n.id===resolveNoteId; })[0];
      if(note) note.resolvedAt = resolveChecked ? Date.now() : null;
      d.updatedAt = Date.now();
      return window.storage.set('draft:'+d.id, JSON.stringify(d), true).then(function(){
        return listAllDrafts();
      }).then(function(list){
        state.inboxList = list;
        state.editorNoteBusy = false;
        render();
      });
    }).catch(function(e){
      console.error('toggle note resolved failed', e);
      state.editorNoteBusy = false;
      if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
      state.inboxError = 'Couldn\'t update that note — it may not have gone through. Try again in a moment.';
      render();
    });
    return;
  }

  // Only offered once a session is past the student/coach back-and-forth (Pending
  // polish / Ready for Code / Shipped) — see renderPendingRow/renderPendingScreen.
  // Draft-status records (Ready for review, Needs revision, In progress) never render
  // this button.
  if(action==='exportMarkdownPending'){
    var exportPendingId = t.getAttribute('data-id');
    var exportPending = (state.pendingDraft && state.pendingDraft.id===exportPendingId)
      ? state.pendingDraft
      : state.pendingList.filter(function(x){return x.id===exportPendingId;})[0];
    if(exportPending) downloadText((exportPending.title||'session').toLowerCase().replace(/[^a-z0-9]+/g,'_')+'.md', toMarkdown(exportPending));
    return;
  }

  // Pending polish screen — see renderPendingScreen/updatePendingField for the editing
  // side; these four handle navigation in/out and the two record-level actions (usage
  // weeks, marking shipped) that aren't just a text field.
  if(action==='openPendingDraft'){
    var openPendingId = t.getAttribute('data-id');
    state.pendingSelectedId = openPendingId;
    state.pendingDraft = null;
    state.screen = 'pendingDraft';
    render();
    loadPending(openPendingId).then(function(p){
      if(!p){
        state.inboxError = 'Couldn\'t find that session — it may have been deleted.';
        state.screen = 'inbox';
        render();
        return;
      }
      state.pendingDraft = p;
      render();
    }).catch(function(e){
      console.error('load pending failed', e);
      if(e && e.authRequired){ requireCoachSignIn('Your coach session expired. Please sign in again.'); return; }
      state.inboxError = 'Couldn\'t load that session — try again in a moment.';
      state.screen = 'inbox';
      render();
    });
    return;
  }
  if(action==='closePendingDraft'){
    var finishClosingPending = function(){
      listAllPending().then(function(list){
        state.pendingList = list;
        state.screen = 'inbox';
        render();
      });
    };
    if(state.pendingDraft && pendingDirty){
      savePendingDraft().then(finishClosingPending);
    } else {
      finishClosingPending();
    }
    return;
  }
  if(action==='addUsageWeek'){
    var weekInput = document.getElementById('usageWeekInput');
    var weekVal = weekInput ? weekInput.value : '';
    if(!weekVal || !state.pendingDraft) return;
    if(state.pendingDraft.usageWeeks.indexOf(weekVal)===-1){
      state.pendingDraft.usageWeeks.push(weekVal);
      debouncePendingSave();
    }
    render();
    return;
  }
  if(action==='removeUsageWeek'){
    var weekToRemove = t.getAttribute('data-week');
    if(!state.pendingDraft) return;
    state.pendingDraft.usageWeeks = state.pendingDraft.usageWeeks.filter(function(w){ return w!==weekToRemove; });
    debouncePendingSave();
    render();
    return;
  }
  if(action==='markPendingReady'){
    if(!state.pendingDraft) return;
    if(!window.confirm('Mark this session ready for code? Fields lock once it is — you can still ship it from here after.')) return;
    state.pendingDraft.status = 'ready';
    state.pendingDraft.readyAt = Date.now();
    savePendingDraft().then(function(){ render(); });
    return;
  }
  if(action==='markSentToCode'){
    if(!state.pendingDraft) return;
    if(!window.confirm('Mark this session as sent to code? It will move to Shipped, under Finalized.')) return;
    state.pendingDraft.status = 'shipped';
    state.pendingDraft.sentToCodeAt = Date.now();
    savePendingDraft().then(function(){ render(); });
    return;
  }

  // Both player-preview actions live here, above the "requires a loaded draft" guard
  // below — exactly like exportMarkdownPending just above, since the coach inbox never
  // sets state.draft at all (renderShellInboxDraft reads state.inboxList directly on
  // every render). Placed after that guard, a coach's click here used to be silently
  // swallowed before either handler ever ran.
  if(action==='openPlayerPreview'){
    var ppKindAttr = t.getAttribute('data-kind');
    var ppIdxAttr = t.getAttribute('data-idx');
    var ppIdx = ppIdxAttr!==null ? parseInt(ppIdxAttr,10) : state.scenarioIndex;
    if(state.screen==='inboxDraft'){
      var ppInboxSource = state.inboxList.filter(function(x){ return x.id===state.inboxSelectedId; })[0];
      if(ppInboxSource) state.draft = ppInboxSource;
    }
    state.ppStep = ppStepForKind(ppKindAttr, ppIdx);
    state.ppChallengeIndex = 0;
    state.ppReturnScreen = state.screen;
    state.screen = 'playerPreview';
    render(); return;
  }
  if(action==='closePlayerPreview'){
    state.screen = state.ppReturnScreen || 'storyboard';
    // Undo the lookup above on the way out — a coach's state.draft should never
    // hold a student's draft outside of this preview. Left set, a later "Back
    // home" from the inbox list would call saveDraft() on it via goHome, quietly
    // rewriting that student's draft with a new updatedAt despite no real edit.
    if(state.screen==='inboxDraft') state.draft = null;
    render(); return;
  }

  // Icon search/select/clear can fire from the coach's pending-polish screen, which
  // has no state.draft loaded — only searchIcon/selectIcon/clearIcon (all mode-aware,
  // below) run in that case, so the gate has to admit either record type.
  if(!state.draft && !state.pendingDraft) return;

  if(action==='nav'){
    var navTarget = t.getAttribute('data-target');
    if(navTarget==='review') state.submitError=''; // don't show a stale reason after they've gone and fixed it
    state.screen = navTarget;
    render();
    return;
  }
  if(action==='openScenario'){ state.scenarioIndex = parseInt(t.getAttribute('data-idx'),10); state.screen='scenario'; render(); return; }
  if(action==='openHalftime'){ state.screen='halftimeEditor'; render(); return; }
  if(action==='prevScenario'){ if(state.scenarioIndex>0){ state.scenarioIndex--; render(); } return; }
  if(action==='nextScenario'){ if(state.scenarioIndex<5){ state.scenarioIndex++; render(); } return; }

  if(action==='searchIcon'){
    var scenarioIdx = parseInt(t.getAttribute('data-scenarioidx'),10);
    var optionIdx = parseInt(t.getAttribute('data-oidx'),10);
    var searchMode = t.getAttribute('data-mode') || 'draft';
    var searchSource = searchMode==='pending' ? state.pendingDraft : state.draft;
    if(!searchSource) return;
    var query = searchSource.scenarios[scenarioIdx].options[optionIdx].iconDescription.trim();
    if(!query) return;
    state.iconSearchOpen = {mode:searchMode, scenarioIndex:scenarioIdx, optionIndex:optionIdx};
    state.iconEmbedError = '';
    performIconSearch(query);
    return;
  }
  if(action==='dismissIconSearch'){ state.iconSearchOpen = null; state.iconEmbedError=''; render(); return; }
  if(action==='selectIcon'){
    var iconIdx = parseInt(t.getAttribute('data-idx'),10);
    var icon = state.iconSearchResults[iconIdx];
    if(!icon || !state.iconSearchOpen) return;
    var loc = state.iconSearchOpen;
    embedSelectedIcon(icon, loc.scenarioIndex, loc.optionIndex, loc.mode);
    return;
  }
  if(action==='clearIcon'){
    var clearScenarioIdx = parseInt(t.getAttribute('data-scenarioidx'),10);
    var clearOptionIdx = parseInt(t.getAttribute('data-oidx'),10);
    var clearMode = t.getAttribute('data-mode') || 'draft';
    if(clearMode==='pending'){
      if(!state.pendingDraft || state.pendingDraft.status==='ready' || state.pendingDraft.status==='shipped') return;
      state.pendingDraft.scenarios[clearScenarioIdx].options[clearOptionIdx].selectedIcon = null;
      debouncePendingSave();
    } else {
      state.draft.scenarios[clearScenarioIdx].options[clearOptionIdx].selectedIcon = null;
      debounceSave();
    }
    render();
    return;
  }
  if(action==='ppPrevStep'){ if(state.ppStep>0){ state.ppStep--; state.ppChallengeIndex=0; render(); } return; }
  if(action==='ppNextStep'){ if(state.ppStep<PP_SEQUENCE.length-1){ state.ppStep++; state.ppChallengeIndex=0; render(); } return; }
  if(action==='ppPrevCq'){ if(state.ppChallengeIndex>0){ state.ppChallengeIndex--; render(); } return; }
  if(action==='ppNextCq'){ state.ppChallengeIndex++; render(); return; }

  if(action==='setOptionCount'){
    var n = parseInt(t.getAttribute('data-n'),10);
    var curCount = state.draft.optionCount;
    if(n === curCount) return;
    // Growing keeps every existing option, so it needs no warning at all. Shrinking
    // drops the options past the new count permanently — so only prompt when those
    // specific slots actually hold something, and say exactly what is lost.
    if(n < curCount){
      var affected = 0, doomedSlots = [];
      state.draft.scenarios.forEach(function(sc){
        var hit = false;
        for(var oi=n; oi<sc.options.length; oi++){
          var o = sc.options[oi];
          if(!o) continue;
          if(o.label.trim() || o.rationale.trim() || o.iconDescription.trim() || o.selectedIcon){
            hit = true;
            if(doomedSlots.indexOf(oi+1) === -1) doomedSlots.push(oi+1);
          }
        }
        if(hit) affected++;
      });
      if(affected){
        doomedSlots.sort(function(a,b){ return a-b; });
        var slotLabel = doomedSlots.length===1
          ? ('Option ' + doomedSlots[0])
          : ('Options ' + doomedSlots.slice(0,-1).join(', ') + ' and ' + doomedSlots[doomedSlots.length-1]);
        if(!confirm(slotLabel + ' will be deleted from ' + affected + ' scenario' +
                    (affected===1?'':'s') + ', and this can\'t be undone.\n\nSwitch to ' +
                    n + ' options anyway?')) return;
      }
    }
    state.draft.optionCount = n;
    state.draft.scenarios.forEach(function(sc){
      var opts=[]; for(var i=0;i<n;i++) opts.push(sc.options[i] || newOption(i));
      sc.options = opts;
    });
    debounceSave(); render(); return;
  }

  if(action==='moveScenario'){
    var sIdx = parseInt(t.getAttribute('data-idx'),10), sDir = parseInt(t.getAttribute('data-dir'),10);
    var scs2 = state.draft.scenarios;
    var sTo = sIdx+sDir;
    if(sTo<0 || sTo>=scs2.length) return;
    var sTmp = scs2[sIdx]; scs2[sIdx]=scs2[sTo]; scs2[sTo]=sTmp;
    debounceSave(); render(); return;
  }
  if(action==='moveLane'){
    var idx = parseInt(t.getAttribute('data-idx'),10), dir = parseInt(t.getAttribute('data-dir'),10);
    var opts = state.draft.scenarios[state.scenarioIndex].options;
    var j = idx+dir;
    if(j<0||j>=opts.length) return;
    var tmp = opts[idx]; opts[idx]=opts[j]; opts[j]=tmp;
    debounceSave(); render(); return;
  }
  if(action==='addChallenge'){
    var chal = state.draft.scenarios[state.scenarioIndex].challenge;
    if(chal.length<4) chal.push('');
    debounceSave(); render(); return;
  }
  if(action==='removeChallenge'){
    var qidx2 = parseInt(t.getAttribute('data-qidx'),10);
    state.draft.scenarios[state.scenarioIndex].challenge.splice(qidx2,1);
    debounceSave(); render(); return;
  }
  if(action==='addhalftimeOpt'){ if(state.draft.halftime.options.length<3) state.draft.halftime.options.push(''); debounceSave(); render(); return; }
  if(action==='removehalftimeOpt'){ var hi=parseInt(t.getAttribute('data-oidx'),10); state.draft.halftime.options.splice(hi,1); debounceSave(); render(); return; }
  if(action==='addreflectionOpt'){ if(state.draft.reflection.options.length<3) state.draft.reflection.options.push(''); debounceSave(); render(); return; }
  if(action==='removereflectionOpt'){ var ri=parseInt(t.getAttribute('data-oidx'),10); state.draft.reflection.options.splice(ri,1); debounceSave(); render(); return; }

  if(action==='submitToCoach'){
    if(state.draft.isExample) return; // the button is hidden for examples; this is the backstop
    var blockReason = firstIncompleteSubmitReason(state.draft);
    if(blockReason){ state.submitError = blockReason; render(); return; }
    state.submitError = '';
    state.draft.status='submitted';
    // First submission only — a resubmit after "sent back with notes" shouldn't push
    // this date forward, or the coach inbox's "date submitted" search would stop
    // reflecting when the student actually first sent this in.
    if(!state.draft.submittedAt) state.draft.submittedAt = Date.now();
    saveDraft();
    render();
    return;
  }
  if(action==='exportMarkdown'){
    if(state.draft.isExample) return; // the button is hidden for examples; this is the backstop
    downloadText((state.draft.title||'session').toLowerCase().replace(/[^a-z0-9]+/g,'_')+'.md', toMarkdown(state.draft));
    return;
  }
  if(action==='askCoachWhole'){
    askCoach('Can you review my whole session for balance, tone, sensitivity, and structure?', {title:state.draft.title, bigIdea:state.draft.bigIdea, scenarios:state.draft.scenarios, halftime:state.draft.halftime, reflection:state.draft.reflection});
    return;
  }
  if(action==='toggleCoach'){
    state.coachOpen=!state.coachOpen;
    var coachDrawerEl = document.querySelector('.coach-drawer');
    if(coachDrawerEl){ coachDrawerEl.classList.toggle('open', state.coachOpen); }
    else { renderCoachOverlay(); }
    return;
  }
  if(action==='deleteNote'){
    var delNoteId = t.getAttribute('data-noteid');
    state.notes = state.notes.filter(function(n){ return n.id!==delNoteId; });
    debounceSaveNotes();
    render();
    return;
  }
  if(action==='setNoteColor'){
    var colorNoteId = t.getAttribute('data-noteid');
    var newColor = t.getAttribute('data-color');
    var colorNote = state.notes.filter(function(n){ return n.id===colorNoteId; })[0];
    if(colorNote){ colorNote.color = newColor; colorNote.updatedAt = Date.now(); debounceSaveNotes(); }
    render();
    return;
  }
  if(action==='sendCoachMsg'){ sendCoachFromInput(); return; }
  if(action==='sendAppeal'){ sendAppealFromInput(); return; }
}

/* ---------- Drag and drop ---------- */
function handleDragStart(e){
  // Don't let the card's draggable="true" hijack normal text selection/typing
  // inside its own inputs, textareas, or buttons — only the surrounding card
  // area should act as the grab handle.
  if(e.target.closest('input, textarea, select, button')){ e.preventDefault(); return; }
  var t = e.target.closest('[data-drag]');
  if(!t) return;
  var kind = t.getAttribute('data-drag');
  if(kind==='scenario'){
    state.dragScenarioIdx = parseInt(t.getAttribute('data-dragidx'),10);
    e.dataTransfer.setData('text/plain','scenario');
    t.classList.add('dragging');
  } else if(kind==='lane'){
    state.dragLaneIdx = parseInt(t.getAttribute('data-dragidx'),10);
    e.dataTransfer.setData('text/plain','lane');
    t.classList.add('dragging');
  }
}
function handleDragOver(e){
  if(state.dragScenarioIdx!==null || state.dragLaneIdx!==null){
    // A drag we initiated is in progress — always block the browser's default
    // handling so it never falls back to inserting the drag payload as text
    // into whatever input/textarea happens to be under the cursor.
    e.preventDefault();
    return;
  }
  if(e.target.closest('[data-action="openScenario"]') || e.target.closest('.lane')){
    e.preventDefault();
  }
}
function handleDrop(e){
  var payload;
  try{ payload = e.dataTransfer.getData('text/plain'); }catch(err){ payload=''; }
  if(payload==='scenario' || payload==='lane'){
    // Always suppress the browser's default drop action for our own drag
    // payloads (e.g. text fields inserting the literal word "note"), even
    // when the drop lands somewhere that isn't a recognized target below.
    e.preventDefault();
  }
  var cardTarget = e.target.closest('[data-action="openScenario"]');
  if(cardTarget && payload==='scenario' && state.dragScenarioIdx!==null){
    e.preventDefault();
    var toIdx = parseInt(cardTarget.getAttribute('data-idx'),10);
    var scs = state.draft.scenarios;
    var moved = scs.splice(state.dragScenarioIdx,1)[0];
    scs.splice(toIdx,0,moved);
    state.dragScenarioIdx=null;
    debounceSave(); render();
    return;
  }
  var laneTarget = e.target.closest('.lane');
  if(laneTarget && payload==='lane' && state.dragLaneIdx!==null){
    e.preventDefault();
    var toLaneIdx = parseInt(laneTarget.getAttribute('data-dragidx'),10);
    var opts = state.draft.scenarios[state.scenarioIndex].options;
    var movedOpt = opts.splice(state.dragLaneIdx,1)[0];
    opts.splice(toLaneIdx,0,movedOpt);
    state.dragLaneIdx=null;
    debounceSave(); render();
    return;
  }
}
function handleDragEnd(){
  state.dragScenarioIdx=null; state.dragLaneIdx=null;
  document.querySelectorAll('.dragging').forEach(function(el){ el.classList.remove('dragging'); });
}

/* ============================= INIT ============================= */
attachAppDelegatesOnce();
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);
// Sticky notes store raw viewport-pixel x/y — if the window shrinks, pull any
// note back into view rather than leaving it stranded off-screen with no way
// to reach it.
window.addEventListener('resize', function(){
  // Before the early return: the size constants must track the breakpoint even when
  // no notes are on screen, or the next render clamps against stale bounds. On iOS
  // this also fires when the URL bar collapses, which is what kept notes jumping.
  syncStickySize();
  if(document.getElementById('notesOverlayRoot')){
    var changed = false;
    state.notes.forEach(function(n){
      if(n.x==null || n.y==null) return;
      var nx = clamp(n.x, 0, window.innerWidth-STICKY_W);
      var ny = clamp(n.y, 0, window.innerHeight-STICKY_H);
      if(nx!==n.x || ny!==n.y){ n.x=nx; n.y=ny; changed=true; }
    });
    if(changed){ renderStickyLayer(); debounceSaveNotes(); }
  }
  if(document.getElementById('editorNotesOverlayRoot') && state.draft){
    var editorChanged = false;
    (state.draft.editorNotes||[]).forEach(function(n){
      if(n.x==null || n.y==null) return;
      var ex = clamp(n.x, 0, window.innerWidth-EDITOR_NOTE_W);
      var ey = clamp(n.y, 0, window.innerHeight-EDITOR_NOTE_H);
      if(ex!==n.x || ey!==n.y){ n.x=ex; n.y=ey; editorChanged=true; }
    });
    if(editorChanged){ renderEditorNoteLayer(); debounceSave(); }
  }
});
render();
// Identity comes from the URL, so the drafts list can populate before the student
// touches anything.
refreshMyDrafts();
})();
</script>
