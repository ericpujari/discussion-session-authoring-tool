<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Builder — Synthesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2937;
    --ink-soft:#4B5768;
    --board:#1D2B3A;
    --board-2:#26394C;
    --paper:#F6F1E4;
    --paper-2:#EFE6CE;
    --lane-a:#2E8B84;   --lane-a-soft:#DCEEEC; --lane-a-line:#bfe0dc;
    --lane-b:#6C63A6;   --lane-b-soft:#E8E4F5; --lane-b-line:#d3cdec;
    --lane-c:#B9791F;   --lane-c-soft:#F5E8CE; --lane-c-line:#e8d4a4;
    --lane-d:#A15B78;   --lane-d-soft:#F3E2EA; --lane-d-line:#e9cdd9;
    --pin:#B08A3E;
    --line: rgba(31,41,55,.14);
    --shadow: 0 10px 28px rgba(8,12,20,.22);
    --shadow-sm: 0 3px 10px rgba(8,12,20,.14);
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: 'Work Sans', system-ui, -apple-system, sans-serif;
    --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'Work Sans', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0) 0 0/22px 22px,
      linear-gradient(180deg, var(--board), var(--board-2));
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.02em;}
  h1{font-weight:700;}
  h2{font-weight:500;}
  h3{font-weight:600;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:15px; color:var(--ink);}
  a{color:inherit;}
  ::selection{background:var(--lane-b-soft);}
  :focus-visible{outline:3px solid #F2C572; outline-offset:2px; border-radius:6px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#B9C4D0;}
  .eyebrow.dark{color:var(--ink-soft);}
  .glass-pill{
    display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16); border-radius:9999px; padding:8px 18px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .home-hero .eyebrow{font-size:11.5px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    padding:11px 18px; border-radius:999px; border:1.5px solid transparent;
    font-weight:600; font-size:14.5px; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink); color:var(--paper); box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:#31404f;}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:rgba(31,41,55,.06);}
  .btn-ghost-light{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#F2EEE1;}
  .btn-ghost-light:hover{background:rgba(255,255,255,.16);}
  .btn-small{padding:6px 12px; font-size:12.5px; border-radius:999px;}
  .btn-icon{width:32px; height:32px; padding:0; border-radius:999px; border:1.5px solid var(--line); background:#fff;}
  .btn-danger-text{color:#9B3B34; background:transparent; border:none; font-size:13px; font-weight:600;}

  /* ---------- Home ---------- */
  .home-wrap{max-width:960px; margin:0 auto; padding:64px 24px 80px;}
  .home-hero{text-align:center; color:#F2EEE1; margin-bottom:44px;}
  .home-hero h1{
    font-size:clamp(30px,5vw,46px); margin:14px 0 12px; line-height:1.14;
    color:#fff;
    background-image:linear-gradient(165deg, #ffffff 35%, rgba(255,255,255,.42));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .home-hero p{color:#C7D2DD; font-size:16.5px; max-width:520px; margin:0 auto;}
  .home-hero .visibility-note{color:#93A2B3; font-size:13px; max-width:460px; margin:12px auto 0;}
  .home-cards{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:720px){.home-cards{grid-template-columns:1fr;}}
  .home-card{
    background:var(--paper); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow);
    border-top:6px solid var(--lane-a);
    position:relative;
  }
  .home-card.alt{border-top-color:var(--lane-b);}
  .home-card h3{font-size:20px; margin-bottom:6px;}
  .home-card p{color:var(--ink-soft); font-size:14px; margin-bottom:18px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .field input[type=text], .field textarea, .field select{
    width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{border-color:var(--ink-soft);}
  .field textarea{resize:vertical; min-height:70px; line-height:1.45;}
  .field .hint{font-size:12px; color:#8B94A0; margin-top:5px; font-weight:400; text-transform:none; letter-spacing:0;}
  .home-footer-link{display:block; text-align:center; margin-top:36px; color:#C7D2DD; font-size:13.5px; text-decoration:underline; text-underline-offset:3px;}
  .home-footer-link:hover{color:#fff;}

  /* ---------- Shell (after a draft is loaded) ---------- */
  .shell{display:flex; min-height:100vh;}
  .rail{
    width:220px; flex-shrink:0; background:rgba(0,0,0,.18); padding:22px 14px; display:flex; flex-direction:column;
    border-right:1px solid rgba(255,255,255,.08);
  }
  .rail-code{font-family:var(--font-mono); font-size:11px; color:#9FB0C0; letter-spacing:.06em; margin-bottom:2px;}
  .rail-name{color:#fff; font-weight:600; font-size:14.5px; margin-bottom:18px;}
  .rail-step{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; color:#C7D2DD; font-size:13.5px;
    margin-bottom:2px; font-weight:500;
  }
  .rail-step .dot{width:7px; height:7px; border-radius:50%; background:#4A5C6E; flex-shrink:0;}
  .rail-step.active{background:rgba(255,255,255,.12); color:#fff;}
  .rail-step.active .dot{background:#F2C572;}
  .rail-step.done .dot{background:var(--lane-a);}
  .rail-step:hover{background:rgba(255,255,255,.08); cursor:pointer;}
  .rail-scenarios{margin:6px 0 10px 0; padding-left:4px; border-left:1.5px solid rgba(255,255,255,.14); margin-left:13px;}
  .rail-spacer{flex:1;}
  .rail-bottom{display:flex; flex-direction:column; gap:8px;}
  .rail-save-indicator{
    font-family:var(--font-mono); font-size:11px; color:#7C8CA0; padding:0 10px 8px; display:block;
    transition:color .15s ease;
  }
  .rail-save-indicator.unsaved{color:#E0A94C;}
  .rail-save-indicator.saving{color:#9FB0C0;}
  .rail-save-indicator.saved{color:#6FAE9F;}
  .rail-save-indicator.failed{color:#E08A7D; font-weight:600;}

  .main{flex:1; min-width:0; padding:34px 40px 120px; max-width:900px;}
  @media (max-width:860px){
    .shell{flex-direction:column;}
    .rail{width:100%; flex-direction:row; align-items:center; overflow-x:auto; padding:12px 16px; gap:14px;}
    .rail-scenarios{display:none;}
    .rail-name, .rail-code{display:none;}
    .rail-spacer{display:none;}
    .rail-bottom{flex-direction:row;}
    .rail-save-indicator{padding:0 4px; white-space:nowrap;}
    .main{padding:22px 18px 140px;}
  }

  .page-head{margin-bottom:26px;}
  .page-head h2{color:#fff; font-size:clamp(24px,3vw,30px); margin:6px 0 8px;}
  .page-head p{color:#C7D2DD; font-size:14.5px; max-width:560px; line-height:1.5;}

  .panel{background:var(--paper); border-radius:var(--radius); padding:26px 28px; box-shadow:var(--shadow); margin-bottom:20px; container-type:inline-size;}
  .panel h3{font-size:17px; margin-bottom:14px;}
  .row{display:flex; gap:14px;}
  .row > *{flex:1;}
  @media (max-width:600px){.row{flex-direction:column;}}

  .radio-cards{display:flex; gap:10px;}
  .radio-card{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; text-align:center;
    font-weight:600; font-size:14px; background:#fff; transition:all .12s ease;
  }
  .radio-card.selected{border-color:var(--ink); background:var(--paper-2); box-shadow:inset 0 0 0 1.5px var(--ink);}

  /* ---------- Storyboard ---------- */
  .board{
    background:var(--board); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0);
    background-size:16px 16px;
  }
  .board-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}
  @media (max-width:700px){.board-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:460px){.board-grid{grid-template-columns:1fr;}}
  .index-card{
    background:var(--paper); border-radius:10px; padding:16px; min-height:130px; box-shadow:0 6px 14px rgba(0,0,0,.35);
    position:relative; cursor:grab; transform:rotate(var(--r,0deg)); transition:transform .12s ease;
    border:1px solid rgba(0,0,0,.06);
  }
  .index-card:hover{transform:rotate(0deg) translateY(-2px);}
  .index-card.dragging{opacity:.4;}
  .index-card .pin{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #E4C77E, var(--pin)); box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .index-card .num{
    font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.05em;
    color:#fff; background:var(--ink); display:inline-block; padding:3px 9px; border-radius:6px;
    margin-bottom:10px;
  }
  .index-card h4{font-size:15.5px; margin-bottom:6px; line-height:1.25;}
  .index-card .domain-chip{
    display:inline-block; font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft); margin-top:8px;
  }
  .index-card .empty{color:#A69A78; font-size:13px; font-style:italic;}

  .index-card.halftime-card{border:1.5px dashed var(--pin); cursor:pointer;}
  .index-card.halftime-card .num{background:var(--pin);}
  .index-card.halftime-card .halftime-pin{
    position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:17px; line-height:1;
  }

  .domain-panel{
    margin-top:18px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:16px 18px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .domain-panel h4{color:#fff; font-size:13px; margin-bottom:10px; font-family:var(--font-body); font-weight:600;}
  .domain-list{display:flex; flex-wrap:wrap; gap:8px;}
  .domain-pill{
    font-size:12.5px; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.10); color:#C7D2DD;
    display:flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .domain-pill.covered{background:rgba(46,139,132,.30); color:#CDEDE9; border-color:rgba(46,139,132,.4);}

  /* ---------- Scenario editor ---------- */
  .lanes{display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:6px;}
  /* Step the option-card grid up to 2, then 3/4 columns as the panel widens, instead of
     squeezing every lane into one unwrapped row (which forced lanes past their own
     min-content width and let them spill past the panel's edge). */
  @container (min-width:480px){
    .lanes-2, .lanes-3, .lanes-4{grid-template-columns:repeat(2, minmax(240px,1fr));}
  }
  @container (min-width:480px) and (max-width:739.98px){
    .lanes-3 .lane:last-child{grid-column:1 / -1;} /* odd one out spans full width instead of leaving a dead half-row */
  }
  @container (min-width:740px){
    .lanes-3{grid-template-columns:repeat(3, minmax(240px,1fr));}
  }
  @container (min-width:1050px){
    .lanes-4{grid-template-columns:repeat(4, minmax(240px,1fr));}
  }
  .lane, .lane *{min-width:0;}
  .lane{
    border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:9px;
    border-top:6px solid var(--c); background:var(--soft); cursor:grab; position:relative;
  }
  .lane.dragging{opacity:.45;}
  .lane .lane-head{display:flex; align-items:center; justify-content:space-between;}
  .lane .lane-tag{
    font-family:var(--font-mono); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:#fff; background:var(--c); display:inline-block; padding:3px 9px; border-radius:6px;
  }
  .lane .move-btns{display:flex; gap:4px;}
  .lane .move-btns button{width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:#fff; font-size:11px; line-height:1; padding:0;}
  .icon-desc-box{display:flex; align-items:center; gap:8px; align-self:stretch;}
  .icon-desc-glyph{
    width:38px; height:38px; border-radius:10px; background:#fff; border:1.5px dashed var(--line); color:#B9AF8E;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-desc-glyph svg{width:20px; height:20px;}
  .icon-desc-glyph img{width:100%; height:100%; object-fit:cover; border-radius:8px;}
  .icon-desc-box input[type=text]{font-weight:500; font-style:italic; font-size:13px; flex:1;}
  .btn-icon-search{
    flex-shrink:0; padding:7px 12px; font-size:12px; font-weight:600; border-radius:8px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  }
  .btn-icon-search:hover{background:rgba(31,41,55,.06);}
  .lane input[type=text]{background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-weight:600;}
  .lane textarea{background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; min-height:78px; line-height:1.42; font-size:13.8px;}
  .wc{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-soft); text-align:right;}

  .balance-strip{
    margin-top:4px; padding:14px 16px; border-radius:10px; background:#fff; border:1.5px solid var(--line);
    font-size:13px; color:var(--ink-soft); margin-bottom:22px;
  }
  .balance-strip .bs-title{display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink); margin-bottom:8px;}
  .balance-strip .b-icon{font-size:16px;}
  .balance-strip ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px;}
  .balance-strip li{line-height:1.4;}

  .qlist{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
  .qrow{display:flex; gap:8px; align-items:center;}
  .qrow input{flex:1;}
  .qrow button{flex-shrink:0;}
  .add-row-btn{font-size:13px; font-weight:600; color:var(--ink-soft); background:none; border:1.5px dashed var(--line); border-radius:8px; padding:8px 12px; text-align:left;}
  .add-row-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .scenario-nav{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}

  /* ---------- Review ---------- */
  .print-card{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:34px; margin-bottom:20px;}
  .print-card .p-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#9B8F6E;}
  .print-card h2.p-title{font-size:30px; margin:6px 0 10px;}
  .print-card .p-blurb{font-size:15px; line-height:1.6; color:#3c3527; margin-bottom:4px;}
  .p-scenario{padding:18px 0; border-top:1px solid var(--line);}
  .p-scenario h4{font-size:17px; margin-bottom:6px; display:flex; align-items:baseline; gap:10px;}
  .p-preview-link{font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--lane-a); cursor:pointer; white-space:nowrap;}
  .p-preview-link:hover{text-decoration:underline;}
  .p-scenario .p-setup{font-size:14.5px; line-height:1.55; margin-bottom:12px; color:#3c3527;}
  .p-opts{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .p-opt{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:9px; border-left:5px solid var(--c); background:var(--soft);}
  .p-opt .p-opt-icon{width:20px; height:20px; flex-shrink:0; color:var(--c);}
  .p-opt .p-opt-icon svg{width:100%; height:100%;}
  .p-opt .p-opt-icon img{width:100%; height:100%; object-fit:contain;}
  .p-icon-desc{display:block; font-size:12px; font-style:italic; color:#8a7f5e; margin-top:4px;}
  .p-opt b{font-size:14px;}
  .p-opt span{display:block; font-size:13.5px; color:#3c3527; margin-top:2px;}
  .p-q-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:#9B8F6E; margin:10px 0 4px;}
  .p-cqs{font-size:13.5px; line-height:1.9; color:#3c3527;}
  .p-refl{font-size:13.5px; font-style:italic; color:#3c3527;}
  .p-half{padding:18px 0; border-top:2px dashed var(--line);}

  .review-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
  .status-badge{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:5px 11px; border-radius:999px; font-weight:600;}
  .status-draft{background:var(--lane-b-soft); color:#403A6E;}
  .status-submitted{background:var(--lane-c-soft); color:#7A5A16;}
  .status-reviewed{background:var(--lane-a-soft); color:#1E5B56;}
  .status-flagged{background:#F5D4CF; color:#8A241A;}

  .coach-notes{background:#fff; border-radius:10px; padding:16px 18px; border:1.5px solid var(--line);}
  .coach-note{padding:10px 0; border-bottom:1px dashed var(--line); font-size:13.8px; line-height:1.5;}
  .coach-note:last-child{border-bottom:none;}
  .coach-note .cn-meta{font-family:var(--font-mono); font-size:10.5px; color:#8B94A0; margin-bottom:3px;}

  /* ---------- Coach drawer ---------- */
  .coach-tab{
    position:fixed; right:0; top:calc(50% + 68px); transform:translateY(-50%) rotate(0deg); z-index:40;
    background:var(--ink); color:#F2EEE1; padding:14px 12px; border-radius:12px 0 0 12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:700; cursor:pointer;
    border:none;
  }
  .coach-drawer{
    position:fixed; top:0; right:0; height:100vh; width:380px; max-width:92vw; background:#fff; box-shadow:-8px 0 30px rgba(0,0,0,.35);
    z-index:50; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .18s cubic-bezier(.4,0,1,1);
  }
  .coach-drawer.open{transform:translateX(0); transition:transform .42s cubic-bezier(.34,1.56,.64,1);}
  .coach-head{padding:18px 18px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start;}
  .coach-head h3{font-size:16.5px;}
  .coach-head p{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .coach-close{background:none; border:none; font-size:20px; color:var(--ink-soft); line-height:1;}
  .coach-body{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; background:#FAF7EF;}
  .bubble{max-width:88%; padding:10px 13px; border-radius:12px; font-size:13.8px; line-height:1.5;}
  .bubble.user{align-self:flex-end; background:var(--ink); color:#F2EEE1; border-bottom-right-radius:3px;}
  .bubble.ai{align-self:flex-start; background:#fff; border:1.5px solid var(--line); border-bottom-left-radius:3px; white-space:pre-wrap;}
  .bubble.system-hint{align-self:center; background:var(--lane-c-soft); color:#7A5A16; font-size:12.5px; text-align:center;}
  .coach-foot{padding:14px 16px; border-top:1px solid var(--line); display:flex; gap:8px;}

  }

    position:fixed; right:0; top:calc(50% - 68px); transform:translateY(-50%); z-index:40;
    background:#B9791F; color:#fff; padding:14px 12px; border-radius:12px 0 0 12px; box-shadow:var(--shadow);

  .notes-focus{margin-bottom:22px; padding-bottom:18px; border-bottom:2px dashed rgba(0,0,0,.12);}

  .notes-empty{color:#A69A78; font-size:13px; font-style:italic; padding:10px 0;}
  .note-card{
    border-radius:8px; padding:10px 11px 8px; margin-bottom:10px; box-shadow:0 3px 8px rgba(0,0,0,.12);
    transform:rotate(-0.6deg);
  }
  .note-card:nth-child(even){transform:rotate(0.6deg);}
  .note-card.dragging{opacity:.4;}
  .note-card-head{display:flex; align-items:center; gap:6px; margin-bottom:6px;}

    color:rgba(0,0,0,.32); cursor:grab; padding:6px 7px; margin:-6px -7px -6px -3px; border-radius:5px;
    display:flex; align-items:center; flex-shrink:0;

  .note-drag-handle:hover{background:rgba(0,0,0,.06); color:rgba(0,0,0,.5);}

  .note-color-dot.selected{box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--ink);}
  .note-color-yellow, .note-color-dot.note-color-yellow{background:#F5E6A8;}
  .note-color-pink, .note-color-dot.note-color-pink{background:#F5C6D6;}
  .note-color-blue, .note-color-dot.note-color-blue{background:#C6DCF5;}
  .note-color-green, .note-color-dot.note-color-green{background:#C9E8CE;}
  .note-color-purple, .note-color-dot.note-color-purple{background:#DAC6F0;}
  .note-card.note-yellow{background:#F5E6A8;} .note-card.note-pink{background:#F5C6D6;}
  .note-card.note-blue{background:#C6DCF5;} .note-card.note-green{background:#C9E8CE;} .note-card.note-purple{background:#DAC6F0;}
  .note-delete{background:none; border:none; font-size:13px; color:rgba(0,0,0,.4); cursor:pointer; line-height:1;}
  .note-delete:hover{color:rgba(0,0,0,.7);}
  .note-card textarea{
    width:100%; background:rgba(255,255,255,.5); border:1px solid rgba(0,0,0,.08); border-radius:6px; padding:7px 8px;
    font-size:13px; min-height:52px; resize:vertical; color:#3c3527;
  }
  .note-composer{display:flex; flex-direction:column; gap:8px;}
  .note-composer textarea{
    border:1.5px solid var(--line); border-radius:8px; padding:9px 10px; font-size:13.5px; min-height:60px; resize:vertical; background:#fff;
  }

  /* ---------- Coach inbox ---------- */
  .inbox-row{
    background:var(--paper); border-radius:12px; padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow-sm); margin-bottom:10px; cursor:pointer; border-left:5px solid var(--lane-b);
  }
  .inbox-row:hover{transform:translateY(-1px);}
  .inbox-row .ir-left h4{font-size:15px; margin-bottom:3px;}
  .inbox-row .ir-left p{font-size:12.5px; color:var(--ink-soft); font-family:var(--font-mono);}
  .inbox-row.flagged-row{border-left:5px solid #C0392B; background:#FBEAE8;}
  .empty-state{color:#C7D2DD; text-align:center; padding:50px 20px; font-size:14.5px;}
  .banner{
    background:var(--lane-c-soft); border:1.5px solid var(--lane-c-line); color:#7A5A16; padding:12px 16px; border-radius:10px;

  }

  .guardrail-box ul{margin:10px 0 0; padding-left:18px; color:#C7D2DD; font-size:12.5px; line-height:1.7;}

  /* ============ Icon search modal (Noun Project results) ============ */
  .icon-search-backdrop{

  .icon-search-modal{

  .pp-card{
    background:#F8F8F6; border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,.35);
    width:100%; min-height:min(560px, 62vh); padding:44px 48px 34px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center; gap:18px;
  }
  .pp-h2{font-family:var(--font-display); font-weight:700; font-size:28px; color:#1D3A6E; margin:0;}
  .pp-setup{font-size:16px; line-height:1.5; color:#25303D; max-width:760px; margin:0;}
  .pp-card{container-type:inline-size;}
  .pp-opts{display:grid; grid-template-columns:minmax(140px,220px); gap:28px 34px; justify-content:center; margin-top:8px; width:100%;}
  .pp-opt{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:220px;}

     flex-wrap dumping a lonely leftover option onto its own row at in-between widths. */
  @container (min-width:340px){
    .pp-opts-2, .pp-opts-4{grid-template-columns:repeat(2, minmax(140px,220px));}
  }
  @container (min-width:520px){
    .pp-opts-3{grid-template-columns:repeat(3, minmax(140px,220px));}
  }
  @container (min-width:700px){
    .pp-opts-4{grid-template-columns:repeat(4, minmax(140px,220px));}
  }
  .pp-opt-icon{
    width:130px; height:130px; border-radius:14px; background:#EDECE7;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.08);

  .pp-opt-icon img{width:76px; height:76px; object-fit:contain;}
  .pp-opt-cap{font-size:14px; line-height:1.4; color:#25303D; max-width:100%;}
  .pp-checkopts{display:flex; flex-direction:column; gap:10px; width:100%; max-width:440px; margin-top:6px;}
  .pp-checkopt{background:#EDECE7; border-radius:10px; padding:12px 16px; font-size:14.5px; color:#25303D; text-align:left;}
  .pp-cqbar{
    width:100%; max-width:760px; margin-top:auto; background:#E4E2DA; border-radius:14px;

  .pp-cq{flex:1; font-size:15px; color:#2b2b28;}
  .pp-arrow{
    background:none; border:none; font-size:20px; color:#9A9585; width:28px; height:28px; flex:0 0 auto;
    border-radius:50%; opacity:.6;
  }
  .pp-scenav{
    width:100%; max-width:980px; display:flex; align-items:center; justify-content:space-between;
    margin-top:16px; color:#B9C4D0; font-size:12.5px;

  .pp-navbtn{
    background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.2);

  .pp-navbtn:not(:disabled):hover{background:rgba(255,255,255,.16);}

  .pp-progress-fill{height:100%; background:#6C8FC7; border-radius:2px; transition:width .3s ease;}
  @media (max-width:640px){
    .pp-card{padding:30px 22px 26px;}
    .pp-opt-icon{width:100px; height:100px;}
    .pp-opt-icon svg{width:44px; height:44px;}
    .pp-h2{font-size:22px;}
  }
</style>

/* ============================= UTIL ============================= */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function genCode(){
  var alpha = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var s = '';
  for(var i=0;i<5;i++){ s += alpha[Math.floor(Math.random()*alpha.length)]; }
  return s;
}
function wordCount(t){ t=(t||'').trim(); return t? t.split(/\s+/).length : 0; }
var isDirty = false;
function debounceSave(){
  isDirty = true;
  setSaveIndicator('unsaved');
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 600);
}
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  if(state.draft && isDirty) saveDraft();
  if(notesSaveTimer){ clearTimeout(notesSaveTimer); notesSaveTimer = null; }
  if(state.draft && notesDirty) saveNotes();
}
function downloadText(filename, text){
  var blob = new Blob([text], {type:'text/markdown'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function timeAgo(ts){
  if(!ts) return '';
  var s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function newOption(){ return {id:uid(), label:'', rationale:'', iconDescription:'', selectedIcon:null}; }
function newScenario(){
  var opts = [];

  for(var i=0;i<n;i++) opts.push(newOption());
  return {

  };

function newDraft(name){
  var d = {
    id: genCode(),

    title:'', bigIdea:'',
    optionCount: 3,

    halftime:{question:'', options:['',''], reflection:''},
    reflection:{question:'', options:['',''], reflection:''},
    aiChat: [],
    coachNotes: []
  };
  for(var i=0;i<6;i++) d.scenarios.push(newScenario.call(null));
  // rebuild scenarios now that optionCount is set on d (newScenario reads state.draft, so patch directly)
  d.scenarios = d.scenarios.map(function(){
    var opts=[]; for(var i=0;i<d.optionCount;i++) opts.push(newOption());

function attachKey(attach){

}

/* ============================= STORAGE ============================= */
var saveStatus = 'saved'; // 'saved' | 'unsaved' | 'saving' | 'failed'
function saveStatusText(status){
  return status==='saved' ? 'Saved ✓' : status==='saving' ? 'Saving…' : status==='failed' ? '⚠ Save failed' : 'Unsaved changes…';
}
function setSaveIndicator(status){
  saveStatus = status;
  var el = document.getElementById('saveIndicator');
  if(!el) return;
  el.className = 'rail-save-indicator '+status;
  el.textContent = saveStatusText(status);
}
function saveDraft(){
  if(!hasStorage || !state.draft) return;
  isDirty = false;
  state.draft.updatedAt = Date.now();
  setSaveIndicator('saving');
  window.storage.set('draft:'+state.draft.id, JSON.stringify(state.draft), true).then(function(){
    setSaveIndicator('saved');
  }).catch(function(e){
    console.error('save failed', e);
    isDirty = true;
    setSaveIndicator('failed');
  });
}
function patchLegacyDraft(d){
  if(!d) return d;
  if(typeof d.bigIdea !== 'string') d.bigIdea = d.blurb || '';
  if(!Array.isArray(d.customDomains)) d.customDomains = [];
  if(!Array.isArray(d.coachNotes)) d.coachNotes = [];
  if(!Array.isArray(d.aiChat)) d.aiChat = [];
  (d.scenarios||[]).forEach(function(sc){
    (sc.options||[]).forEach(function(o){
      if(typeof o.iconDescription !== 'string'){
        o.iconDescription = o.icon ? (LEGACY_ICON_LABELS[o.icon] || '') : '';
      }
      if(typeof o.selectedIcon === 'undefined') o.selectedIcon = null;
    });
  });
  return d;
}
function loadDraft(code){
  if(!hasStorage) return Promise.resolve(null);
  return window.storage.get('draft:'+code.trim().toUpperCase(), true)
    .then(function(r){ return r ? patchLegacyDraft(JSON.parse(r.value)) : null; })
    .catch(function(){ return null; });
}
function listAllDrafts(){
  if(!hasStorage) return Promise.resolve([]);
  return window.storage.list('draft:', true).then(function(r){
    var keys = (r && r.keys) || [];
    return Promise.all(keys.map(function(k){
      return window.storage.get(k, true).then(function(res){
        try{ return patchLegacyDraft(JSON.parse(res.value)); }catch(e){ return null; }
      }).catch(function(){ return null; });
    }));
  }).then(function(list){
    return list.filter(Boolean).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
  });
}

function normalizeUsername(u){ return (u||'').trim().toLowerCase(); }

function patchModeration(m){

function saveModeration(m){

function loadModeration(username){

    .catch(function(){ return newModerationRecord(username); });

function listModerationRecords(){
  if(!hasStorage) return Promise.resolve([]);
  return window.storage.list('moduser:', true).then(function(r){
    var keys = (r && r.keys) || [];
    return Promise.all(keys.map(function(k){
      return window.storage.get(k, true).then(function(res){
        try{ return patchModeration(JSON.parse(res.value)); }catch(e){ return null; }
      }).catch(function(){ return null; });
    }));
  }).then(function(list){
    return list.filter(Boolean).sort(function(a,b){ return (b.lockedAt||0)-(a.lockedAt||0); });

/* ---------- Notes storage: shared=false, so this is genuinely private — never fetchable by a coach's session ---------- */
function notesKey(draftId){ return 'notes:'+draftId; }

var STEP_LIST = [
  {key:'setup', label:'Setup'},
  {key:'storyboard', label:'Storyboard & halftime'},
  {key:'reflection', label:'Closing reflection'},
  {key:'review', label:'Review & send'}
];
function scenarioComplete(sc){
  return sc.title.trim() && sc.setup.trim() && sc.options.every(function(o){return o.label.trim() && o.rationale.trim();});
}
function stepDone(key){
  var d = state.draft;
  if(key==='setup') return !!(d.title.trim() && d.bigIdea.trim());
  if(key==='storyboard') return d.scenarios.every(scenarioComplete) && !!(d.halftime.question.trim());
  if(key==='reflection') return !!(d.reflection.question.trim());
  return false;
}
function railHtml(){
  var d = state.draft;
  var rows = STEP_LIST.map(function(s){
    var active = state.screen===s.key;
    var cls = 'rail-step'+(active?' active':'')+(stepDone(s.key)?' done':'');
    var html = '<div class="'+cls+'" data-action="nav" data-target="'+s.key+'"><span class="dot"></span>'+esc(s.label)+'</div>';
    if(s.key==='storyboard'){
      var scRows = d.scenarios.map(function(sc,i){
        var a = state.screen==='scenario' && state.scenarioIndex===i;
        return '<div class="rail-step'+(a?' active':'')+(scenarioComplete(sc)?' done':'')+'" style="font-size:12.5px; padding:6px 10px;" data-action="openScenario" data-idx="'+i+'"><span class="dot"></span>'+(i+1)+'. '+esc(sc.title||'Untitled')+'</div>';
      });
      var halftimeRow = '<div class="rail-step'+(state.screen==='halftimeEditor'?' active':'')+(d.halftime.question.trim()?' done':'')+'" style="font-size:12.5px; padding:6px 10px;" data-action="openHalftime"><span class="dot"></span>🚩 Halftime</div>';
      scRows.splice(3, 0, halftimeRow);
      html += '<div class="rail-scenarios">'+scRows.join('')+'</div>';
    }
    return html;
  }).join('');
  return ''+
  '<div class="rail">'+
    '<div class="rail-code">CODE ' + esc(d.id) + '</div>'+
    '<div class="rail-name">'+esc(d.studentName)+'\'s session</div>'+
    rows+
    '<div class="rail-spacer"></div>'+
    '<span id="saveIndicator" class="rail-save-indicator '+saveStatus+'">'+saveStatusText(saveStatus)+'</span>'+
    '<div class="rail-bottom">'+
      '<button class="btn btn-ghost-light btn-small" data-action="goHome">← Save &amp; exit</button>'+
    '</div>'+
  '</div>';
}
function renderShellDraft(){
  var body = '';

  else if(state.screen==='storyboard') body = renderStoryboard();
  else if(state.screen==='scenario') body = renderScenario();
  else if(state.screen==='halftimeEditor') body = renderHalftimeEditor();
  else if(state.screen==='reflection') body = renderReflection();
  else if(state.screen==='review') body = renderReview();
  return '<div class="shell">'+railHtml()+'<div class="main">'+body+'</div></div>';
}

/* ---------- Setup ---------- */
function renderSetup(){
  var d = state.draft;
  return ''+
  '<div class="page-head" data-drop-attach="'+esc(JSON.stringify({type:'setup'}))+'"><div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;"><div class="eyebrow">STEP 1</div>'+renderNoteTab({type:'setup'})+'</div><h2>Set up your session</h2><p>Every session starts with a title and the big idea behind it. Our team will turn this into the official intro.</p></div>'+
  '<div class="panel">'+
    '<div class="field"><label>Title</label><input type="text" data-bind="title" value="'+esc(d.title)+'" placeholder="e.g. Fixed or Flexible?"><div class="hint">A short phrase, often a question. 1-4 words.</div></div>'+
    '<div class="field"><label>Overall idea for this session</label><textarea data-bind="bigIdea" placeholder="What real-life tension does this session explore? Why does it matter to you?" style="min-height:220px;">'+esc(d.bigIdea)+'</textarea><div class="hint">More detail helps — context, examples, why it matters. Every session ends with the same spirit: "'+MANTRA+'"</div></div>'+
  '</div>'+
  (d.coachNotes.length? renderCoachNotesPreview() : '')+
  '<button class="btn btn-primary" data-action="nav" data-target="storyboard">Next: build your storyboard →</button>';

function renderCoachNotesPreview(){

  return '<div class="banner">📝 Your coach left a note: "'+esc(last.text.slice(0,120))+(last.text.length>120?'…':'')+'" — see the Review page for the full note.</div>';

/* ---------- Storyboard ---------- */
function renderHalftimeCard(d){
  var h = d.halftime;
  var attach = {type:'halftime'};
  return ''+
  '<div class="index-card halftime-card" data-action="openHalftime" data-drop-attach="'+esc(JSON.stringify(attach))+'">'+
    '<span class="halftime-pin">🚩</span>'+
    '<div class="num">HALFTIME · AFTER SCENARIO 3</div>'+
    '<h4>'+(h.question.trim()? esc(h.question.slice(0,70))+(h.question.length>70?'…':'') : '<span class="empty">Click to write the halftime check-in</span>')+'</h4>'+
    '<div style="display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap;">'+
      '<span class="domain-chip">📌 Fixed here — can\'t be dragged</span>'+
      renderNoteTab(attach)+
    '</div>'+
  '</div>';
}
function renderStoryboard(){
  var d = state.draft;
  var cardEls = d.scenarios.map(function(sc,i){
    var rot = (i%2===0? -1.2 : 1.4) * (1 + (i%3)*0.3);
    var attach = {type:'scenario', scenarioIndex:i};
    return ''+
    '<div class="index-card" style="--r:'+rot+'deg" draggable="true" data-action="openScenario" data-idx="'+i+'" data-drag="scenario" data-dragidx="'+i+'" data-drop-attach="'+esc(JSON.stringify(attach))+'">'+
      '<div class="pin"></div>'+
      '<div class="num">SCENARIO '+(i+1)+' OF 6</div>'+
      '<h4>'+(sc.title? esc(sc.title) : '<span class="empty">Untitled — click to write</span>')+'</h4>'+
      (sc.setup? '<div style="font-size:12px; color:#7a7156; line-height:1.4;">'+esc(sc.setup.slice(0,70))+(sc.setup.length>70?'…':'')+'</div>' : '')+
      '<div style="display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap;">'+
        (sc.domain? '<span class="domain-chip">'+esc(sc.domain)+'</span>' : '')+
        renderNoteTab(attach)+
      '</div>'+
    '</div>';
  });
  cardEls.splice(3, 0, renderHalftimeCard(d));
  var cards = cardEls.join('');

  var covered = {};
  d.scenarios.forEach(function(sc){ if(sc.domain) covered[sc.domain]=true; });
  var basePills = BASE_DOMAINS.filter(function(x){return x!=='Other';}).map(function(label){
    return '<span class="domain-pill'+(covered[label]?' covered':'')+'">'+(covered[label]?'✓':'•')+' '+esc(label)+'</span>';
  });
  var customPills = (d.customDomains||[]).filter(function(c){return covered[c];}).map(function(label){
    return '<span class="domain-pill covered">✓ '+esc(label)+'</span>';
  });
  var pills = basePills.concat(customPills).join('');

  return ''+
  '<div class="page-head"><div class="eyebrow">STEP 2</div><h2>Your storyboard</h2><p>Drag the scenario cards to set their order. Click any card to write it — the halftime card always stays put, right after scenario 3.</p></div>'+
  '<div style="margin-bottom:14px;">'+renderNoteTab({type:'storyboard'})+' <span style="color:#8B98A6; font-size:12px; margin-left:6px;">General notes about this session</span></div>'+
  '<div class="board" data-drop-attach="'+esc(JSON.stringify({type:'storyboard'}))+'">'+
    '<div style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:20px;">'+
      '<div>'+
        '<div style="color:#fff; font-weight:600; font-size:14px; margin-bottom:8px;">How many options per scenario?</div>'+
        '<div class="radio-cards" style="max-width:340px;">'+
          [2,3,4].map(function(n){
            return '<div class="radio-card'+(d.optionCount===n?' selected':'')+'" data-action="setOptionCount" data-n="'+n+'">'+n+' options</div>';
          }).join('')+
        '</div>'+
        '<div style="font-size:11.5px; color:#8B98A6; margin-top:8px; max-width:340px;">Every scenario in the session uses the same number of options.</div>'+
      '</div>'+
    '</div>'+
    '<div class="board-grid">'+cards+'</div>'+
    '<div class="domain-panel"><h4>Domain check — try to spread across a few of these</h4><div class="domain-list">'+pills+'</div><div style="font-size:11.5px; color:#8B98A6; margin-top:8px;">Don\'t see the right fit? Add your own domain from inside a scenario.</div></div>'+
  '</div>'+
  '<details class="guardrail-box"><summary>Remember: the Balance Test</summary><ul>'+
    '<li>Every option should have a real reason to choose it.</li>'+
    '<li>Try to avoid words that make one option sound better or worse.</li>'+
    '<li>Synthesis students come from all over the world. Avoid using real people, sensitive issues, or inappropriate topics.</li>'+
  '</ul></details>'+
  '<div style="margin-top:18px; display:flex; gap:10px; justify-content:space-between;">'+
    '<button class="btn btn-ghost-light" data-action="nav" data-target="setup">← Back to setup</button>'+
    '<button class="btn btn-primary" data-action="nav" data-target="reflection">Next: closing reflection →</button>'+
  '</div>';
}

/* ---------- Scenario editor ---------- */
function iconGlyphHtml(o){
  return o.selectedIcon
    ? '<img class="icon-desc-thumb" src="'+esc(o.selectedIcon.thumbnailUrl)+'" alt="">'
    : ICON_PLACEHOLDER_SVG;
}
function iconSearchBtnHtml(o, scenarioIdx, optionIdx){
  if(!ICON_SEARCH_ENABLED) return '';
  var attrs = 'data-action="openIconSearch" data-scenarioidx="'+scenarioIdx+'" data-oidx="'+optionIdx+'" title="Search real icons on the Noun Project"';
  return '<button type="button" class="btn-icon-search" '+attrs+'>'+(o.selectedIcon ? 'Change icon' : 'Search icons')+'</button>';
}
function renderScenario(){
  var d = state.draft, i = state.scenarioIndex, sc = d.scenarios[i];
  var domainOpts = allDomains().map(function(label){return '<option value="'+esc(label)+'"'+(sc.domain===label?' selected':'')+'>'+esc(label)+'</option>';}).join('');
  domainOpts += '<option value="__add_new__">+ Add a new domain…</option>';
  var lanesHtml = sc.options.map(function(o,oi){
    var lane = LANES[oi];
    var optAttach = {type:'option', scenarioIndex:i, optionIndex:oi};
    return ''+
    '<div class="lane" style="--c:'+lane.color+'; --soft:'+lane.soft+'" draggable="true" data-drag="lane" data-dragidx="'+oi+'" data-drop-attach="'+esc(JSON.stringify(optAttach))+'">'+
      '<div class="lane-head"><span class="lane-tag">Option '+(oi+1)+'</span>'+
        '<div class="move-btns">'+
          (oi>0? '<button data-action="moveLane" data-idx="'+oi+'" data-dir="-1" title="Move left">◀</button>' : '')+
          (oi<sc.options.length-1? '<button data-action="moveLane" data-idx="'+oi+'" data-dir="1" title="Move right">▶</button>' : '')+
        '</div>'+
      '</div>'+
      renderNoteTab(optAttach)+
      '<div class="icon-desc-box"><span class="icon-desc-glyph">'+iconGlyphHtml(o)+'</span><input type="text" data-bind="option.iconDescription" data-oidx="'+oi+'" value="'+esc(o.iconDescription)+'" placeholder="Describe the icon, e.g. a simple shield">'+iconSearchBtnHtml(o, i, oi)+'</div>'+
      '<input type="text" data-bind="option.label" data-oidx="'+oi+'" value="'+esc(o.label)+'" placeholder="Option label">'+
      '<textarea data-bind="option.rationale" data-oidx="'+oi+'" placeholder="Its own genuine, confident reason...">'+esc(o.rationale)+'</textarea>'+
      '<div class="wc">'+wordCount(o.rationale)+' words</div>'+
    '</div>';
  }).join('');

  var balHtml = '<div class="balance-strip"><div class="bs-title"><span class="b-icon">⚖️</span>Balance self-check</div><ul>'+
    '<li>Does every option have its own real reason behind it?</li>'+
    '<li>If your friend picked an option you didn\'t pick, would you understand why they thought that way?</li>'+
    '<li>Are there words in any of the options that make it sound obviously smarter, safer, or kinder than the rest?</li>'+
  '</ul></div>';

  var chQ = sc.challenge.map(function(q,qi){
    return '<div class="qrow"><input type="text" data-bind="challenge" data-qidx="'+qi+'" value="'+esc(q)+'" placeholder="Challenge question '+(qi+1)+'">'+
      (sc.challenge.length>2? '<button class="btn-icon" data-action="removeChallenge" data-qidx="'+qi+'">✕</button>' : '')+
    '</div>';
  }).join('');

  return ''+
  '<div class="page-head" data-drop-attach="'+esc(JSON.stringify({type:'scenario', scenarioIndex:i}))+'"><div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;"><div class="glass-pill"><span class="eyebrow">SCENARIO '+(i+1)+' OF 6</span></div>'+renderNoteTab({type:'scenario', scenarioIndex:i})+'<button class="btn btn-ghost-light btn-small" data-action="openPlayerPreview" data-kind="scenario" style="margin-left:auto;">👁 Preview as students will see it</button></div><h2>'+esc(sc.title||'Untitled scenario')+'</h2><p>Real sessions run about 4 minutes per scenario. Setup is 1-3 sentences, second person, ending in a question.</p></div>'+
  '<div class="panel">'+
    '<div class="row">'+
      '<div class="field"><label>Scenario title</label><input type="text" data-bind="scTitle" value="'+esc(sc.title)+'" placeholder="e.g. The Group Project"></div>'+
      '<div class="field"><label>Domain</label><select data-bind="scDomain"><option value="">Choose one…</option>'+domainOpts+'</select>'+
        (state.addingCustomDomain ? (
          '<div style="display:flex; gap:8px; margin-top:8px;">'+
            '<input type="text" id="newDomainInput" placeholder="e.g. Sports, Online Gaming" style="flex:1; padding:9px 11px; border-radius:8px; border:1.5px solid var(--line);">'+
            '<button class="btn btn-primary btn-small" data-action="addCustomDomain">Add</button>'+
            '<button class="btn btn-ghost btn-small" data-action="cancelCustomDomain">Cancel</button>'+
          '</div>'
        ) : '')+
      '</div>'+
    '</div>'+
    '<div class="field"><label>Setup</label><textarea data-bind="scSetup" placeholder="You are... What do you do? Why?">'+esc(sc.setup)+'</textarea></div>'+
  '</div>'+
  '<div class="panel">'+
    '<h3>Options — drag to reorder, they should feel equally good</h3>'+
    '<div class="hint" style="margin-bottom:12px; font-size:12.5px; color:var(--ink-soft);">For each option, describe the icon you imagine — simple and black-and-white, like the icons real Synthesis sessions use. Our design team will illustrate it.</div>'+
    '<div class="lanes lanes-'+sc.options.length+'">'+lanesHtml+'</div>'+
    balHtml+
  '</div>'+
  '<div class="panel">'+
    '<h3>Challenge questions</h3>'+
    '<div class="qlist">'+chQ+'</div>'+
    (sc.challenge.length<4? '<button class="add-row-btn" data-action="addChallenge">+ Add another challenge question</button>' : '')+
    '<div class="field" style="margin-top:16px;"><label>Reflection question</label><textarea data-bind="scReflection" placeholder="Turn it toward your own life or your team today...">'+esc(sc.reflection)+'</textarea></div>'+
  '</div>'+
  '<div class="scenario-nav">'+
    '<button class="btn btn-ghost-light" data-action="prevScenario" '+(i===0?'disabled':'')+'>← Scenario '+i+'</button>'+
    (AI_ASSISTANT_ENABLED? '<button class="btn btn-ghost-light" data-action="askCoachScenario">💬 Ask my assistant about this scenario</button>' : '')+
    (i<5? '<button class="btn btn-primary" data-action="nextScenario">Scenario '+(i+2)+' →</button>' : '<button class="btn btn-primary" data-action="nav" data-target="storyboard">Back to storyboard →</button>')+
  '</div>';
}

/* ---------- Halftime editor (reached by clicking the halftime card) ---------- */
function renderHalftimeEditor(){
  var d = state.draft, h = d.halftime;
  return ''+
  '<div class="page-head" data-drop-attach="'+esc(JSON.stringify({type:'halftime'}))+'"><div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;"><div class="eyebrow">HALFTIME · AFTER SCENARIO 3</div>'+renderNoteTab({type:'halftime'})+'<button class="btn btn-ghost-light btn-small" data-action="openPlayerPreview" data-kind="halftime" style="margin-left:auto;">👁 Preview as students will see it</button></div><h2>Halftime check-in</h2><p>A short pulse-check, not a 7th scenario. This card always stays put on the storyboard.</p></div>'+

    '<div class="field" style="margin-top:14px;"><label>Forward-looking reflection line</label><textarea data-bind="halftimeRefl" placeholder="One short line setting up the second half">'+esc(h.reflection)+'</textarea></div>'+
  '</div>'+
  '<div style="display:flex; gap:10px; justify-content:space-between;">'+

    '<button class="btn btn-primary" data-action="nav" data-target="reflection">Next: closing reflection →</button>'+
  '</div>';
}

/* ---------- Reflection (shared options-editor layout) ---------- */
function renderOptionsEditor(obj, kind){
  var rows = obj.options.map(function(o,oi){
    return '<div class="qrow"><input type="text" data-bind="'+kind+'Opt" data-oidx="'+oi+'" value="'+esc(o)+'" placeholder="Option '+(oi+1)+'">'+
      (obj.options.length>2? '<button class="btn-icon" data-action="remove'+kind+'Opt" data-oidx="'+oi+'">✕</button>' : '')+

function renderReflection(){

  return ''+
  '<div class="page-head" data-drop-attach="'+esc(JSON.stringify({type:'reflection'}))+'"><div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;"><div class="eyebrow">STEP 3</div>'+renderNoteTab({type:'reflection'})+'<button class="btn btn-ghost-light btn-small" data-action="openPlayerPreview" data-kind="reflection" style="margin-left:auto;">👁 Preview as students will see it</button></div><h2>Closing reflection</h2><p>What do you want people to consider as the session ends?</p></div>'+
  '<div class="panel">'+

    '<div class="field" style="margin-top:14px;"><label>Closing line</label><textarea data-bind="reflectionRefl" placeholder="A line that reinforces there\'s no universal winner">'+esc(r.reflection)+'</textarea></div>'+
  '</div>'+
  '<div style="display:flex; gap:10px; justify-content:space-between;">'+
    '<button class="btn btn-ghost-light" data-action="nav" data-target="storyboard">← Back to storyboard</button>'+
    '<button class="btn btn-primary" data-action="nav" data-target="review">Next: review &amp; send →</button>'+
  '</div>';

/* ---------- Player preview (real Discussion Session look) ---------- */
function renderPPScenario(sc, i){
  var optsHtml = sc.options.map(function(o){
    var iconHtml = o.selectedIcon
      ? '<img src="'+esc(o.selectedIcon.iconUrl || o.selectedIcon.thumbnailUrl)+'" alt="">'
      : ppIconFor((o.iconDescription||'')+' '+(o.label||'')+' '+(o.rationale||''));
    var label = o.label.trim() || 'Untitled option';
    var rationale = o.rationale.trim();
    return '<div class="pp-opt"><div class="pp-opt-icon">'+iconHtml+'</div><div class="pp-opt-cap"><b>'+esc(label)+'</b>'+(rationale? ': '+esc(rationale):'')+'</div></div>';
  }).join('');
  var cq = sc.challenge.filter(function(q){return q.trim();})[0] || '';
  return ''+
  '<h2 class="pp-h2">Scenario '+(i+1)+': '+esc(sc.title||'Untitled Scenario')+'</h2>'+
  '<p class="pp-setup">'+esc(sc.setup||'(setup not written yet)')+'</p>'+
  '<div class="pp-opts pp-opts-'+sc.options.length+'">'+optsHtml+'</div>'+
  (cq ? '<div class="pp-cqbar"><button class="pp-arrow" disabled>‹</button><div class="pp-cq"><span class="pp-cq-label">CHALLENGE QUESTION</span>'+esc(cq)+'</div><button class="pp-arrow" disabled>›</button></div>' : '');
}
function renderPPCheckin(block, headerLabel){
  var opts = (block.options||[]).filter(function(o){return o.trim();});
  var optsHtml = opts.map(function(o){ return '<div class="pp-checkopt">'+esc(o)+'</div>'; }).join('');
  return ''+
  '<h2 class="pp-h2">'+esc(headerLabel)+'</h2>'+
  '<p class="pp-setup">'+esc(block.question||'(question not written yet)')+'</p>'+
  (optsHtml? '<div class="pp-checkopts">'+optsHtml+'</div>' : '')+
  (block.reflection? '<div class="pp-cqbar"><div class="pp-cq"><span class="pp-cq-label">'+(headerLabel==='Halftime'?'LOOKING AHEAD':'REFLECTION')+'</span>'+esc(block.reflection)+'</div></div>' : '');
}
function renderPlayerPreview(){
  var d = state.draft, kind = state.ppKind;
  var title = d.title || 'Untitled Session';
  var body, i;
  if(kind==='scenario'){
    i = Math.max(0, Math.min(5, state.ppScenarioIndex));
    body = renderPPScenario(d.scenarios[i], i);
  } else if(kind==='halftime'){
    body = renderPPCheckin(d.halftime, 'Halftime');
  } else {
    body = renderPPCheckin(d.reflection, 'Closing Reflection');
  }
  return ''+
  '<div class="pp-screen">'+
    '<div class="pp-topbar"><span class="pp-brand">Discussion</span><span class="pp-dot">◆</span><span class="pp-title">'+esc(title)+'</span>'+
      '<button class="pp-exit" data-action="closePlayerPreview">✕ Exit preview</button>'+
    '</div>'+
    '<div class="pp-stage"><div class="pp-card">'+body+'</div></div>'+
    (kind==='scenario' ? ''+
      '<div class="pp-scenav">'+
        '<button class="pp-navbtn" data-action="ppPrevScenario"'+(i===0?' disabled':'')+'>← Scenario '+i+'</button>'+
        '<span>Previewing scenario '+(i+1)+' of 6</span>'+
        '<button class="pp-navbtn" data-action="ppNextScenario"'+(i===5?' disabled':'')+'>Scenario '+(i+2)+' →</button>'+
      '</div>' : '')+
    '<div class="pp-progress-track"><div class="pp-progress-fill" style="width:'+(kind==='scenario'? Math.round(((i+1)/6)*100) : kind==='halftime'? 50 : 100)+'%"></div></div>'+
  '</div>';
}

/* ---------- Review ---------- */
function renderReviewPreview(d){
  var scenarioBlocks = d.scenarios.map(function(sc,i){
    var opts = sc.options.map(function(o,oi){
      var lane = LANES[oi];
      var iconHtml = o.selectedIcon
        ? '<img src="'+esc(o.selectedIcon.thumbnailUrl)+'" alt="">'
        : ICON_PLACEHOLDER_SVG;
      return '<div class="p-opt" style="--c:'+lane.color+'; --soft:'+lane.soft+'"><span class="p-opt-icon">'+iconHtml+'</span><div><b>'+esc(o.label||'(untitled option)')+'.</b><span>'+esc(o.rationale)+'</span>'+(o.iconDescription? '<span class="p-icon-desc">🖼 Icon idea: '+esc(o.iconDescription)+'</span>' : '')+'</div></div>';
    }).join('');
    var cqs = sc.challenge.filter(function(q){return q.trim();}).map(function(q){return '<div>'+esc(q)+'</div>';}).join('');
    var block = '<div class="p-scenario"><h4>Scenario '+(i+1)+': '+esc(sc.title||'Untitled')+'<span class="p-preview-link" data-action="openPlayerPreview" data-kind="scenario" data-idx="'+i+'">👁 Preview</span></h4>'+
      '<div class="p-setup">'+esc(sc.setup)+'</div>'+
      '<div class="p-opts">'+opts+'</div>'+
      (cqs? '<div class="p-q-label">Challenge questions</div><div class="p-cqs">'+cqs+'</div>' : '')+
      (sc.reflection? '<div class="p-q-label">Reflection question</div><div class="p-refl">'+esc(sc.reflection)+'</div>' : '')+
    '</div>';
    return block;
  });
  var half = d.halftime, refl = d.reflection;
  var halftimeBlock = '<div class="p-half"><h4>Halftime</h4><div class="p-setup">'+esc(half.question)+'</div><div class="p-cqs">'+half.options.filter(function(o){return o.trim();}).map(function(o){return '• '+esc(o);}).join('<br>')+'</div>'+(half.reflection? '<div class="p-q-label">Reflection</div><div class="p-refl">'+esc(half.reflection)+'</div>':'')+'</div>';
  var reflectionBlock = '<div class="p-half"><h4>Closing Reflection</h4><div class="p-setup">'+esc(refl.question)+'</div><div class="p-cqs">'+refl.options.filter(function(o){return o.trim();}).map(function(o){return '• '+esc(o);}).join('<br>')+'</div>'+(refl.reflection? '<div class="p-q-label">Reflection</div><div class="p-refl">'+esc(refl.reflection)+'</div>':'')+'</div>';

  var ideaBlock = d.bigIdea ? ('<div class="p-blurb"><span class="p-q-label" style="margin:0 0 4px;">The big idea</span><br>'+esc(d.bigIdea)+'</div>') : '';

  return ''+
  '<div class="print-card">'+
    '<div class="p-eyebrow">SYNTHESIS DISCUSSION SESSION</div>'+
    '<h2 class="p-title">'+esc(d.title||'Untitled Session')+'</h2>'+
    ideaBlock+
